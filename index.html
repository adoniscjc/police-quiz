张 X 在三年前有一次运送他人偷\n越国境的违法行为，该违法行为已经超过追究时效，故不再处罚。"},{"id":132,"type":"单选题","question":"根据《公安机关办理行政案件程序规定》，以下案件可以调解的是（）。","choices":[{"key":"A","text":"张某因工作矛盾对王某怀恨在心，遂找到无业人员刘某殴打王某，承诺事后给\n刘某 500 元好处费，刘某遂将王某打成轻微伤"},{"key":"B","text":"吕某在小区通道随意停车影响吴某车辆进出，双方在争吵过程中，吕某用脚踢\n吴某车辆右前门，造成车辆损失价值 1500 元"},{"key":"C","text":"秦某因嫉妒同事宋某工作能力强，对其当众辱骂，情节较轻，宋某报警后，明\n确表示不接受调解"},{"key":"D","text":"夏某与周某、唐某在某饭店就餐过程中，因琐事与邻桌就餐的方某发生口角，\n夏某、周某和唐某联手将方某打成轻微伤"}],"answer":"B","explanation":"根据《公安机关办理行政案件程序规定》第一百七十八条第一款规定：\n“对\n于因民间纠纷引起的殴打他人、故意伤害、侮辱、诽谤、诬告陷害、故意损毁财\n物、干扰他人正常生活、侵犯隐私、非法侵入住宅等违反治安管理行为，情节较\n轻，且具有下列情形之一的，可以调解处理：（一）亲友、邻里、同事、在校学\n生之间因琐事发生纠纷引起的；（二）行为人的侵害行为系由被侵害人事前的过\n错行为引起的；（三）其他适用调解处理更易化解矛盾的。”\n根据《公安机关办理行政案件程序规定》第一百七十九条规定：“具有下列情形\n之一的，不适用调解处理：（一）雇凶伤害他人的；（二）结伙斗殴或者其他寻\n衅滋事的；（三）多次实施违反治安管理行为的；（四）当事人明确表示不愿意\n调解处理的；（五）当事人在治安调解过程中又针对对方实施违反治安管理行为\n的；（六）调解过程中，违法嫌疑人逃跑的；（七）其他不宜调解处理的。”\nA 项错误，张某雇凶伤害他人，不适用调解处理。\nB 项正确，吕某和吴某在同一小区，因偶发矛盾产生争执，继而引发故意毁坏财\n物行为，情节较轻，可以调解处理。\nC 项错误，宋某明确表示不愿意调解，不适用调解处理。\nD 项错误，夏某、周某和唐某结伙殴打他人，不适用调解处理。"},{"id":133,"type":"多选题","question":"强制措施是公安司法机关按照法定程序限制或剥夺犯罪嫌疑人、被告人人身自由\n的预防性、临时性措施。甲、乙、丙、丁四人因不同原因被采取刑事强制措施，\n下列说法不正确的有（）。","choices":[{"key":"A","text":"甲被公安机关拘传，若甲的人身危险性不大，可不使用约束性警械"},{"key":"B","text":"人民检察院对乙决定取保候审，乙有义务向公安机关报告住址、工作单位、联\n系方式变动的信息"},{"key":"C","text":"丙因涉嫌恐怖活动犯罪被公安机关刑事拘留，公安机关应当在丙被拘留 24 小\n时内通知其家属"},{"key":"D","text":"丁因涉嫌组织黑社会性质组织罪被公安机关批准逮捕，应立即交刑侦部门执行"}],"answer":"AD","explanation":"A 项错误，根据《公安机关办理刑事案件程序规定》第一百五十七条规定：\n“对犯罪嫌疑人执行拘传、拘留、逮捕、押解过程中，应当依法使用约束性警械。\n遇有暴力性对抗或者暴力犯罪行为，可以依法使用制服性警械或者武器。”甲被\n公安机关拘传，应当使用约束性警械。\nB 项正确，根据《公安机关办理刑事案件程序规定》第八十九条规定：“公安机\n关在宣布取保候审决定时，应当告知被取保候审人遵守以下规定：（一）未经执\n行机关批准不得离开所居住的市、县；（二）住址、工作单位和联系方式发生变\n动的，在二十四小时以内向执行机关报告；（三）在传讯的时候及时到案；（四）\n不得以任何形式干扰证人作证；（五）不得毁灭、伪造证据或者串供。”人民检\n察院对乙决定取保候审，乙有义务向公安机关报告住址、工作单位、联系方式变\n动的信息。\nC 项正确，根据《公安机关办理刑事案件程序规定》第一百二十七条规定：“除\n无法通知或者涉嫌危害国家安全犯罪、恐怖活动犯罪通知可能有碍侦查的情形以\n外，应当在拘留后二十四小时以内制作拘留通知书，通知被拘留人的家属。拘留\n通知书应当写明拘留原因和羁押处所。”丙因涉嫌恐怖活动犯罪被公安机关刑事\n拘留但本题中未提及通知可能有碍侦查，公安机关应在拘留后 24 小时以内通知\n家属。\nD 项错误，根据《公安机关办理刑事案件程序规定》第一百四十二条规定：“接\n到人民检察院批准逮捕决定书后，应当由县级以上公安机关负责人签发逮捕证，\n立即执行，并在执行完毕后三日以内将执行回执送达作出批准逮捕决定的人民检\n察院。如果未能执行，也应当将回执送达人民检察院，并写明未能执行的原因。”\n应由人民检察院批准逮捕而非公安机关。"},{"id":134,"type":"判断题","question":"南华县公安局民警在治安检查中尚场抓族正自赌博的杨 X、孙 X、胡 X。当场查\n获赌资 1000 余元。公安机关对他们可以当场作出行政处罚决定。","choices":[],"answer":"错误","explanation":"根据《公安机关办理行政案件程序规定》第三十七条第二款规定：“涉及\n卖淫、嫖娼、赌博、毒品的案件，不适用当场处罚。”杨 X、孙 X、胡 X 三人赌\n博，属于不适用当场处罚的情形，因此，不能当场作出行政处罚决定。"},{"id":135,"type":"单选题","question":"巡逻工作是公安民警日常的勤务活动，也是履行职责的重要勤务方式之一，更是\n适应社会治安新形势，实现对社会面动态有效控制的主动勤务方式。解放路派出\n所初任民警小李在巡逻中的下列做法，不属于履行巡逻警察职责的行为是（）。","choices":[{"key":"A","text":"路口发生一起汽车与电动车相撞事故，电动车骑行人员躺倒在地，小李当即上\n前救助伤者"},{"key":"B","text":"路人甲在临街店铺排队购物，乙意图插队被甲制止，二人发生口角，当即动手\n互殴，小李立即上前劝阻并制止"},{"key":"C","text":"路遇某民警，该民警身穿警服、卷着裤腿、脚穿“人字拖”，小李以巡警身份\n上前纠正该民警警容风纪问题"},{"key":"D","text":"路遇一对青年情侣在街心公园吵架，小李立即上前劝解"}],"answer":"D","explanation":"根据《城市人民警察巡逻规定》第四条规定：“人民警察在巡逻执勤中履\n行以下职责：（一）维护警区内的治安秩序；（二）预防和制止违反治安管理的\n行为；（三）预防和制止犯罪行为；（四）警戒突发性治安事件现场，疏导群众，\n维持秩序；（五）参加处理非法集会、游行、示威活动；（六）参加处置灾害事\n故，维持秩序，抢救人员和财物；（七）维护交通秩序；（八）制止妨碍国家工\n作人员依法执行职务的行为；（九）接受公民报警；（十）劝解、制止在公共场\n所发生的民间纠纷；（十一）制止精神病人、醉酒人的肇事行为；（十二）为行\n人指路，救助突然受伤、患病、遇险等处于无援状态的人，帮助遇到困难的残疾\n人、老人和儿童；（十三）受理拾遗物品，设法送还失主或送交给拾物招领部门；\n（十四）巡察警区安全防范情况，提示沿街有关单位、居民消除隐患；（十五）\n纠察人民警察警容风纪；（十六）执行法律、法规规定由人民警察执行的其他任\n务。”\nA 项正确，电动车骑行人员躺倒在地，小李当即上前救助伤者，这属于救助突然\n受伤等处于无援状态的人，是巡逻民警职责所在。\nB 项正确，二人发生口角，当即动手互殴，小李立即上前劝阻并制止，这属于制\n止违反治安管理的行为，是巡逻民警职责所在。\nC 项正确，巡逻民警有纠察人民警察警容风纪的职责，民警身穿警服、卷着裤腿、\n脚穿“人字拖”，着装不规范属于警容风纪问题，巡逻民警提醒其着装不规范是\n职责所在。\nD 项错误，一对青年情侣在街心公园吵架属于私人感情纠纷，不属于巡逻民警调\n解化解的范围。"},{"id":136,"type":"多选题","question":"在侦查一起非法吸收公众存款案件过程中，公安机关邀请本案部分受害人对犯罪\n嫌疑人甲开展辨认。下列关于辨认的表述，错误的有（）。","choices":[{"key":"A","text":"为了提高办案效率，组织多名被害人一起对甲进行辨认"},{"key":"B","text":"为解决警力紧张问题，公安机关组织辨认时可以由一名民警携带一名辅警主持"},{"key":"C","text":"辨认人不愿意公开进行的，应当取消其辨认资格"},{"key":"D","text":"让被害人和甲相互辨认"}],"answer":"ABCD","explanation":"A、B 项错误，根据《公安机关办理刑事案件程序规定》第二百五十九条\n规定： “辨认应当在侦查人员的主持下进行。主持辨认的侦查人员不得少于二人。\n几名辨认人对同一辨认对象进行辨认时，应当由辨认人个别进行。”多名被害人\n对犯罪嫌疑人甲的辨认，应当个别进行。组织辨认时，侦查人员不得少于二人，\n不能由一名民警携带一名辅警完成。\nC 项错误，根据《公安机关办理刑事案件程序规定》第二百六十一条规定：“对\n犯罪嫌疑人的辨认，辨认人不愿意公开进行时，可以在不暴露辨认人的情况下进\n行，并应当为其保守秘密。”\nD 项错误，根据《公安机关办理刑事案件程序规定》第二百五十八条规定：“为\n了查明案情，在必要的时候，侦查人员可以让被害人、证人或者犯罪嫌疑人对与\n犯罪有关的物品、文件、尸体、场所或者犯罪嫌疑人进行辨认。”在刑事案件的\n辨认中，一般是被害人、证人、犯罪嫌疑人对犯罪有关的物品、场所或者犯罪嫌\n疑人进行辨认，而不能由犯罪嫌疑人对被害人进行辨认。"},{"id":137,"type":"判断题","question":"公安机关对人民警察有严明的纪律要求，《人民警察法》明确规定了对违法违纪\n人员的六类处分。对于六类处分，从轻到重排序是：警告、记过、记大过、撤职、\n辞退、开除。","choices":[],"answer":"错误","explanation":"《中华人民共和国人民警察法》第四十八条第一款、第二款规定：“人民\n警察有本法第二十二条所列行为之一的，应当给予行政处分；构成犯罪的，依法\n追究刑事责任。行政处分分为：警告、记过、记大过、降级、撤职、开除。对受\n行政处分的人民警察，按照国家有关规定，可以降低警衔、取消警衔。”所以六\n类处分由轻到重应为警告、记过、记大过、降级、撤职、开除。"},{"id":138,"type":"单选题","question":"2023 年 3 月 1 日 10 时许，花园县公安局城关派出所两名民警在巡逻时发现某人\n形迹可疑，经当场盘问检查，发现该人携带的物品可能是赃物。为查清物品来源，\n10 时 30 分民警将该人带至派出所继续盘问。根据法律规定，民警在履行相关审\n批程序后，必须完成继续盘问的时间是（）。","choices":[{"key":"A","text":"3 月 1 日 18 时 30 分"},{"key":"B","text":"3 月 1 日 22 时 30 分"},{"key":"C","text":"3 月 2 日 10 时 30 分"},{"key":"D","text":"3 月 3 日 10 时 30 分"}],"answer":"C","explanation":"根据《人民警察法》第九条规定：“为维护社会治安秩序，公安机关的人\n民警察对有违法犯罪嫌疑的人员，经出示相应证件，可以当场盘问、检查；经盘\n问、检查，有下列情形之一的，可以将其带至公安机关，经该公安机关批准，对\n其继续盘问：（一）被指控有犯罪行为的；（二）有现场作案嫌疑的；（三）有\n作案嫌疑身份不明的；（四）携带的物品有可能是赃物的。对被盘问人的留置时\n间自带至公安机关之时起不超过二十四小时，在特殊情况下，经县级以上公安机\n关批准，可以延长至四十八小时，并应当留有盘问记录。对于批准继续盘问的，\n应当立即通知其家属或者其所在单位。对于不批准继续盘问的，应当立即释放被\n盘问人。经继续盘问，公安机关认为对被盘问人需要依法采取拘留或者其他强制\n措施的，应当在前款规定的期间作出决定；在前款规定的期间不能作出上述决定\n的，应当立即释放被盘问人。”民警于 2023 年 3 月 1 日 10 时 30 分将该人带到\n公安机关，在题干没有提到存在特殊情况时，根据《人民警察法》的规定，对其\n继续盘问的时间不得超过 24 小时，因此，必须在 3 月 2 日 10 时 30 分之前完成\n继续盘问。"},{"id":139,"type":"多选题","question":"李某多次向张某索要被拖欠的 200 万元货款未果，遂派胡某、苏某尾随张某，二\n人在张某住处及办公场所长时间逗留和吃住。张某对此大为不满，痛打二人，胡\n某报警。处警民警对本案的判断正确的有（）。","choices":[{"key":"A","text":"李某作为债权人有权要求张某还款"},{"key":"B","text":"李某侵害了张某的人身自由权"},{"key":"C","text":"张某有权要求李某承担民事责任"},{"key":"D","text":"张某的行为属于自助行为"}],"answer":"ABC","explanation":"A 项正确，根据《民法典》第五百七十九条规定：“当事人一方未支付价\n款、报酬、租金、利息，或者不履行其他金钱债务的，对方可以请求其支付。”\n李某的“债权”本身合法，有权要求张某履行还款义务。\nB 项正确，案中李某派胡某、苏某“尾随张某，在住处及办公场所长时间逗留和\n吃住”，该行为侵害张某的居住安宁，根据《宪法》，公民的人身自由权指的是\n我国公民享有人身、居住、通信以及行动上自由的权利，公民的人格尊严不受侵\n犯，住宅也不可受到侵犯。\nC 项正确，根据《民法典》第一千一百六十七条规定：“侵权行为危及他人人身、\n财产安全的，被侵权人有权请求侵权人承担停止侵害、排除妨碍、消除危险等侵\n权责任。”李某派胡某、苏某实施的“尾随、长时间逗留吃住”行为，属于故意\n侵害张某合法权益的行为，张某可要求李某停止派人行踪骚扰、赔礼道歉等。\nD 项错误，根据《民法典》第一千一百七十七条规定：“合法权益受到侵害，情\n况紧迫且不能及时获得国家机关保护，不立即采取措施将使其合法权益受到难以\n弥补的损害的，受害人可以在保护自己合法权益的必要范围内采取扣留侵权人的\n财物等合理措施；但是，应当立即请求有关国家机关处理。受害人采取的措施不\n当造成他人损害的，应当承担侵权责任。”李某的骚扰行为并未直接危及张某的\n人身、财产安全，不属于“情况紧迫且不能及时获得国家机关保护，不立即采取\n措施将使其合法权益受到难以弥补的损害的”条件，且“痛打”属于暴力伤害行\n为，手段已超出必要限度，非“合理措施”，不构成自助行为。"},{"id":140,"type":"判断题","question":"地方国家机构是我国国家机构体系的组成部分。《宪法》确定了中央和地方国家\n机构职权的划分，并对地方国家机构之间的关系作了规定。所以，县级人民政府\n只对县级人民代表大会负责并报告工作。","choices":[],"answer":"错误","explanation":"《中华人民共和国宪法》第一百一十条规定：“地方各级人民政府对本级\n人民代表大会负责并报告工作。县级以上的地方各级人民政府在本级人民代表大\n会闭会期间，对本级人民代表大会常务委员会负责并报告工作。地方各级人民政\n府对上一级国家行政机关负责并报告工作。全国地方各级人民政府都是国务院统\n一领导下的国家行政机关，都服从国务院。”县级人民政府对县级人民代表大会\n负责并报告工作的同时，还对上一级国家行政机关负责并报告工作。"},{"id":141,"type":"单选题","question":"民警小高带领一名警务辅助人员小李在检查星灿酒店时，发现 3304 房间内的张\n某（16 周岁），李某未实名登记，遂立即向所属公安派出所反馈。后经办案民\n警调查得知，前台登记工作人员明知程某以自己名义为李某、张某登记房间而未\n制止，为进一步查证违法事实，办案民警对张某进行了询问，根据相关规定，下\n列执法行为不符合规范的是（ ）。","choices":[{"key":"A","text":"小高和小李二人对星灿酒店检查"},{"key":"B","text":"询问张某时，因其父母无法到场，在询问笔录中注明"},{"key":"C","text":"对张某、李某未实名登记的行为批评教育"},{"key":"D","text":"对星灿酒店前台登记工作人员作出行政处罚决定"}],"answer":"A","explanation":"A 项错误，根据《公安办理行政案件程序规定》第五十二条规定：“公安\n机关进行询问、辨认、检查、勘验，实施行政强制措施等调查取证工作时，人民\n警察不得少于二人，并表明执法身份。接报案、受案登记、接受证据、信息采集、\n调解、送达文书等工作，可以由一名人民警察带领警务辅助人员进行，但应当全\n程录音录像。”检查工作为执法活动，不可以由一名人民警察带领警务辅助人员\n进行。\nB 项正确，根据《治安管理处罚法》第九十八条第三款规定：“询问不满十八周\n岁的违反治安管理行为人，应当通知其父母或者其他监护人到场；其父母或者其\n他监护人不能到场的，也可以通知其他成年亲属，所在学校、单位、居住地基层\n组织或者未成年人保护组织的代表等合适成年人到场，并将有关情况记录在案。\n确实无法通知或者通知后未到场的，应当在笔录中注明。”故该做法正确。\nC、D 项正确，根据《治安管理处罚法》第六十七条第一款规定：“从事旅馆业\n经营活动不按规定登记住宿人员姓名、有效身份证件种类和号码等信息的，或者\n为身份不明、拒绝登记身份信息的人提供住宿服务的，对其直接负责的主管人员\n和其他直接责任人员处五百元以上一千元以下罚款；情节较轻的，处警告或者五\n百元以下罚款。”张某和李某作为旅客，未按规定出示身份证件登记住宿，违反\n了配合旅馆查验身份的义务，对其二人批评教育的做法正确；星灿酒店前台登记\n工作人员未按规定登记住宿旅客信息，对其处罚正确。"},{"id":142,"type":"多选题","question":"中国人民警察警徽是人民警察的象征和专用标志，公安民警应当爱护警徽，维护\n警徽尊严。下列选项中，关于警徽表述准确的有（）。","choices":[{"key":"A","text":"警徽图案由国徽、盾牌、长城、松枝和麦穗构成"},{"key":"B","text":"警徽及其图案的使用应当严肃、庄重，并严格使用范围"},{"key":"C","text":"警徽及其图案的使用由省级以上公安机关负责监督管理"},{"key":"D","text":"警徽由公安部按照规定统一监制"}],"answer":"BD","explanation":"A 项错误，《人民警察警徽使用管理规定》第二条规定：“警徽图案由国\n徽、盾牌、长城、松枝和飘带构成。国徽衬地和垂绶为正红色，盾牌衬地为深蓝\n色，长城、松枝和飘带为金黄色。”警徽图案不包括麦穗。\nB 项正确，《人民警察警徽使用管理规定》第四条规定：“警徽及其图案的使用\n范围：（一）授衔、授装、宣誓、阅警等重大仪式；（二）人民警察机关及其事\n业单位的重要建筑物、会场主席台；（三）人民警察机关颁发的奖状、荣誉章、\n证书、证件；（四）人民警察报刊、图书及其他出版物；（五）警服、警帽、警\n用交通工具、标志等物品。除前款规定的情形外，使用警徽及其图案应当经地（市）\n级以上人民警察机关批准。”第五条规定：“悬挂警徽，应当置于显著位置。使\n用警徽及其图案，应当严肃、庄重，严格按照比例放大或者缩小。不得使用破损、\n污损、褪色或者不合规格、颜色的警徽。”\nC 项错误，《人民警察警徽使用管理规定》第十一条规定：“县级以上各级人民\n警察机关对警徽及其图案的使用，实行监督管理。”无须省级以上。\nD 项正确，《人民警察警徽使用管理规定》第十条规定：“警徽由公安部按照《人\n民警察警徽技术标准》统一监制。”"},{"id":143,"type":"判断题","question":"警告、罚款、行政拘留和没收非法所得均属于治安管理处罚的种类范畴。","choices":[],"answer":"错误","explanation":"《治安管理处罚法》第 10 条规定:治安管理处罚的种类分为:（一）警告;\n（二）罚款;（三）行政拘留;（四）吊销公安机关发放的许可证件。对违反治安\n管理的外国人，可以附加适用限期出境或者驱逐出境。"},{"id":144,"type":"单选题","question":"某县公安机关立案侦查邝某涉嫌利用未公开信息交易实施犯罪，需要冻结其名下\n数额较大的债券、股票等财产，实施该冻结措施应当经（）批准。","choices":[{"key":"A","text":"当地证监管理机构负责人"},{"key":"B","text":"该县公安机关办案部门负责人"},{"key":"C","text":"上级公安机关法制部门负责人"},{"key":"D","text":"该县公安机关负责人"}],"answer":"D","explanation":"根据《公安机关办理刑事案件程序规定》第二百三十九条规定：“需要冻\n结犯罪嫌疑人财产的，应当经县级以上公安机关负责人批准，制作协助冻结财产\n通知书，明确冻结财产的账户名称、账户号码、冻结数额、冻结期限、冻结范围\n以及是否及于孳息等事项，通知金融机构等单位协助办理。冻结股权、保单权益\n的，应当经设区的市一级以上公安机关负责人批准。冻结上市公司股权的，应当\n经省级以上公安机关负责人批准。”因此，冻结债券、股票等财产，应当经县级\n以上公安机关负责人批准。D 项正确。"},{"id":145,"type":"多选题","question":"甲县公安局工作中发现该局民警王某既涉嫌组织、领导黑社会性质组织犯罪，又\n涉嫌受贿、滥用职权犯罪。对此，下列说法正确的是()","choices":[{"key":"A","text":"甲县公安局应当将王某涉嫌受贿、滥用职权的违法犯罪线索移送监察机关。"},{"key":"B","text":"本案应当由甲县公安局为主侦查，监察机关予以协助。"},{"key":"C","text":"监察机关对王某采取留置措施，可以根据工作需要提请甲县公安局配合，甲县\n公安局应当依法予以协助。"},{"key":"D","text":"依法应当留置的王某如果在逃，监察机关可以提请甲县公安局协助抓捕，甲县\n公安局应当报请上一级公安机关作出通缉决定。"}],"answer":"AC","explanation":"《监察法》第 37 条规定：人民法院、人民检察院、公安机关、审计机关\n等国家机关在工作中发现公职人员涉嫌贪污贿赂、失职渎职等职务违法或者职务\n犯罪的问题线索，应当移送监察机关，由监察机关依法调查处置。据此，公安机\n关发现民警受贿、滥用职权线索应移送监察机关。因此，A 项正确。\n《监察法》第 37 条规定：被调查人既涉嫌严重职务违法或者职务犯罪，又涉嫌\n其他违法犯罪的，一般应当由监察机关为主调查，其他机关予以协助。据此，应\n由监察机关为主调查。因此，B 项错误。\n《监察法》第 49 条规定：监察机关采取强制到案、责令候查、管护、留置措施，\n可以根据工作需要提请公安机关配合。公安机关应当依法予以协助。公安机关应\n当依法予以协助。因此，C 项正确。\n《监察法》第 32 条规定：依法应当留置的被调查人如果在逃，监察机关可以决\n定在本行政区域内通缉，由公安机关发布通缉令，追捕归案。通缉范围超出本行\n政区域的，应当报请有权决定的上级监察机关决定。据此，监察机关可决定通缉，\n由公安机关发布通缉令。因此，D 项错误。"},{"id":146,"type":"判断题","question":"某派出所在办理治安案件过程中，超过询问查证的时间限制违法嫌疑人的人身自\n由，应对直接负责的主管人员和其他直接责任人员给予相应的行政处罚。","choices":[],"answer":"错误","explanation":"《中华人民共和国治安管理处罚法》第一百三十九条第二项规定：“人民\n警察办理治安案件，有下列行为之一的，依法给予处分；构成犯罪的，依法追究\n刑事责任：……（二）超过询问查证的时间限制人身自由的；……”据此，超过\n询问查证的时间限制违法嫌疑人的人身自由，应对直接负责的主管人员和其他直\n接责任人员依法给予行政处分（内部纪律处罚），而非行政处罚。因此，题干中\n“给予相应的行政处罚”的说法错误。"},{"id":147,"type":"单选题","question":"小李是某市公安局治安支队的一名人民警察。某天，多年的好友小张想借小李的\n警服穿出去威风一下，下列回答中符合人民警察纪律要求的是（）。","choices":[{"key":"A","text":"“咱俩谁跟谁，我有很多警服，直接给你一件。”"},{"key":"B","text":"“本来按规定是不能借的，但我们关系这么好，就借给你一次。”"},{"key":"C","text":"“现在领导管得严，警服你拿去穿一下问题不大，但警号就不借了。”"},{"key":"D","text":"“我把警服借给你。说不定我就要脱啰。”"}],"answer":"D","explanation":"根据《人民警察法》第三十六条第一款、第二款规定：“人民警察的警用\n标志、制式服装和警械，由国务院公安部门统一监制，会同其他有关国家机关管\n理，其他个人和组织不得非法制造、贩卖。人民警察的警用标志、制式服装、警\n械、证件为人民警察专用，其他个人和组织不得持有和使用。”根据《公安机关\n人民警察内务条令》第四十二条规定：“公安民警应当爱护和妥善保管警服及警\n衔、警号、胸徽、帽徽、领花等标志，不得赠送、转借给非人民警察身份人员。”\nA、B、C 项错误，D 项正确，警服是警察身份和执法的重要标志，体现着一个国\n家的警察风貌，人民警察应当爱护和妥善保管警服及警衔、警号等标志，不得转\n借给其他非人民警察身份人员持有或使用。"},{"id":148,"type":"多选题","question":"某公安分局民警高某、于某发现故意杀人犯罪嫌疑人陶某出现在某加油站，遂上\n前抓捕，陶某随手捡起砖块不让民警靠近。在朝天鸣枪警告无效的情况下，高某\n开枪击中陶某手部，使砖块掉落。高某欲上前控制陶某时，陶某又弯腰拾起砖块，\n于某见状开枪击中陶某腿部。下列说法错误的是()","choices":[{"key":"A","text":"高某使用武器合法。"},{"key":"B","text":"于某使用武器不合法。"},{"key":"C","text":"高某、于某应当及时抢救受伤人员，保护现场。"},{"key":"D","text":"高某、于某使用武器后，应当立即向当地检察机关报告。"}],"answer":"ABD","explanation":"《人民警察使用警械和武器条例》第 10 条第 2 项规定，犯罪分子处于群\n众聚集的场所或者存放大量易燃、易爆、剧毒、放射性等危险物品的场所的，不\n得使用武器，但是不使用武器予以制止，将发生更为严重危害后果的除外。陶某\n在加油站（存放大量易燃物品的场所）随手捡起砖块不让民警靠近，其行为尚未\n达到更为严重危害后果（如引燃加油站）的程度。因此，高某使用武器不合法，\n因此，A 项错误。\n《人民警察使用警械和武器条例》第 9 条第 1 款第 10 项规定，以暴力方法抗拒\n或者阻碍人民警察依法履行职责，危及人民警察生命安全的，可以使用武器。于\n某在陶某再次拾起砖块实施暴力抗拒时开枪制止，符合规定。据此，于某使用武\n器合法，但 B 项声称“于某使用武器不合法”，与法规不符，因此，B 项错误。\n《人民警察使用警械和武器条例》第 12 条规定，人民警察使用武器造成犯罪分\n子或者无辜人员伤亡的，应当及时抢救受伤人员，保护现场，并立即向当地公安\n机关或者所属机关报告。据此，高某、于某使用武器后应当及时抢救受伤人员、\n保护现场，因此，C 项正确。\n《人民警察使用警械和武器条例》第 12 条规定，使用武器后应当立即向当地公\n安机关或者所属机关报告，未要求向检察机关报告。据此，D 项要求向检察机关\n报告错误，因此，D 项错误。"},{"id":149,"type":"判断题","question":"北京、天津、上海、重庆四个直辖市公安机关制定的规范性文件，可以设定警告\n或者一定数量罚款的行政处罚。","choices":[],"answer":"错误","explanation":"《行政处罚法》第 16 条规定:除法律、法规、规章外，其他规范性文件不\n得设定行政处罚。故上述四个直辖市的公安机关无权设定警告或者一定数量罚款\n的行政处罚。"},{"id":150,"type":"单选题","question":"某日，公安机关发现江某在银行存钱时将其本人名下的建设银行账户提供给两名\n男子。经询问，江某陈述其想借网贷，但对方说可出租银行账户，江某称知道银\n行账户只能由本人使用且意识到对方可能会用于诈骗，但其最终借出账户，获得\n租金 2500 元。\n关于江某的行为下列陈述正确的是（）。","choices":[{"key":"A","text":"构成电信网络诈骗罪的共犯"},{"key":"B","text":"构成合同诈骗治安违法行为"},{"key":"C","text":"构成非法出租银行账户的违法行为"},{"key":"D","text":"不构成违法行为，但应当对其批评教育"}],"answer":"C","explanation":"根据《刑法》第二百六十六条规定：“诈骗罪是指以非法占有为目的，用\n虚构事实或者隐瞒真相的方法，骗取数额较大的公私财物的行为。”\nA 项错误，江某在银行存钱时将其本人名下的建设银行账户提供给两名男子，但\n该两名男子的行为还未知，故不构成电信网络诈骗罪的共犯。\nB 项错误，合同诈骗罪是指以非法占有为目的，在签订、履行合同过程中，采取\n虚构事实或者隐瞒真相等欺骗手段，骗取对方当事人的财物，数额较大的行为。\n江某在银行存钱时将其本人名下的建设银行账户提供给两名男子，没有涉及到合\n同诈骗的行为。\nC 项正确，D 项错误，根据《反电信网络诈骗法》第三十一条第一款规定：“任\n何单位和个人不得非法买卖、出租、出借电话卡、物联网卡、电信线路、短信端\n口、银行账户、支付账户、互联网账号等，不得提供实名核验帮助；不得假冒他\n人身份或者虚构代理关系开立上述卡、账户、账号等。”江某的出借银行账户属\n于违法行为。"},{"id":151,"type":"多选题","question":"下列关于组织考试作弊罪的说法，正确的是( )","choices":[{"key":"A","text":"教师陈某打算在普通高等学校招生考试的体育和体能测试中，使用兴奋剂帮助\n学生提高成绩。黄某明知使用用途，仍为陈某提供兴奋剂，陈某先后组织多名学\n生在相关测试中使用了兴奋剂。陈某和黄某均构成组织考试作弊罪。"},{"key":"B","text":"王某在国家统一法律职业资格考试中多次组织作弊；江某在国家教师资格考试\n中组织多人考试作弊。王某和江某均构成组织考试作弊罪。"},{"key":"C","text":"余某拟在会计专业技术资格考试中，向考生提供其非法获取的试题答案，但在\n考前，被考试工作人员查获。由于试题未提供成功，余某不构成组织考试作弊罪。"},{"key":"D","text":"李某在医师资格考试中，为实施考试作弊行为，向他人提供考试试题答案，但\n是李某提供的试题答案不完整，与标准答案不完全一致。李某构成非法出售、提\n供试题、答案罪。"}],"answer":"ABCD","explanation":"《最高人民法院关于审理走私、非法经营、非法使用兴奋剂刑事案件适用\n法律若干问题的解释》第 4 条规定：在普通高等学校招生、公务员录用等法律规\n定的国家考试涉及的体育、体能测试等体育运动中，组织考生非法使用兴奋剂的，\n应当依照刑法第 284 条之一的规定，以组织考试作弊罪定罪处罚。明知他人实施\n前款犯罪而为其提供兴奋剂的，依照前款的规定定罪处罚。据此，陈某在高考体\n育测试中组织学生使用兴奋剂，黄某明知而提供兴奋剂，均构成组织考试作弊罪，\n因此，A 项正确。\n《刑法》第 284 条之一第 1 款规定：在法律规定的国家考试中，组织作弊的，构\n成组织考试作弊罪。《最高人民法院、最高人民检察院关于办理组织考试作弊等\n刑事案件适用法律若干问题的解释》第 1 条明确，国家统一法律职业资格考试、\n国家教师资格考试属于“法律规定的国家考试”。据此，王某在法律职业资格考\n试中多次组织作弊，江某在教师资格考试中组织多人作弊，均构成组织考试作弊\n罪，因此，B 项正确。\n《刑法》第 284 条之一第 1 款规定的组织考试作弊罪，要求行为人实施组织作弊\n行为；第 3 款规定的非法出售、提供试题、答案罪，是独立罪名。余某向考生提\n供试题答案的行为属于提供答案，而非组织作弊，因此不构成组织考试作弊罪（可\n能构成非法出售、提供试题、答案罪）。据此，余某不构成组织考试作弊罪，因\n此，C 项正确。\n《刑法》第 284 条之一第 3 款规定：为实施考试作弊行为，向他人非法出售或者\n提供试题、答案的，构成非法出售、提供试题、答案罪。《最高人民法院、最高\n人民检察院关于办理组织考试作弊等刑事案件适用法律若干问题的解释》第 6\n条规定：试题不完整或者答案与标准答案不完全一致的，不影响非法出售、提供\n试题、答案罪的认定。据此，李某提供不完整答案的行为构成非法出售、提供试\n题、答案罪。因此，D 项正确。"},{"id":152,"type":"判断题","question":"对破坏居（村）民委员会选举秩序的行为，应当按破坏选举秩序的有关规定给予\n治安管理处罚。","choices":[],"answer":"正确","explanation":"《公安机关执行〈中华人民共和国治安管理处罚法〉有关问题的解释（二）》\n第 6 条第 2 款规定，对破坏居（村）民委员会选举秩序的行为，应当依照破坏选\n举秩序的违反治安管理行为予以处罚。"},{"id":153,"type":"单选题","question":"根据《中华人民共和国人民警察法》及《中华人民共和国治安管理处罚法》的规\n定，下列情形中民警的执法行为正确的是（ ）。","choices":[{"key":"A","text":"派出所民警小李接到有人打架的报警时因正在处理其他警情，派出辅警处警"},{"key":"B","text":"派出所民警小程在办理一起盗窃案件时，因对赃物价格鉴证所需要时间较长未\n能即时归还被侵害人，遭到被侵害人投诉"},{"key":"C","text":"派出所民警小张抓获一个惯偷，嫌疑人拒不交代违法事实，小张遂不给嫌疑人\n喝水，最终嫌疑人交代了盗窃事实"},{"key":"D","text":"派出所民警老郑对王某当场收缴罚款，并出具了所在公安局制发的罚款收据"}],"answer":"B","explanation":"A 项错误，《人民警察法》第七条规定：“公安机关的人民警察对违反治\n安管理或者其他公安行政管理法律、法规的个人或者组织，依法可以实施行政强\n制措施、行政处罚。”根据《关于规范公安机关警务辅助人员管理工作的意见》\n第四条规定： “警务辅助人员不具备执法主体资格，不能直接参与公安执法工作，\n应当在公安民警的指挥和监督下开展辅助性工作。警务辅助人员依照本办法履行\n职责受法律保护，有关单位和个人应当予以配合，相关法律后果由公安机关承\n担。”公安民警可以指挥和监督辅警开展辅助性工作，但不能指派其单独从事执\n法等处警等工作。\nB 项正确，《公安机关办理行政案件程序规定》第一百零七条规定：“······对\n下列物品，不得扣押或者扣留：（一）与案件无关的物品；（二）公民个人及其\n所扶养家属的生活必需品；（三）被侵害人或者善意第三人合法占有的财产。对\n具有本条第二款第二项、第三项情形的，应当予以登记，写明登记财物的名称、\n规格、数量、特征，并由占有人签名或者捺指印。必要时，可以进行拍照。但是，\n与案件有关必须鉴定的，可以依法扣押，结束后应当立即解除。”盗窃案件的赃\n物为被侵害人所有，原则上不得扣押，但与案件有关必须鉴定的，可以依法扣押，\n且要求在结束后立即解除对该财物的扣押措施，并非要求“即时”归还，故民警\n做法并无问题。\nC 项错误，《治安管理处罚法》第九十七条第三款规定：“询问查证期间，公安\n机关应当保证违反治安管理行为人的饮食、必要的休息时间等正当需求。”民警\n小张不给嫌疑人喝水，违法了法律规定。\nD 项错误，《治安管理处罚法》第一百二十五条规定：“人民警察当场收缴罚款\n的，应当向被处罚人出具省级以上人民政府财政部门统一制发的专用票据；不出\n具统一制发的专用票据的，被处罚人有权拒绝缴纳罚款。”公安局制发的罚款收\n据不符合法律规定。"},{"id":154,"type":"多选题","question":"根据《中华人民共和国刑法》及相关司法解释，关于赌博犯罪，下列说法正确的\n有（ ）。","choices":[{"key":"A","text":"以营利为目的，在计算机网络上建立赌博网站，或者为赌博网站担任代理，接\n受投注的，属于《刑法》规定的“开设赌场”"},{"key":"B","text":"中华人民共和国公民在我国领域外周边地区聚众赌博、开设赌场，以吸引中华\n人民共和国公民为主要客源，构成赌博罪的，可以依照《刑法》的规定追究刑事\n责任"},{"key":"C","text":"通过赌博或者为国家工作人员赌博提供资金的形式实施行贿、受贿行为，构成\n犯罪的，依照《刑法》关于赌博犯罪的规定定罪处罚"},{"key":"D","text":"实施赌博犯罪，具有国家工作人员身份的，依照《刑法》规定从重处罚"}],"answer":"ABD","explanation":"A 项正确，根据《最高人民法院、最高人民检察院关于办理赌博刑事案件\n具体应用法律若干问题的解释》第二条规定：“以营利为目的，在计算机网络上\n建立赌博网站，或者为赌博网站担任代理，接受投注的，属于刑法第三百零三条\n规定的‘开设赌场’。”\nB 项正确，根据《最高人民法院、最高人民检察院关于办理赌博刑事案件具体应\n用法律若干问题的解释》第三条规定：“中华人民共和国公民在我国领域外周边\n地区聚众赌博、开设赌场，以吸引中华人民共和国公民为主要客源，构成赌博罪\n的，可以依照刑法规定追究刑事责任。”\nC 项错误，根据《最高人民法院、最高人民检察院关于办理赌博刑事案件具体应\n用法律若干问题的解释》第七条规定：“通过赌博或者为国家工作人员赌博提供\n资金的形式实施行贿、受贿行为，构成犯罪的，依照刑法关于贿赂犯罪的规定定\n罪处罚。”\nD 项正确，根据《最高人民法院、最高人民检察院关于办理赌博刑事案件具体应\n用法律若干问题的解释》第五条规定：“实施赌博犯罪，有下列情形之一的，依\n照刑法第三百零三条的规定从重处罚：（一）具有国家工作人员身份的；（二）\n组织国家工作人员赴境外赌博的；（三）组织未成年人参与赌博，或者开设赌场\n吸引未成年人参与赌博的。”"},{"id":155,"type":"判断题","question":"冒充国家机关工作人员招摇撞骗的，应当从重处罚。","choices":[],"answer":"错误","explanation":"《治安管理处罚法》第六十二条规定：\"冒充国家机关工作人员招摇撞骗\n的，处十日以上十五日以下拘留，可以并处一千元以下罚款；情节较轻的，处五\n日以上十日以下拘留。冒充军警人员招摇撞骗的，从重处罚。\"据此，冒充国家\n机关工作人员招摇撞骗的行为并未规定应当从重处罚，只有冒充军警人员等特定\n身份时才从重处罚。"},{"id":156,"type":"单选题","question":"对于犯罪嫌疑人长期逃匿或者死亡，同时依照刑法规定应当追缴其违法所得及其\n他涉案财产的说法正确的是（ ）。","choices":[{"key":"A","text":"由侦查机关向人民法院提出没收违法所得的申请"},{"key":"B","text":"由犯罪地或者犯罪嫌疑人居住地的基层人民法院受理"},{"key":"C","text":"人民法院受理没收违法所得的申请后，应当发出公告，公告期间为六个月"},{"key":"D","text":"此为特别程序，法院受理裁定后，相关人员不得上诉"}],"answer":"C","explanation":"A 项错误，《公安机关办理刑事案件程序规定》第三百三十九条规定：“有\n下列情形之一，依照刑法规定应当追缴其违法所得及其他涉案财产的，经县级以\n上公安机关负责人批准，公安机关应当写出没收违法所得意见书，连同相关证据\n材料一并移送同级人民检察院：（一）恐怖活动犯罪等重大犯罪案件，犯罪嫌疑\n人逃匿，在通缉一年后不能到案的;（二）犯罪嫌疑人死亡的。犯罪嫌疑人死亡，\n现有证据证明其存在违法所得及其他涉案财产应当予以没收的，公安机关可以进\n行调查。公安机关进行调查，可以依法进行查封、扣押、查询、冻结。”故并不\n是由侦查机关向人民法院提出没收违法所得的申请，而是人民检察院。\nB 项错误，《中华人民共和国刑事诉讼法》第二百九十九条第一款规定：“没收\n违法所得的申请，由犯罪地或者犯罪嫌疑人、被告人居住地的中级人民法院组成\n合议庭进行审理。”\nC 项正确，《中华人民共和国刑事诉讼法》第二百九十九条第二款规定：“人民\n法院受理没收违法所得的申请后，应当发出公告。公告期间为六个月。”\nD 项错误，《中华人民共和国刑事诉讼法》第三百条第二款规定：“对于人民法\n院依照前款规定作出的裁定，犯罪嫌疑人、被告人的近亲属和其他利害关系人或\n者人民检察院可以提出上诉、抗诉。”"},{"id":157,"type":"多选题","question":"陈某因涉嫌诈骗犯罪被刑事拘留，经侦查，公安机关认为不应当追究其刑事责任，\n公安机关对陈某采取的下列措施中正确的有（ ）。","choices":[{"key":"A","text":"办案部门应当撤销案件"},{"key":"B","text":"将陈某的强制措施变更为取保候审"},{"key":"C","text":"立即释放陈某，发给释放证明书"},{"key":"D","text":"陈某的释放证明由该案办案部门负责签发"}],"answer":"AC","explanation":"A、C 项正确，B 项错误，根据《公安机关办理刑事案件程序规定》第一百\n八十六条规定：“经过侦查，发现具有下列情形之一的，应当撤销案件：（一）\n没有犯罪事实的；（二）情节显著轻微、危害不大，不认为是犯罪的；（三）犯\n罪已过追诉时效期限的；（四）经特赦令免除刑罚的；（五）犯罪嫌疑人死亡的；\n（六）其他依法不追究刑事责任的。对于经过侦查，发现有犯罪事实需要追究刑\n事责任，但不是被立案侦查的犯罪嫌疑人实施的，或者共同犯罪案件中部分犯罪\n嫌疑人不够刑事处罚的，应当对有关犯罪嫌疑人终止侦查，并对该案件继续侦\n查。”根据《公安机关办理刑事案件程序规定》第一百八十七条规定：“需要撤\n销案件或者对犯罪嫌疑人终止侦查的，办案部门应当制作撤销案件或者终止侦查\n报告书，报县级以上公安机关负责人批准。公安机关决定撤销案件或者对犯罪嫌\n疑人终止侦查时，原犯罪嫌疑人在押的，应当立即释放，发给释放证明书。原犯\n罪嫌疑人被逮捕的，应当通知原批准逮捕的人民检察院。对原犯罪嫌疑人采取其\n他强制措施的，应当立即解除强制措施；需要行政处理的，依法予以处理或者移\n交有关部门。”本题中公安机关认为陈某的案件不应追究刑事责任，即不认为是\n犯罪，故对陈某的案件应当依法进行撤销，依法撤销的案件无需再变更强制措施，\n对陈某应当立即释放并发给释放证明书。\nD 项错误，根据《公安机关办理刑事案件程序规定》第一百三十一条规定：“对\n被拘留的犯罪嫌疑人审查后，根据案件情况报经县级以上公安机关负责人批准，\n分别作出如下处理：······（四）具有本规定第一百八十六条规定情形之\n一的，释放被拘留人，发给释放证明书；需要行政处理的，依法予以处理或者移\n送有关部门。”本题中对陈某的案件需要撤销，应当由办案部门制作撤销案件报\n告书，报县级以上公安机关负责人批准。批准撤销案件后，立即释放陈某，并发\n给释放证明书。"},{"id":158,"type":"判断题","question":"民警老李工龄 20 年，作风散漫，纪律松弛，经常迟到早退、利用上班时间办私\n事，年度考核连续两年不称职。应对老李给予开除处分。","choices":[],"answer":"错误","explanation":"根据《公安机关组织管理条例》第二十八条：“公安机关按照管理权限对\n人民警察进行考核。考核结果作为调整公安机关人民警察职务、级别、工资以及\n辞退、奖励、培训的依据。”第三十条：“公安机关人民警察有下列情形之一的，\n应当予以辞退：（一）在年度考核中，连续两年被确定为不称职的；（二）不胜\n任现职工作，又不接受其他安排的；（三）因所在公安机关调整、撤销、合并或\n者缩减编制员额需要调整工作，本人拒绝合理安排的；（四）不履行人民警察义\n务，不遵守人民警察纪律，经教育仍无转变，不适合继续在公安机关工作，又不\n宜给予开除处分的；（五）旷工或者因公外出、请假期满无正当理由逾期不归连\n续超过 15 天，或者 1 年内累计超过 30 天的。”根据上述第三十条第一款规定，\n在年度考核中，连续两年被确定为不称职的，应当予以辞退，而不是开除处分。"},{"id":159,"type":"单选题","question":"（ ）是人民警察的道德义务。","choices":[{"key":"A","text":"对公民提出解决纠纷的要求，应当给予帮助"},{"key":"B","text":"对公民的报警案件，应当及时查处"},{"key":"C","text":"尊重人民群众的风俗习惯"},{"key":"D","text":"积极参加抢险救灾和社会公益工作"}],"answer":"C","explanation":"A 项错误，《中华人民共和国人民警察法》第二十一条第一款规定：“人\n民警察遇到公民人身、财产安全受到侵犯或者处于其他危难情形，应当立即救助；\n对公民提出解决纠纷的要求，应当给予帮助；对公民的报警案件，应当及时查处。”\n对公民提出解决纠纷的要求给予帮助是人民警察的职责义务。\nB 项错误，《中华人民共和国人民警察法》第二十一条第一款规定：“······对\n公民的报警案件，应当及时查处。”对公民的报警案件及时查处是人民警察的职\n责义务。\nC 项正确，《中华人民共和国人民警察法》第二十条规定：“人民警察必须做到：\n（一）秉公执法，办事公道；（二）模范遵守社会公德；（三）礼貌待人，文明\n执勤；（四）尊重人民群众的风俗习惯。”尊重人民群众的风俗习惯是人民警察\n的道德义务。\nD 项错误，《中华人民共和国人民警察法》第二十一条第二款规定：“人民警察\n应当积极参加抢险救灾和社会公益工作。”人民警察积极参加抢险救灾和社会公\n益工作是人民警察的职责义务。"},{"id":160,"type":"多选题","question":"某日，谭某和男朋友辛某在某商场闲逛时，感到路人钱某用故意碰撞其胸部，怀\n疑对方故意猥亵。她认为对方涉嫌犯罪，便拉住钱某不让其走，同时让辛某报警。\n双方在现场等待民警到场时，钱某突然逃跑，辛某立即上前追赶，两次脚踢钱某\n倒地。经司法鉴定，钱某的伤势构成轻伤，派出所认为辛某涉嫌故意伤害犯罪，\n应当对辛某刑事拘留，民警下列做法错误的有（ ）","choices":[{"key":"A","text":"经办案部门负责人批准后，制作拘留证"},{"key":"B","text":"拘留后 48 小时内将辛某送看守所羁押"},{"key":"C","text":"拘留后 24 小时内制作拘留通知书送达谭某"},{"key":"D","text":"拘留后 24 小时内讯问辛某"}],"answer":"ABC","explanation":"A 项错误，《公安机关办理刑事案件程序规定》第一百二十五条第一款规\n定：“拘留犯罪嫌疑人，应当填写呈请拘留报告书，经县级以上公安机关负责人\n批准，制作拘留证。执行拘留时，必须出示拘留证，并责令被拘留人在拘留证上\n签名、捺指印，拒绝签名、捺指印的，侦查人员应当注明。”根据上述规定，制\n作拘留证应当经县级以上公安机关负责人批准，而不是办案部门负责人。\nB 项错误，《公安机关办理刑事案件程序规定》第一百二十六条第一款规定：“拘\n留后，应当立即将被拘留人送看守所羁押，至迟不得超过二十四小时。”根据上\n述规定，应当在拘留辛某后的 24 小时内送看守所，而不是 48 小时。\nC 项错误，《公安机关办理刑事案件程序规定》第一百二十七条第一款规定：“除\n无法通知或者涉嫌危害国家安全犯罪、恐怖活动犯罪通知可能有碍侦查的情形以\n外，应当在拘留后二十四小时以内制作拘留通知书，通知被拘留人的家属。拘留\n通知书应当写明拘留原因和羁押处所。”谭某和辛某是男女朋友关系，而非夫妻，\n不属于家属。\nD 项正确，《公安机关办理刑事案件程序规定》第一百二十八条规定：“对被拘\n留的人，应当在拘留后二十四小时以内进行讯问。发现不应当拘留的，应当经县\n级以上公安机关负责人批准，制作释放通知书，看守所凭释放通知书发给被拘留\n人释放证明书，将其立即释放。”"},{"id":161,"type":"判断题","question":"根据《人民警察法》的规定，公安机关采取技术侦察措施必须具备的条件有：因\n侦查犯罪的需要、因查处治安案件的需要、符合国家相关的规定、经过严格的批\n准手续。","choices":[],"answer":"错误","explanation":"《人民警察法》第十六条规定：“公安机关因侦查犯罪的需要，根据国家\n有关规定，经过严格的批准手续，可以采取技术侦察措施。”查处治安案件的需\n要不是公安机关采取技术侦察措施必须具备的条件。"},{"id":162,"type":"单选题","question":"民警王某驾车追捕犯罪嫌疑人过程中，因车辆发生故障不能继续行驶。这时，一\n辆出租车路过，王某将其拦下，要求使用该车追捕逃犯，司机张某拒绝，并与王\n某发生争执。王某推搡了张某并强行将车开走，追缉途中因被犯罪嫌疑人开车碰\n撞致车辆损坏。后公安机关对王某作出处分决定。下列说法正确的有（ ）。","choices":[{"key":"A","text":"王某可以优先使用该出租车，可以不事先征得张某的同意"},{"key":"B","text":"王某造成车辆受损和营运损失，应当由其个人赔偿"},{"key":"C","text":"公安机关可以对王某推人行为采取禁闭措施"},{"key":"D","text":"王某对公安机关给予的处分不服，可以申请行政复议"}],"answer":"A","explanation":"根据《人民警察法》第 13 条的规定，公安机关因侦查犯罪的需要，必要\n时，可以优先使用个人的交通工具。公安机关优先使用出租车不用征得张某同意。\n因此，A 项正确。\n根据《人民警察法》第 50 条的规定，人民警察在执行职务过程中造成的损失，\n应当依照《国家赔偿法》的规定给予赔偿。因此，B 项错误。\n根据《公安机关实施停止执行职务和禁闭措施的规定》第 6 条的规定，人民警察\n殴打他人，不听制止，可能造成恶劣影响的，可以对其采取禁闭措施。王某推搡\n张某的行为尚未达到执行禁闭的条件。因此，C 项错误。\n《公安机关组织管理条例》第 34 条规定，公安机关人民警察对涉及本人的人事\n处理决定不服，或者认为有关部门及其领导人员侵犯其合法权益的，可以依法申\n请复核，提出申诉或者控告。《行政复议法》第 8 条第 1 款规定，不服从行政机\n关作出的行政处分或者其他人事处理决定的，依照有关法律、行政法规的规定提\n出申诉。王某对处分决定不服，不能申请行政复议。因此，D 项错误。"},{"id":163,"type":"多选题","question":"16 岁的肖某强因多次盗窃被派出所抓获，民警开展了全面调查，在对肖某强讯\n问时，依法通知其亲属到场。由于肖某强的母亲早亡，父亲离家打工，只有其祖\n父肖某礼，舅舅丁某军，姨夫卢某庆和 17 周岁的姐姐肖某娟还在当地。民警讯\n问肖某强，可以通知到场的亲属有（ ）。","choices":[{"key":"A","text":"肖某礼"},{"key":"B","text":"丁某军"},{"key":"C","text":"卢某庆"},{"key":"D","text":"肖某娟"}],"answer":"ABC","explanation":"《公安机关办理刑事案件程序规定》第三百二十三条规定：“讯问未成年\n犯罪嫌疑人，应当通知未成年犯罪嫌疑人的法定代理人到场。无法通知、法定代\n理人不能到场或者法定代理人是共犯的，也可以通知未成年犯罪嫌疑人的其他成\n年亲属，所在学校、单位、居住地或者办案单位所在地基层组织或者未成年人保\n护组织的代表到场，并将有关情况记录在案。到场的法定代理人可以代为行使未\n成年犯罪嫌疑人的诉讼权利。”\nA 项正确，未成年肖某强的母亲已经死亡，父亲外出打工无法到场，肖某礼作为\n肖某强的祖父，是其成年亲属，可以到场。\nB 项正确，肖某强的父母均无法到达现场，丁某军作为其成年亲属，可以到场。\nC 项正确，与 B 项同理，卢某庆作为肖某强的成年亲属，可以到场。\nD 项错误，肖某娟虽为肖某强的姐姐，但现 17 周岁，不属于成年亲属，不能通\n知姐姐肖某娟到场。"},{"id":164,"type":"判断题","question":"南明市新欣县公安局拟对涉嫌寻衅滋事罪的滕某刑事拘留，经查，滕某系新欣县\n人民代表大会代表，半个月前参加了新欣县人民代表大会会议。根据法律规定，\n新欣县公安局在对滕某作出刑事拘留决定前应当书面报请许可。有权许可对滕某\n刑事拘留的是南明市公安局。","choices":[],"answer":"错误","explanation":"《公安机关办理刑事案件程序规定》第一百六十四条规定：“公安机关依\n法对县级以上各级人民代表大会代表拘传、取保候审、监视居住、拘留或者提请\n批准逮捕的，应当书面报请该代表所属的人民代表大会主席团或者常务委员会许\n可。”拟对新欣县人民代表大会代表滕某进行刑事拘留，在新欣县人民代表大会\n闭会期间需要书面报请新欣县人大常委会许可。"},{"id":165,"type":"单选题","question":"尹某因涉嫌帮助信息网络犯罪活动罪被甲县公安局抓获，侦查人员准备冻结尹某\n名下的三张银行卡，关于冻结的说法正确的是（ ）。","choices":[{"key":"A","text":"经向银行出示人民警察证，即可要求银行办理冻结"},{"key":"B","text":"在冻结过程中，发现尹某名下银行卡已经被冻结的，可重复冻结"},{"key":"C","text":"冻结银行存款的期限为一年"},{"key":"D","text":"对冻结的存款，经查明确实与本案无关的，应当在三日以内通知银行解除冻结"}],"answer":"D","explanation":"A 项错误，《公安机关办理刑事案件程序规定》第二百三十九条第一款规\n定：“需要冻结犯罪嫌疑人财产的，应当经县级以上公安机关负责人批准，制作\n协助冻结财产通知书，明确冻结财产的账户名称、账户号码、冻结数额、冻结期\n限、冻结范围以及是否及于孳息等事项，通知金融机构等单位协助办理。”应当\n制作协助冻结财产通知书，而不是仅出示警察证。\nB 项错误，《公安机关办理刑事案件程序规定》第二百四十二条规定：“犯罪嫌\n疑人的财产已被冻结的，不得重复冻结，但可以轮候冻结。”已经被冻结的，不\n得重复冻结。\nC 项错误，《公安机关办理刑事案件程序规定》第二百四十三条规定：“冻结存\n款、汇款、证券交易结算资金、期货保证金等财产的期限为六个月。每次续冻期\n限最长不得超过六个月。对于重大、复杂案件，经设区的市一级以上公安机关负\n责人批准，冻结存款、汇款、证券交易结算资金、期货保证金等财产的期限可以\n为一年。每次续冻期限最长不得超过一年。”冻结银行存款的期限为六个月。\nD 项正确，《公安机关办理刑事案件程序规定》第二百四十七条规定：“对冻结\n的财产，经查明确实与案件无关的，应当在三日以内通知金融机构等单位解除冻\n结，并通知被冻结财产的所有人。”该项说法符合法律规定。"},{"id":166,"type":"多选题","question":"某文化公司拟在市中山公园组织中秋灯会,向公安机关提出举办申请。公安机关\n批准后,发现该文化公司在申请时提供了虚假材料。下列说法正确的是（ ）。","choices":[{"key":"A","text":"公安机关对文化公司组织中秋灯会申请的审批,属于非行政许可的审批事项"},{"key":"B","text":"该文化公司可以委托代理人提出申请"},{"key":"C","text":"公安机关应当撤销对该文化公司的批准决定"},{"key":"D","text":"该公司在三年内不得再次申请组织中秋灯会"}],"answer":"BCD","explanation":"《大型群众性活动安全管理条例》第 11 条规定,公安机关对大型群众性活\n动实行安全许可制度,属于行政许可。因此,A 项错误。\n《行政许可法》第 29 条第 2 款规定,申请人可以委托代理人提出行政许可申请。\n但是,依法应当由申请人到行政机关办公场所提出行政许可申请的除外。《大型\n群众性活动安全管理条例》没有规定必须由申请人到公安机关提出申请。因此,B\n项正确。\n《行政许可法》第 69 条第 2 款规定,被许可人以欺骗等不正当手段取得行政许可\n的,应当予以撤销。因此,C 项正确。\n《行政许可法》第 79 条规定,被许可人以欺骗、贿赂等不正当手段取得的行政许\n可属于直接关系公共安全、人身健康生命财产安全事项的,申请人在 3 年内不得\n再次申请该行政许可。因此,D 项正确。"},{"id":167,"type":"判断题","question":"高某涉嫌抢劫罪，民警于 2012 年 3 月 12 日 10 时将其刑事拘留，3 月 13 日 9 时\n将其送往看守所羁押，3 月 14 日 8 时通知了高某的家属。该做法正确。","choices":[],"answer":"错误","explanation":"《刑事诉讼法》第八十三条规定：“拘留后，应当立即将被拘留人送看守\n所羁押，至迟不得超过二十四小时。除无法通知或者涉嫌危害国家安全犯罪、恐\n怖活动犯罪通知可能有碍侦查的情形以外，应当在拘留后二十四小时以内，通知\n被拘留人的家属。有碍侦查的情形消失以后，应当立即通知被拘留人的家属。”\n3 月 12 日对高某拘留，而且不属于特殊情况，故应在 24 小时之内通知家属，3\n月 14 日才通知超过规定时限。"},{"id":168,"type":"单选题","question":"民警陈某在检查中发现张某驾驶机动车超过核定载质量载货,便扣留了张某的车\n辆,并对张某作出罚款 1000 元决定。张某逾期拒绝缴纳罚款,经催告后,仍不缴纳\n罚款,公安机关对张某加处罚款。下列说法正确的是（ ）。","choices":[{"key":"A","text":"扣留机动车的行为是行政强制执行"},{"key":"B","text":"扣留机动车的措施只能由法律设定"},{"key":"C","text":"陈某应当在返回公安机关后 48 小时内向公安机关负责人报告,并补办批准手\n续"},{"key":"D","text":"对张某可以每日按 30 元加处罚款,加处罚款总额不得超过 1000 元,加处罚款的\n行为是行政强制执行"}],"answer":"D","explanation":"《行政强制法》第 2 条规定,行政强制包括行政强制措施和行政强制执行。\n行政强制措施,是指行政机关在行政管理过程中,为制止违法行为、防止证据损\n毁、避免危害发生、控制危险扩大等情形依法对公民的人身自由实施暂时性限制,\n或者对公民、法人或者其他组织的财物实施暂时性控制的行为。行政强制执行,\n是指行政机关或者行政机关申请人民法院,对不履行行政决定的公民、法人或者\n其他组织,依法强制履行义务的行为。根据《道路交通安全法》第 92 条和《公安\n机关办理行政案件程序规定》第 17 条的规定,扣留机动车属于行政强制措施。因\n此,A 项错误。\n《行政强制法》第 10 条第 2 款规定,尚未制定法律,且属于国务院行政管理职权\n事项的,行政法规可以设定除限制公民人身自由、冻结存款、汇款和应当由法律\n规定的行政强制措施以外的其他行政强制措施。因此,B 项错误。\n《行政强制法》第 19 条规定,情况紧急,需要当场实施行政强制措施的,行政执法\n人员应当在 24 小时内向行政机关负责人报告,并补办批准手续。《公安机关办理\n行政案件程序规定》第 56 条规定,情况紧急,当场实施行政强制措施的,办案人民\n警察应当在 24 小时内依法向其所属的公安机关负责人报告,并补办批准手续。当\n场实施限制公民人身自由的行政强制措施的,办案人民警察应当在返回单位后立\n即报告,并补办批准手续公安机关负责人认为不应当采取行政强制措施的,应当\n立即解除。陈某在返回公安机关后 48 小时内向公安机关负责人报告,并补办批准\n手续,不符合上述规定。因此,C 项错误。\n《行政强制法》第 45 条和《公安机关办理行政案件程序规定》第 218 条规定,\n当事人逾期不履行金钱给付义务的行政决定,行政机关可以每日按罚款数额的\n3%依法加处罚款,加处罚款总额不得超出金钱给付义务的数额。因此,D 项正确。"},{"id":169,"type":"多选题","question":"为抗议甲国非法侵入我国岛屿,李某作为负责人申请在北京组织举行游行示威。\n李某的朋友张某来北京旅游得知李某举行游行示威,表示愿意参加并到公安机关\n代为申请。后李某又亲自到公安机关递交申请,在审批期间,李某多次以同一理由\n递交数份申请书。下列说法正确的是（ ）。","choices":[{"key":"A","text":"张某到公安机关递交书面申请,公安机关应当不予受理"},{"key":"B","text":"如李某正在执行缓刑,则不得担任游行示威负责人"},{"key":"C","text":"张某不得参加李某组织的游行示威活动"},{"key":"D","text":"公安机关可将李某的多份申请视为一个申请合并受理,作出一个是否许可的决\n定"}],"answer":"ABCD","explanation":"根据《集会游行示威法实施条例》第 9 条第 1 款的规定,举行集会、游行、\n示威,必须由其负责人亲自递交书面申请；不是由负责人亲自递交书面申请的,\n主管公安机关不予受理。因此,A 项正确。\n根据《集会游行示威法实施条例》第 8 条第 2 款第 2 项的规定,被判处刑罚尚未\n执行完毕的人员不得担任集会、游行、示威的负责人。因此,B 项正确。\n根据《集会游行示威法》第 15 条的规定,公民不得在其居住地以外的城市发动、\n组织、参加当地公民的集会、游行、示威。因此,C 项正确。\n根据《公安部关于对多次以同一理由递交数份申请书申请游行示威如何处理的批\n复》的规定,对在公安机关审批的法定时间内多次以同一理由递交数份申请书申\n请游行示威的,只要申请主体不变，不论每次递交多少份申请书,公安机关可视为\n一个申请合并受理,作出一个是否许可的决定。因此,D 项正确。"},{"id":170,"type":"判断题","question":"在一起盗窃案件办理过程中，民警上午 9 时对犯罪嫌疑人贾某执行拘传，贾某于\n上午 10 时到案受审，对贾某拘传的起止时间段正确的应是 10 时到 22 时。","choices":[],"answer":"正确","explanation":"《公安机关办理刑事案件程序规定》第七十九条第二款规定：“犯罪嫌疑\n人到案后，应当责令其在拘传证上填写到案时间;拘传结束后，应当由其在拘传\n证上填写拘传结束时间。犯罪嫌疑人拒绝填写的，侦查人员应当在拘传证上注\n明。”第八十条规定：“拘传持续的时间不得超过十二小时;案情特别重大、复\n杂，需要采取拘留、逮捕措施的，经县级以上公安机关负责人批准，拘传持续的\n时间不得超过二十四小时。不得以连续拘传的形式变相拘禁犯罪嫌疑人。”根据\n法律规定，拘传的开始时间为到案时间，结束时间为拘传结束时间，拘传持续时\n间不超过十二小时，贾某上午 10 时到案受审，持续时间不得超过 22 时，故对贾\n某拘传的起止时间段为 10 时到 22 时。"},{"id":171,"type":"单选题","question":"2013 年 6 月 2 日,公安机关对张某涉嫌诈骗罪依法采取刑事拘留措施。7 月 30\n日报请检察院批准逮捕,检察院批准逮捕后,公安机关认为情节显著轻微,危害不\n大,决定撤销案件依法对张某予以治安管理处罚。之后,张某申请国家赔偿。对于\n本案,下列说法正确的是（ ）。","choices":[{"key":"A","text":"公安机关对张某予以治安管理处罚,不必撤销原刑事案件"},{"key":"B","text":"张某有权取得国家赔偿"},{"key":"C","text":"如对张某进行赔偿,赔偿义务机关应当为公安机关"},{"key":"D","text":"如对张某进行赔偿,每日赔偿金按照 2013 年度职工日平均工资计算"}],"answer":"B","explanation":"根据《公安机关办理刑事案件程序规定》第 186 条的规定,情节显著轻微,\n危害不大,不认为是犯罪的,应当撤销案件。立案侦查的刑事案件转为治安管理处\n罚,应当撤销原刑事案件。因此,A 项错误。\n根据《国家赔偿法》第 17 条的规定,公安机关对公民采取逮捕措施后决定销案件\n终止追究刑事责任的,受害人有取得赔偿的权利。因此,B 项正确。\n《国家赔偿法》第 21 条第 3 款规定,对公民采取逮捕措施后决定撤销案件、不起\n诉或者判决宣告无罪的,作出逮捕决定的机关为赔偿义务机关。《最高人民法院、\n最高人民检察院关于办理刑事赔偿案件适用法律若干问题的解释》第 11 条规定,\n对公民采取拘留措施后又采取逮捕措施,国家承担赔偿责任的，作出逮捕决定的\n机关为赔偿义务机关。如对张某进行赔偿，赔偿义务机关应当为人民检察院。因\n此,C 项错误。\n根据《国家赔偿法》第 33 条的规定,侵犯公民人身自由的,每日赔偿金按照国家\n上年度职工日平均工资计算。因此,D 项错误。"},{"id":172,"type":"多选题","question":"甲市乙区公安分局在对李某作出行政拘留处罚决定前,没有告知李某拟作出处罚\n决定的事实、理由及依据。李某以此为由申请行政复议。经查明,李某殴打他人\n致轻微伤,事实清楚,证据确凿。下列说法正确的是（ ）。","choices":[{"key":"A","text":"李某可以向甲市公安局申请行政复议,也可以向乙区人民政府申请行政复议"},{"key":"B","text":"行政复议机关可以作出撤销行政拘留处罚的行政复议决定,同时责令乙区公安\n分局重新作出处罚决定"},{"key":"C","text":"乙区公安分局在履行了处罚前告知程序后,可以根据同一事实和理由重新作出\n行政拘留处罚决定"},{"key":"D","text":"李某对乙区公安分局重新作出的行政拘留处罚决定不服,不能再申请行政复议,\n但可以向人民法院提起行政诉讼"}],"answer":"ABC","explanation":"根据《行政复议法》第 12 条第 1 款的规定,对县级以上地方各级人民政府\n工作部门的具体行政行为不服的,申请人可以选择向该部门的本级人民政府申请\n行政复议,也可以选择向上一级主管部门申请行政复议。因此,A 项正确。\n根据《行政处罚法》第 41 条的规定,行政机关及其执法人员在作出行政处罚决定\n之前,不依法告知当事人拟作出处罚决定的事实、理由和依据的,行政处罚决定不\n能成立。根据《行政复议法》第 8 条的规定,具体行政行为违反法定程序,应当决\n定撤销、变更或者确认该具体行政行为违法；决定撤销或者确认该具体行政行为\n违法的,可以责令被申请人在一定期限内重新作出具体行政行为。乙区公安分局\n在对李某作出行政拘留处罚决定后,没有告知李某拟作出处罚决定的事实、理由\n及依据,李某以此为由申请行政复议,复议机关可以撤销该处罚决定,同时由于李\n某确有违法行为,可以贵令乙区公安分局重新作出处罚决定。因此,B 项正确。\n根据《公安部关于办理行政复议案件有关法律适用问题的批复》第 2 条的规定,\n被申请人重新作出具体行政行为,依法履行了相应执法程序的,可以作出与原具\n体行政行为相同的具体行政行为。因此,C 项正确。\n根据《公安部关于办理行政复议案件有关法律适用问题的批复》第 3 条的规定,\n申请人对被申请人执行复议决定重新作出的具体行政行为不服的,可以依法申请\n行政复议或者向人民法院提起行政诉讼。因此,D 项错误。"},{"id":173,"type":"判断题","question":"民警执行“迎国庆健步走”活动保卫任务时，发现甲在人群中燃放烟花爆竹严重\n威胁公共安全，根据我国人民警察法，现场民警应采取的措施是当场对甲给予口\n头警告。","choices":[],"answer":"错误","explanation":"《人民警察法》第八条规定：“公安机关的人民警察对严重危害社会治安\n秩序或者威胁公共安全的人员，可以强行带离现场、依法予以拘留或者采取法律\n规定的其他措施。”甲在人群中燃放烟花爆竹严重威胁公共安全，人民警察对于\n甲严重威胁公共安全的行为，可以强行带离现场、依法予以拘留或者采取法律规\n定的其他措施。"},{"id":174,"type":"单选题","question":"以下关于侦查工作的说法正确的是（ ）。","choices":[{"key":"A","text":"甲县公安局刑警大队办理贾某强奸案时,由于贾某拒绝采集血液、尿液等生物\n样本,可以经刑警大队长批准强制采集"},{"key":"B","text":"乙县公安局对某凶杀现场进行了勘验,后乙县检察院要求复验,乙县公安局应\n当会同乙县检察院进行复验"},{"key":"C","text":"丙县公安局在办理刘某死亡的案件时,由于刘某死因不明,决定对刘某的尸体\n进行解剖。丙县公安局应当经刘某家属同意才能解剖"},{"key":"D","text":"丁县公安局办理刘某故意杀人案,因刘某在逃,丁县公安局可以在丁县范围内\n直接发布通缉令,通缉刘某,并决定采取必要的技术侦查措施"}],"answer":"A","explanation":"《刑事诉讼法》第 132 条规定,为了确定被害人、犯罪嫌疑人的某些特征、\n伤害情况或者生理状态,可以对人身进行检查,可以提取指纹信息,采集血液、尿\n液等生物样本。犯罪嫌疑人如果拒绝检查,侦查人员认为必要的时候,可以强制检\n查。《公安机关办理刑事案件程序规定》第 217 条规定,为了确定被害人、犯罪\n嫌疑人的某些特征、伤害情况或者生理状态,可以对人身进行检查,依法提取、采\n集肖像、指纹等人体生物识别信息,采集血液、尿液等生物样本。犯罪嫌疑人拒\n绝检查、提取、采集的,侦查人员认为必要的时候,经办案部门负责人批准,可以\n强制检查、提取、采集。因此,A 项正确。\n《刑事诉讼法》第 134 条规定,人民检察院审查案件的时候,对公安机关的勘验、\n检查,认为需要复验、复查时,可以要求公安机关复验、复查,并且可以派检察人\n员参加。《公安机关办理刑事案件程序规定》第 220 条规定,公安机关进行勘验、\n检查后,人民检察院要求复验复查的,公安机关应当进行复验、复查,并可以通知\n人民检察院派员参加。乙县检察院要求公安局复验,公安局不一定要会同检察院\n进行复验。因此,B 项错误。\n《刑事诉讼法》第 131 条规定,对于死因不明的尸体,公安机关有权决定解剖,并\n且通知死者家属到场。 《公安机关办理刑事案件程序规定》第 218 条第 1 款规定,\n为了确定死因,经县级以上公安机关负责人批准,可以解剖尸体,并且通知死者家\n属到场,让其在解剖尸体通知书上签名。因此,C 项错误。\n《刑事诉讼法》155 条第 2 款规定,各级公安机关在自己管辖的地区以内,可以直\n接发布通缉令;超出自己管辖的地区,应当报请有权决定的上级机关发布。《公安\n机关办理刑事案件程序规定》第 274 条第 2 款规定,县级以上公安机关在自己管\n辖的地区内,可以直接发布通缉令；超出自己管辖的地区,应当报请有权决定的上\n级公安机关发布。《刑事诉讼法》第 150 条第 3 款规定,追捕被通缉或者批准、\n决定逮捕的在逃的犯罪嫌疑人、被告人,经过批准,可以采取追捕所必需的技术侦\n查措施。《公安机关办理刑事案件程序规定》第 264 条第 1 款规定,技术侦查措\n施是指由设区的市一级以上公安机关负责技术侦查的部门实施的记录监控、行踪\n监控、通信监控、场所监控等措施。因此,D 项错误。"},{"id":175,"type":"多选题","question":"某县公安局对甲（当地县人大代表）涉嫌故意伤害乙立案侦查。经调查,县公安\n局认为甲不构成犯罪,对其作出行政拘留 10 日的决定。甲申请行政复议,并提出\n暂缓执行行政拘留。下列说法正确的是（ ）。","choices":[{"key":"A","text":"在对甲立案侦查时取得的供述,可以作为对其行政拘留处罚的证据"},{"key":"B","text":"对甲执行行政拘留前,县公安局应当报经县人大主席团或者其常务委员会许可"},{"key":"C","text":"由于甲涉嫌贪污正在被侦查,对其应当作出不暂缓执行行政拘留的决定"},{"key":"D","text":"乙如果对处罚决定无异议,县公安局可以不将处罚决定书复印件送达乙"}],"answer":"ABC","explanation":"根据《公安机关办理行政案件程序规定》第 33、177 条的规定,公安机关\n办理的刑事案件,尚不构刑事处罚,依法应当给予公安行政处理。刑事案件转为行\n政案件办理的,刑事案件办理过程中收集的证据材料,可以作为行政案件的证据\n使用。因此,A 项正确。\n根据《公安机关办理行政案件程序规定》第 174 条第 1 款的规定,对县级以上的\n各级人民代表大会代表予以行政拘留的,作出处罚决定前应当经该级人民代表大\n会主席团或者人民代表大会常务委员会许可。因此,B 项正确。\n根据《公安机关办理行政案件程序规定》第 224 条的规定,被处罚人有其他违法\n犯罪嫌疑,正在被调查或者侦查的,应当作出不暂缓执行行政拘留的决定。因此,C\n项正确。\n根据《公安机关办理行政案件程序规定》第 172 条第 3 款的规定,治安案件有被\n侵害人的,公安机关应当在作出不予行政处罚或者处罚决定之日起 2 日内将决定\n书复印件送达被侵害人。因此,D 项错误。"},{"id":176,"type":"判断题","question":"县级以上人民政府公安机关，在一定的区域和时间，限制人员，车辆的通行或者\n停留，必要时可以实行交通管制措施的情形是：集中开展交通管理整治活动时。","choices":[],"answer":"错误","explanation":"《人民警察法》第十五条规定：“县级以上人民政府公安机关，为预防和\n制止严重危害社会治安秩序的行为，可以在一定的区域和时间，限制人员、车辆\n的通行或者停留，必要时可以实行交通管制。公安机关的人民警察依照前款规定，\n可以采取相应的交通管制措施。”所以必要时可以实行交通管制措施的情形是预\n防和制止严重危害社会治安秩序的行为时。"},{"id":177,"type":"单选题","question":"公安机关应当建立保密工作制度，加强保密宣传教育，强化监督管理，严格保密\n纪律要求，落实保密工作责任，确保国家秘密和警务工作秘密绝对安全。作为公\n安机关的人民警察应当严格遵守保密纪律，下列做法正确的是（ ）。","choices":[{"key":"A","text":"派出所民警小李用手机将奥运会安保信息通过微信拍照发给所长"},{"key":"B","text":"交警小张巡逻下岗后携带涉秘文件去酒店会见朋友，其间并未查看文件"},{"key":"C","text":"宣传民警小赵为方便警务宣传片的制作在公安网计算机上安装无线键盘与无\n线鼠标"},{"key":"D","text":"网安民警小魏在公安网计算机上粘贴“公安网专用计算机禁止处理涉及国家秘\n密信息”标签"}],"answer":"D","explanation":"A 项错误，《公安机关人民警察内务条令》第一百零三条第一款规定：“公\n安民警在制作、传递、复制、使用、保存和销毁涉密信息或者载体过程中，应当\n严格执行国家保密管理规定，确保涉密信息或者载体保密安全。”小李使用微信\n传递奥运会安保信息，违反规定。\nB 项错误，《公安机关人民警察内务条令》第一百零五条规定：“公安民警应当\n执行下列保密守则：（一）不该说的秘密不说；（二）不该知悉的秘密不问；（三）\n不该看的秘密不看；（四）不在私人交往或者公开发表的作品中涉及秘密；（五）\n不在非保密场所阅办、谈论秘密；（六）不在社交媒体发布、传递秘密；（七）\n不擅自记录、复制、拍摄、摘抄、收藏秘密；（八）不擅自携带涉密载体去公共\n场所或者探亲访友；（九）不使用无保密措施的通信设备、普通邮政和计算机互\n联网络传递秘密。”小张巡逻下岗后携带涉密文件去酒店会见朋友，违反保密守\n则。\nC 项错误，《公安机关人民警察内务条令》第一百零六条规定：“使用计算机信\n息系统和信息设备时，应当严格遵守下列规定：······（二）涉密计算机\n不得连接市话和公安专线传真机或者具有传真功能的多功能一体机，不得安装无\n线网卡、无线鼠标、无线键盘等具有无线互联功能的设备，不得安装摄像头、麦\n克风等音视频采集装置。······”小赵在公安网计算机上安装无线键盘与\n无线鼠标，违反规定。\nD 项正确，《公安机关人民警察内务条令》第一百零六条规定：“使用计算机信\n息系统和信息设备时，应当严格遵守下列规定：······（十四）涉密计算\n机应当标注存储、处理信息的最高密级、编号、责任人和涉密计算机专用的标识，\n公安信息网计算机应当标注公安信息网专用和禁止处理涉及国家秘密信息的标\n识，互联网计算机应当标注互联网专用和禁止处理涉及国家秘密信息和警务工作\n秘密信息的标识。······”小魏在公安网计算机上粘贴“公安网专用计算\n机禁止处理涉及国家秘密信息”标签的做法正确。"},{"id":178,"type":"多选题","question":"某县公安局民警陈某、张某在巡逻时发现刘某正在盗窃自行车（价值 400 元）,\n遂将其抓获,并扣押了刘某撬锁的钳子和其随身携带的手机。下列说法正确的是\n（ ）。","choices":[{"key":"A","text":"对刘某可以口头传唤"},{"key":"B","text":"不能扣押刘某的手机"},{"key":"C","text":"扣押发生的保管费用由刘某承担"},{"key":"D","text":"扣押的期限最长不得超过 60 日"}],"answer":"ABD","explanation":"根据《公安机关办理行政案件程序规定》第 67 条第 1 款的规定,对现场发\n现的违法嫌疑人,人民警察经出示人民警察证,可以口头传唤。因此,A 项正确。\n根据《行政强制法》第 23 条和《公安机关办理行政案件程序规定》第 107 条的\n规定,不得扣押与违法行为无关的财物。刘某随身携带的手机与其违法行为无关,\n不能扣押。因此,B 项正确。\n根据《行政强制法》第 26 条第 3 款的规定因扣押发生的保管费用由行政机关承\n担。因此,C 项错误。\n根据《行政强制法》第 25 条第 1 款的规定,扣押的期限不得超过 30 日;情况复杂\n的,经行政机关负责人批准,可以延长,但是延长期限不得超过 30 日。因此,D 项\n正确。"},{"id":179,"type":"判断题","question":"无业人员刘某在旅游景区使用人民警察证冒充民警身份，试图享受购买门票优惠\n政策，被工作人员发现。经查证，民警小钱是刘某的朋友，在刘某要求下将自己\n的证件借给其使用。鉴于此事未造成严重后果，按照《公安机关人民警察纪律条\n令》的相关规定，应给予小钱的处分是警告或者记过。","choices":[],"answer":"正确","explanation":"《公安机关人民警察纪律条令》第二十二条规定：“有下列行为之一的，\n给予警告或者记过处分；情节较重的，给予记大过或者降级处分；情节严重的，\n给予撤职或者开除处分：（一）违反警车管理使用规定或者违反规定使用警灯、\n警报器的；（二）违反规定转借、赠送、出租、抵押、转卖警用车辆、警车号牌、\n警械、警服、警用标志和证件的；（三）违反规定使用警械的。”小钱在刘某的\n要求下将自己的证件借给其使用，属于违规出借人民警察证，由于未造成严重后\n果，应当给予警告或记过处分。"},{"id":180,"type":"单选题","question":"行为能力是按自身意愿以自身行为实际参加法律关系、承担法律义务或享有法律\n权利的资格。下列对于行为能力的说法，符合法律规定的是（ ）。","choices":[{"key":"A","text":"自然人的行为能力始于出生终于死亡"},{"key":"B","text":"没有行为能力不能成为法律关系主体"},{"key":"C","text":"完全行为能力人是指年满十八周岁的公民"},{"key":"D","text":"法人自成立时起就享有完全的行为能力"}],"answer":"D","explanation":"A 项错误，《民法典》第十三条规定：“自然人从出生时起到死亡时止，\n具有民事权利能力，依法享有民事权利，承担民事义务。”本题中，自然人的民\n事权利能力始于出生、终于死亡，而不是民事行为能力。\nB 项错误，自然人从出生时起到死亡时止，具有民事权利能力，依法享有民事权\n利。也就是说，没有民事行为能力并不代表不能成为法律关系主体，可以由其法\n定代理人代理实施民事法律行为。\nC 项错误，《民法典》第十八条规定：“成年人为完全民事行为能力人，可以独\n立实施民事法律行为。十六周岁以上的未成年人，以自己的劳动收入为主要生活\n来源的，视为完全民事行为能力人。”因此，完全行为能力人是指年满十八周岁\n的公民过于绝对。\nD 项正确，《民法典》第五十九条规定：“法人的民事权利能力和民事行为能力，\n从法人成立时产生，到法人终止时消灭。”因此，法人自成立时起就享有完全的\n行为能力。"},{"id":181,"type":"多选题","question":"甲因涉嫌故意伤害罪被公安机关刑事拘留,委托律师乙担任辩护人。下列说法正\n确的是（ ）。","choices":[{"key":"A","text":"乙在辩护中得知甲的目的是杀死被害人,对此情况有权予以保密"},{"key":"B","text":"乙帮助甲毁灭证据,应当由办理甲案件的公安机关对乙涉嫌犯罪的案件立案侦\n查"},{"key":"C","text":"乙可以向公安机关了解延长侦查羁押期限的情况"},{"key":"D","text":"乙持律师执业证书、律师事务所证明和委托书要求会见甲,看守所应当及时安\n排会见,保证乙 48 小时内见到甲"}],"answer":"ACD","explanation":"《刑事诉讼法》第 48 条和《公安机关办理刑事案件程序规定》第 57 条规\n定,辩护律师对在执业活动中知悉的委托人的有关情况和信息,有权予以保密。但\n是,辩护律师在执业活动中知悉委托人或者其他人,准备或者正在实施危害国家\n安全、公共安全以及严重危害他人人身安全的犯罪的,应当及时告知司法机关。\n因此,A 项正确。\n《刑事诉讼法》第 44 条第 2 款规定,辩护人帮助犯罪嫌疑人毁灭证据,涉嫌犯罪\n的,应当由办理辩护人所承办案件的侦查机关以外的侦查机关办理。《公安机关\n办理刑事案件程序规定》第 56 条规定，辩护人或者其他任何人在刑事诉讼中,\n违反法律规定,实施干扰诉讼活动行为的,应当依法追究法律责任。辩护人实施干\n扰诉讼活动行为,涉嫌犯罪,属于公安机关管辖的,应当由办理辩护人所承办案件\n的公安机关报请上一级公安机关指定其他公安机关立案侦查,或者由上一级公安\n机关立案侦查。不得指定原承办案件公安机关的下级公安机关立案侦查。辩护人\n是律师的,立案侦查的公安机关应当及时通知其所在的律师事务所、所属的律师\n协会以及司法行政机关。因此,B 项错误。\n《最高人民法院、最高人民检察院、公安部、国家安全部、司法部、全国人大常\n委会法制工作委员会关于实施刑事诉讼法若干问题的规定》第 6 条规定,辩护律\n师在侦查期间可以向侦查机关了解延长侦查羁押期限的情况。因此,C 项正确。\n《刑事诉讼法》第 39 条第 2 款和《最高人民法院、最高人民检察院、公安部、\n国家安全部、司法部、全国人大常委会法制工作委员会关于实施刑事诉讼法若干\n问题的规定》第 7 条规定,辩护律师持律师执业证书、律师事务所证明和委托书\n或者法律援助公函要求会见在押的犯罪嫌疑人的,看守所应当及时安排会见,保\n证辩护律师在 48 小时以内见到在押的犯罪嫌疑人。《公安机关办理刑事案件程\n序规定》第 53 条第 1 款规定,辩护律师要求会见在押的犯罪嫌疑人,看守所应当\n在查验其律师执业证书、律师事务所证明和委托书或者法律援助公函后,在 48\n小时以内安排律师会见到犯罪嫌疑人,同时通知办案部门。因此,D 项正确。"},{"id":182,"type":"判断题","question":"刑警中队长小刘在侦办一起盗窃案件时，发现其好友王某是该案件的主要嫌疑\n人，公安机关拟对王某刑事拘留。晚上回家后，小刘通过微信告诉了王某这个消\n息。按照相关规定，应当给予小刘的纪律处分是撤职。","choices":[],"answer":"错误","explanation":"《公安机关人民警察纪律条令》第七条规定：“有下列行为之一的，给予\n开除处分：（一）逃往境外或者非法出境、违反规定滞留境外不归的；（二）参\n与、包庇或者纵容危害国家安全违法犯罪活动的；（三）参与、包庇或者纵容黑\n社会性质组织犯罪活动的；（四）向犯罪嫌疑人通风报信的；（五）私放他人出\n入境的。”王某是小刘侦办的盗窃案件中的主要嫌疑人，小刘将拟对王某拘留的\n消息告知王某，属于向犯罪嫌疑人通风报信，应当给予小刘开除的纪律处分。"},{"id":183,"type":"单选题","question":"我国宪法规定，中华人民共和国公民的通信自由和通信秘密受法律的保护。除法\n定机关因法定事由并依照法定程序对通信进行检查外。任何组织或者个人不得侵\n犯公民的通信自由和通信秘密。下列可以对当事人通信进行检查的是（ ）。","choices":[{"key":"A","text":"检察机关依法侦查赵某刑讯逼供案"},{"key":"B","text":"人民法院依法审理钱某侵占案"},{"key":"C","text":"公安机关依法调查孙某侵犯隐私案"},{"key":"D","text":"纪检部门依法依规调查李某违纪案"}],"answer":"A","explanation":"《宪法》第四十条规定：“中华人民共和国公民的通信自由和通信秘密受\n法律的保护。除因国家安全或者追查刑事犯罪的需要，由公安机关或者检察机关\n依照法律规定的程序对通信进行检查外，任何组织或者个人不得以任何理由侵犯\n公民的通信自由和通信秘密。”\nA 项正确，检察机关因追查刑事犯罪的需要，可以对通信进行检查。\nB 项错误，人民法院无权检查通信。\nC 项错误，侵犯隐私案属于治安案件，公安机关在办理治安案件时，不能检查通\n信。\nD 项错误，纪检部门不能对公民的通信进行检查。"},{"id":184,"type":"多选题","question":"关于刑罚裁量，以下说法正确的是（ ）。","choices":[{"key":"A","text":"甲在 17 周岁时犯煽动颠覆国家政权罪被判处 2 年有期徒刑，出狱 6 年后又犯\n帮助恐怖活动罪。甲不成立累犯"},{"key":"B","text":"甲无故辱骂清洁工，乙出于义愤将甲痛打一顿，致其轻伤。后乙主动到派出所\n讲述事情经过。乙不成立自首"},{"key":"C","text":"某村村民丙将邻村某人杀死，公安机关逐户走访寻找线索时来到丙家中。丙看\n到民警上门，误以为公安机关已经掌握了他的犯罪事实，即将杀人过程如实交代。\n丙成立自首"},{"key":"D","text":"丁涉嫌合同诈骗罪被逮捕后，其妻重金收买他人犯罪线索，并在律师帮助下转\n告给丁。丁向公安机关检举，帮助公安机关破获涉案金额上千万元的重大走私犯\n罪案件。丁的行为应当认定为立功"}],"answer":"AC","explanation":"《刑法》第 65 条第 1 款规定，被判处有期徒刑以上刑罚的犯罪分子，刑\n罚执行完毕或者赦免以后，在 5 年以内再犯应当判处有期徒刑以上刑罚之罪的，\n是累犯，应当从重处罚，但是过失犯罪和不满 18 周岁的人犯罪的除外。第 66\n条规定，危害国家安全犯罪、恐怖活动犯罪、黑社会性质的组织犯罪的犯罪分子，\n在刑罚执行完毕或者赦免以后，在任何时候再犯上述任一类罪的，都以累犯论处。\n甲前后两罪虽然均属于成立特殊累犯的罪名范畴，但由于甲犯前罪时不满 18 周\n岁，不能成立累犯。因此，A 项正确。\n根据《最高人民法院关于被告人对行为性质的辩解是否影响自首成立问题的批\n复》的规定，行为人只要犯罪以后自动投案、如实供述自己的罪行的，对行为性\n质的辩解不影响自首的成立。因此，B 项错误。\n根据《最高人民法院关于处理自首和立功若干具体问题的意见》第 1 条的规定，\n在司法机关未确定犯罪嫌疑人，尚在一般性排查询问时主动交代自己罪行的，视\n为自动投案。本案中，丙自动投案、如实供述罪行，成立自首。因此，C 项正确。\n根据《最高人民法院关于处理自首和立功若干具体问题的意见》第 4 条的规定，\n犯罪分子被羁押后与律师、亲友会见过程中违反监管规定，获取他人犯罪线索并\n“检举揭发”的，不能认定为有立功表现。因此，D 项错误。"},{"id":185,"type":"判断题","question":"甲县公安局民警老王和小郭抓捕抢劫嫌疑人赖某时，赖某开枪拒捕。小郭依法开\n枪回击，不慎造成袁某正常停在路边的一辆轿车损坏，损失一万余元。对于袁某\n遭受的损失，由老王和小郭承担责任。","choices":[],"answer":"错误","explanation":"《中华人民共和国人民警察使用警械和武器条例》第十五条规定：“人民\n警察依法使用警械、武器，造成无辜人员伤亡或者财产损失的，由该人民警察所\n属机关参照《中华人民共和国国家赔偿法》的有关规定给予补偿。”小郭依法开\n枪侵犯了袁某的财产权，应由小郭所在的甲县公安局按规定给予补偿。"},{"id":186,"type":"单选题","question":"赵某与妻子黄某育有一子赵某迪，赵某自 2015 年起与妻儿失去联系。2021 年 4\n月，法院根据黄某申请依法宣告赵某死亡，赵某的“遗产”被黄某等人“继承”。\n2022 年 4 月，赵某迪被于某依法收养，次月黄某与陈某结婚。2022 年 9 月赵某\n出现，经向法院申请，死亡宣告被撤销。赵某在被宣告死亡期间，于 2021 年 9\n月从张某处购买一辆轿车。下列对有关法律关系的说法正确的是（ ）。","choices":[{"key":"A","text":"赵某和黄某的婚姻关系自行恢复"},{"key":"B","text":"赵某从张某处购买轿车的行为无法律效力"},{"key":"C","text":"于某收养赵某迪因未经赵某同意而无法律效力"},{"key":"D","text":"赵某可以要求黄某返还“继承”的财产"}],"answer":"D","explanation":"A 项错误，《中华人民共和国民法典》第五十一条规定：“被宣告死亡的\n人的婚姻关系，自死亡宣告之日起消除。死亡宣告被撤销的，婚姻关系自撤销死\n亡宣告之日起自行恢复。但是，其配偶再婚或者向婚姻登记机关书面声明不愿意\n恢复的除外。”黄某已经再婚，其和赵某的婚姻关系并不会自行恢复。\nB 项错误，《中华人民共和国民法典》第四十九条规定：“自然人被宣告死亡但\n是并未死亡的，不影响该自然人在被宣告死亡期间实施的民事法律行为的效力。”\n赵某从张某处购买轿车的行为有法律效力。\nC 项错误，《中华人民共和国民法典》第五十二条规定：“被宣告死亡的人在被\n宣告死亡期间，其子女被他人依法收养的，在死亡宣告被撤销后，不得以未经本\n人同意为由主张收养行为无效。”于某的收养行为有效。\nD 项正确，《中华人民共和国民法典》第五十三条第一款规定：“被撤销死亡宣\n告的人有权请求依照本法第六编取得其财产的民事主体返还财产；无法返还的，\n应当给予适当补偿。”因此，赵某可以要求黄某返还“继承”的财产。"},{"id":187,"type":"多选题","question":"以下有关网上发布信息的行为认定正确的是（ ）。","choices":[{"key":"A","text":"蒋某捏造某国领导人与该国军队文工团的多名女演员保持不正当关系的消息，\n并配图片在网上发布，迅速成为网络热点，引发该国的外交抗议。蒋某构成诽谤\n罪"},{"key":"B","text":"贾某不满自己被下岗，故意编造了其所在国有企业被低价出卖，所有职工将下\n岗的消息，并以“求辟谣”的方式在网上发布，号召大家到市政府门前抗议，引\n起上千名群众聚集。贾某构成寻衅滋事罪"},{"key":"C","text":"张某得知陈某的公司正在申请上市，便收集了该公司的负面消息，在自己网络\n博客上发布。经查该消息属实。后张某以删帖为由，向陈某索取 10 万元。张某\n构成敲诈勒索罪"},{"key":"D","text":"杜某因在网络博客上发布生活常识，从未发布虚假消息，获得众多粉丝关注。\n某公司请杜某在博客上发布该公司产品在国外获奖的消息，并付给 5 万元报酬。\n杜某明知该公司产品未在国外获奖，仍然在自己博客上发布了该虚假消息，扰乱\n市场秩序。杜某构成非法经营罪"}],"answer":"ABC","explanation":"根据《刑法》第 246 条、《最高人民法院、最高人民检察院关于办理利用\n信息网络实施诽谤等刑事案件适用法律若干问题的解释》第 3 条和《最高人民法\n院、最高人民检察院、公安部关于严格依法办理利用信息网络实施诽谤等违法犯\n罪案件的意见》第 1 部分的规定，诽谤外国元首、政府首脑等人员，引发外事交\n涉、外交抗议等，属于造成恶劣国际影响，构成诽谤罪。因此，A 项正确。\n根据《刑法》第 293 条、《最高人民法院、最高人民检察院关于办理利用信息网\n络实施诽谤等刑事案件适用法律若干问题的解释》第 5 条和《最高人民法院、最\n高人民检察院、公安部关于严格依法办理利用信息网络实施诽谤等违法犯罪案件\n的意见》第 1 部分的规定，贾某以“求辟谣”的方式掩盖编造虚假信息的目的，\n在信息网络上散布虚假消息，造成公共秩序严重混乱，构成寻衅滋事罪。因此，\nB 项正确。\n根据《刑法》第 274 条、《最高人民法院、最高人民检察院关于办理利用信息网\n络实施诽谤等刑事案件适用法律若于问题的解释》第 6 条和《最高人民法院、最\n高人民检察院、公安部关于严格依法办理利用信息网络实施诽谤等违法犯罪案件\n的意见》第 1 部分的规定，张某在自己网络博客上以删帖为由，要挟他人提供财\n物，数额较大，即使涉及他人的负面信息是真实的，也构成敲诈勒索罪。因此，\nC 项正确。\n根据《刑法》第 225 条、《最高人民法院、最高人民检察院关于办理利用信息网\n络实施诽谤等刑事案件适用法律若干问题的解释》第 7 条和《最高人民法院、最\n高人民检察院、公安部关于严格依法办理利用信息网络实施诽谤等违法犯罪案件\n的意见》第 1 部分的规定，个别网民并非专门从事非法经营活动，偶尔一两次帮\n助他人发帖，并收取一定费用的，即使数额达到标准，一般也不宜定为以“营利”\n为目的。杜某并非专门从事非法经营活动，第一次帮助发帖并收取费用，不宜认\n定为以营利为目的，不构成非法经营罪。因此，D 项错误。"},{"id":188,"type":"判断题","question":"中国人民警察警徽是人民警察的象征和标志，使用警徽及其图案应当严肃、庄重，\n并严格使用范围。北宁县公安局设计警察文创产品，在商标上印制警徽，该做法\n符合规定。","choices":[],"answer":"错误","explanation":"根据《人民警察警徽使用管理规定》第六条规定：“警徽及其图案不得用\n于：（一）商标、商业广告；（二）日常生活的陈设布置；（三）私人婚、丧、\n庆、悼活动；（四）娱乐活动；（五）其他有碍于警徽庄严的场合或者物品。”\n北宁县公安局设计警察文创产品，商标上印制警徽属于第（一）款的情形，不符\n合规定。"},{"id":189,"type":"单选题","question":"高庄村村委会为了提高村集体收入，与廖某签订土地流转经营合同，将本村集体\n经营的 8 亩耕地（永久基本农田）租给廖某栽培城镇绿化常用树种，租金为每年\n6 万元，合同有效期 3 年。因廖某没有按合同支付租金，村委会将其诉至法院。\n对此诉讼，有高庄村村民咨询社区民警小赵，小赵的下列说法正确的是（ ）。","choices":[{"key":"A","text":"调解并制作调解书结案"},{"key":"B","text":"判决廖某依约支付租金"},{"key":"C","text":"确认合同无效并各自担责"},{"key":"D","text":"解除合同由违约方赔偿损失"}],"answer":"C","explanation":"根据《土地管理法》第三十五条规定：“永久基本农田经依法划定后，任\n何单位和个人不得擅自占用或者改变其用途。国家能源、交通、水利、军事设施\n等重点建设项目选址确实难以避让永久基本农田，涉及农用地转用或者土地征收\n的，必须经国务院批准。禁止通过擅自调整县级土地利用总体规划、乡（镇）土\n地利用总体规划等方式规避永久基本农田农用地转用或者土地征收的审批。”根\n据《民法典》第一百五十三条规定：“违反法律、行政法规的强制性规定的民事\n法律行为无效。但是，该强制性规定不导致该民事法律行为无效的除外。违背公\n序良俗的民事法律行为无效。”本题中，高庄村村委会将本村集体经营的 8 亩耕\n地（永久基本农田）租给廖某栽培城镇绿化常用树种的做法违反《土地管理法》，\n该合同无效。\nA 项错误，无效合同自始无约束力，法院应直接确认无效，而非调解。\nB 项错误，合同无效导致租金条款无效，法院不得支持履行违法合同义务。\nC 项正确，根据《民法典》第一百五十七条规定：“民事法律行为无效、被撤销\n或者确定不发生效力后，行为人因该行为取得的财产，应当予以返还；不能返还\n或者没有必要返还的，应当折价补偿。有过错的一方应当赔偿对方由此所受到的\n损失；各方都有过错的，应当各自承担相应的责任。法律另有规定的，依照其规\n定。”\nD 项错误，合同解除以合同有效为前提，而本案合同因违法自始无效，不存在“解\n除”问题。"},{"id":190,"type":"多选题","question":"育心学校学生陈×（15 周岁）因向同学索要钱财、打架斗殴等行为影响恶劣，\n被学校处分。后陈×不思悔改，招揽多人成立“龙兴帮”（成员多数为 15 岁至\n17 岁的在校学生），实施违法活动，欺压在校学生，严重破坏了学校秩序。属\n地公安局办理此案件时，可以自行决定对陈×采取矫治教育措施的有（ ）。","choices":[{"key":"A","text":"予以训诫"},{"key":"B","text":"责令参加社会服务活动"},{"key":"C","text":"责令接受心理辅导、行为矫治"},{"key":"D","text":"将其送入专门学校接受专门教育"}],"answer":"ABC","explanation":"A、B、C 项正确，《预防未成年人犯罪法》第四十一条规定：“对有严重\n不良行为的未成年人，公安机关可以根据具体情况，采取以下矫治教育措施：（一）\n予以训诫；（二）责令赔礼道歉、赔偿损失；（三）责令具结悔过；（四）责令\n定期报告活动情况；（五）责令遵守特定的行为规范，不得实施特定行为、接触\n特定人员或者进入特定场所；（六）责令接受心理辅导、行为矫治；（七）责令\n参加社会服务活动；（八）责令接受社会观护，由社会组织、有关机构在适当场\n所对未成年人进行教育、监督和管束；（九）其他适当的矫治教育措施。”\nD 项错误，《预防未成年人犯罪法》第四十三条规定：“对有严重不良行为的未\n成年人，未成年人的父母或者其他监护人、所在学校无力管教或者管教无效的，\n可以向教育行政部门提出申请，经专门教育指导委员会评估同意后，由教育行政\n部门决定送入专门学校接受专门教育。”第四十四条规定：“未成年人有下列情\n形之一的，经专门教育指导委员会评估同意，教育行政部门会同公安机关可以决\n定将其送入专门学校接受专门教育：（一）实施严重危害社会的行为，情节恶劣\n或者造成严重后果；（二）多次实施严重危害社会的行为；（三）拒不接受或者\n配合本法第四十一条规定的矫治教育措施；（四）法律、行政法规规定的其他情\n形。”题干未有经专门教育指导委员会评估同意的相关表述，公安机关不可以将\n其送入专门学校接受专门教育。"},{"id":191,"type":"判断题","question":"花雨市公安局花城派出所准备选定辖区内的金城购物广场作为试点推行“十户联\n防”机制，即选取 50 米范围内的商户组成群众性应急联动小组开展工作，同时\n指派民警小莫对商户进行指导。小莫接到任务后准备指导商户使用防刺服、催泪\n喷射器，该做法正确。","choices":[],"answer":"错误","explanation":"根据《人民警察法》第三十六条第二款规定：“人民警察的警用标志、制\n式服装、警械、证件为人民警察专用，其他个人和组织不得持有和使用。”商户\n无权使用警械，故指导商户使用防刺服、催泪喷射器的行为是不符合规定的。"},{"id":192,"type":"单选题","question":"督察制度是为了完善公安机关自我约束机制而依法建立的一种公安内部监督制\n度。根据《公安机关督察条例》的规定，督察机构对公安机关及其人民警察依法\n履行职责、行使职权和遵守纪律的事项，进行现场督察。下列事项中不符合督察\n机构现场督察的是（ ）。","choices":[{"key":"A","text":"刑侦大队执行群众上门报案“三个当场”制度的情况"},{"key":"B","text":"治安大队开展音乐节安保活动现场踏勘的情况"},{"key":"C","text":"巡特警大队开展红蓝对抗演练使用武器的情况"},{"key":"D","text":"派出所民警清查辖区旅馆行动的情况"}],"answer":"C","explanation":"根据《公安机关督察条例》第四条规定：“督察机构对公安机关及其人民\n警察依法履行职责、行使职权和遵守纪律的下列事项，进行现场督察：（一）重\n要的警务部署、措施、活动的组织实施情况；（二）重大社会活动的秩序维护和\n重点地区、场所治安管理的组织实施情况； （三）治安突发事件的处置情况；\n（四）\n刑事案件、治安案件的受理、立案、侦查、调查、处罚和强制措施的实施情况；\n（五）治安、交通、户政、出入境、边防、消防、警卫等公安行政管理法律、法\n规的执行情况；（六）使用武器、警械以及警用车辆、警用标志的情况；（七）\n处置公民报警、请求救助和控告申诉的情况；（八）文明执勤、文明执法和遵守\n警容风纪规定的情况；（九）组织管理和警务保障的情况；（十）公安机关及其\n人民警察依法履行职责、行使职权和遵守。”\nA 项正确，刑侦大队执行群众上门报案“三个当场”制度的情况符合上述第（七）\n款的要求，属于督察机构现场督察的内容。\nB 项正确，治安大队开展音乐节安保活动现场踏勘的情况符合上述第（一）款的\n要求，属于督察机构现场督察的内容。\nC 项错误，巡特警大队开展红蓝对抗演练属于内部的演练，其间使用武器的情况\n不属于依法履行职责、行使职权和遵守纪律中的事项，故不属于督察机构现场督\n察的内容。\nD 项正确，派出所民警清查辖区旅馆行动的情况符合上述第（二）款中的要求，\n属于督察机构现场督察的内容。"},{"id":193,"type":"多选题","question":"某年 12 月，刘某先后借给朋友李某 8 万元、5 万元，约定借期为一年。期满后\n刘某一直未向李某讨要。三年后李某主动归还刘某 8 万元借款，一个月后刘某又\n向李某讨要 5 万元借款。此时李某听说借款均已过诉讼时效，随即拒绝归还 5\n万元，并以曾帮助刘某完成重要事务为由，要求刘某退还已归还的 8 万元。双方\n争执不下，到派出所咨询，民警依法可以答复双方的有（ ）。","choices":[{"key":"A","text":"刘某应当向李某退还 8 万元"},{"key":"B","text":"李某无权要求刘某退还 8 万元"},{"key":"C","text":"5 万元的借款并未超过诉讼时效"},{"key":"D","text":"李某可以就 5 万元提出不履行抗辩"}],"answer":"BD","explanation":"A 项错误，B、D 项正确，《民法典》第一百九十二条规定：“诉讼时效期\n间届满的，义务人可以提出不履行义务的抗辩。诉讼时效期间届满后，义务人同\n意履行的，不得以诉讼时效期间届满为由抗辩；义务人已经自愿履行的，不得请\n求返还。”因此，李某主动返还的 8 万元，不得请求返还，未返还的 5 万元，可\n以提出不履行的抗辩。\nC 项错误，《民法典》第一百八十八条规定：“向人民法院请求保护民事权利的\n诉讼时效期间为三年。法律另有规定的，依照其规定。”借款期满后刘某一直未\n找李某讨要借款，且又经过三年，则诉讼时效已经经过。"},{"id":194,"type":"判断题","question":"我国《宪法》规定，各少数民族聚居的地方实行区域自治，设立自治机关，行使\n自治权。各民族自治地方都是中华人民共和国不可分离的部分。xx 自治区人民\n代表大会常务委员会属于民族自治机关。","choices":[],"answer":"错误","explanation":"《宪法》第一百一十二条规定：“民族自治地方的自治机关是自治区、自\n治州、自治县的人民代表大会和人民政府。”自治区的人民代表大会常务委员会\n不是自治机关。"},{"id":195,"type":"单选题","question":"周某与赵某因工作争执致赵某手部轻微伤。根据法律的规定，经双方申请，辖区\n派出所进行了治安调解，调解协议约定周某赔偿赵某 500 元，但协议未履行。一\n个月后，赵某以伤势过重为由要求派出所再次进行调解追加赔偿费用。根据《公\n安机关办理行政案件程序规定》，对赵某提出的要求，派出所下列做法正确的是\n（ ）。","choices":[{"key":"A","text":"根据赵某的主张，要求周某追加赔偿费用"},{"key":"B","text":"告知赵某向人民法院提起民事诉讼"},{"key":"C","text":"申请人民法院强制执行"},{"key":"D","text":"进行第二次调解"}],"answer":"B","explanation":"A、C 项错误，B 项正确，根据《公安机关办理行政案件程序规定》第一百\n八十五条第一款规定：“调解达成协议并履行的，公安机关不再处罚。对调解未\n达成协议或者达成协议后不履行的，应当对违反治安管理行为人依法予以处罚；\n对违法行为造成的损害赔偿纠纷，公安机关可以进行调解，调解不成的，应当告\n知当事人向人民法院提起民事诉讼。”故针对违法行为造成的损害赔偿问题，及\n达成协议不履行的，公安机关应当引导其去人民法院提起民事诉讼，而非直接追\n加赔偿或者申请法院强制执行。\nD 项错误，《公安机关办理行政案件程序规定》第一百八十三条规定：“调解一\n般为一次。对一次调解不成，公安机关认为有必要或者当事人申请的，可以再次\n调解，并应当在第一次调解后的七个工作日内完成。”根据规定可知，两次调解\n的前提是第一次调解不成，符合条件可在第一次调解后的七个工作日内进行再次\n调解，本题不符合上述要求，不能再次组织调解。"},{"id":196,"type":"多选题","question":"某日，湖东派出所民警老陈、小王巡逻时，发现一名男子形迹可疑，立即上前盘\n查。小王对该男子进行盘问和人身安全检查，老陈负责警戒。下列选项中，小王\n进行人身安全检查做法正确的有（ ）。","choices":[{"key":"A","text":"从双腿开始自下而上顺序进行检查"},{"key":"B","text":"重点检查四肢、胸部、腰部等部位"},{"key":"C","text":"命令其自行将其衣服口袋翻出接受检查"},{"key":"D","text":"采取用手轻拍、触摸方法检查其衣服外层"}],"answer":"BD","explanation":"《公安机关人民警察盘查规范》第十一条规定：“对可疑人员进行人身检\n查时，应当遵守下列规定：（一）有效控制被检查的嫌疑对象，在警戒人员的掩\n护下对其进行检查，防止自身受到攻击和伤害；（二）对女性进行人身检查，应\n当由女性工作人员进行，可能危及检查民警人身安全或者直接危害公共安全的除\n外；（三）对拒绝接受检查的，民警可依法将其带回公安机关继续盘问；（四）\n对可能携带凶器、武器或者爆炸物品的违法犯罪嫌疑人检查时，应当先检查其有\n无凶器、武器和爆炸物品，如有，则应当当场予以扣押，必要时，可以先依法使\n用约束性警械，然后进行检查；（五）责令被检查人伸开双臂高举过头，面向墙、\n车等，扶墙或者扶车站立，双脚分开尽量后移，民警站于其身后并将一只脚置于\n其双脚中间，迅速从被检查人的双手开始向下对衣领及身体各部位进行检查，特\n别注意腋下、腰部、裆部及双腿内侧等可能藏匿凶器或者武器的部位；（六）当\n盘查对象有异常举动时，民警应当及时发出警告，命令其停止动作并做好自身防\n范，可以依法视情使用警棍、催泪喷雾器及武器等予以制止。”\nA 项错误，B 项正确，符合上述第（五）项，伸开双臂高举过头，从双手开始向\n下检查说明应当是自上而下进行检查，故 A 项表述错误；特别注意可能藏匿凶器\n或者武器的部位，B 项中四肢、胸部、腰部等部位属于可能藏匿的部位，应当重\n点检查，故 B 项表述正确。\nC 项错误，《公安机关执法细则》规定：“11-04.盘问、检查的程序 3.人身安全\n检查。······（6）必要时，穿戴防护用具或者使用工具进行检查，谨防\n因接触注射针筒、刀片等物品而感染疾病或者受伤。在保证安全的前提下，可以\n命令被检查人将其衣服口袋翻出、解下腰带、脱掉鞋袜接受检查。”让其自行将\n其衣服口袋翻出接受检查，需在保证安全的前提下进行。故 C 项表述错误。\nD 项正确，应采取用手轻拍、触摸方法检查其衣服外层。"},{"id":197,"type":"判断题","question":"被害人周某与行为人吴某系婆媳关系。某日，吴某进入周某的房间，拿起周某所\n盖的棉被捂在其脸上，并用双手按压周某的口鼻，周某用力喊叫并试图掰开吴某\n的手指，吴某见周某痛苦挣扎而心生怜悯，便揭开棉被离开现场。本案中，吴某\n的行为属于犯罪中止。","choices":[],"answer":"正确","explanation":"根据《刑法》第二十四条第一款规定：“在犯罪过程中，自动放弃犯罪或\n者自动有效地防止犯罪结果发生的，是犯罪中止。”吴某在实施犯罪过程中见周\n某痛苦挣扎而心生怜悯，便揭开棉被离开现场，属于自动放弃犯罪，构成犯罪中\n止。"},{"id":198,"type":"单选题","question":"在公安队伍建设中，公安机关及时奖励在各项工作中做出突出成绩的集体和个\n人，能够激发和调动各级公安机关和广大民警的工作积极性、主动性、创造性，\n但须依照有关规定执行。临江县公安局刑侦大队成功侦破了一起涉及众多受害人\n的网络诈骗案件，为人民群众挽回了巨额经济损失，受到了社会各界广泛赞誉，\n省公安厅决定为其记集体二等功。对于该刑侦大队的集体奖励，下列说法不正确\n的是（ ）。","choices":[{"key":"A","text":"应颁发奖金"},{"key":"B","text":"应举行授奖仪式"},{"key":"C","text":"应颁发奖匾或者奖状"},{"key":"D","text":"应为全体民警颁发奖章"}],"answer":"D","explanation":"A 项正确，根据《公安机关人民警察奖励条令》第三十四条规定：“奖励\n批准机关对获得奖励的集体和个人统一按照下列标准颁发奖金：集体嘉奖五千\n元，集体三等功一万元，集体二等功两万元，集体一等功三万元，集体荣誉称号\n五万元。个人嘉奖两千元，个人三等功五千元，个人二等功一万元，个人一等功\n两万元，全国公安系统二级英雄模范五万元，全国公安系统一级英雄模范八万元。\n集体奖励的奖金一般作为工作经费由集体使用，原则上不得向个人发放。”颁发\n奖金的说法正确。\nB 项正确，根据《公安机关人民警察奖励条令》第二十四条第二款规定：“对集\n体和个人实施奖励的决定应当及时宣布，并举行简约、俭朴的授奖仪式。必要时，\n可以召开表彰会。”举行授奖仪式说法正确。\nC 项正确、D 项错误，根据《公安机关人民警察奖励条令》第三十条规定：“奖\n励批准机关对获得奖励的集体颁发奖匾或者奖状；对获得记三等功以上奖励的个\n人颁发奖章和证书；对获得嘉奖奖励的个人颁发证书。”本题中为刑侦大队的集\n体奖励——记集体二等功，故对获得奖励的集体颁发奖匾或者奖状，而非对全体\n民警颁发奖章。"},{"id":199,"type":"多选题","question":"公安民警在规定的工作时间应当按要求着装，但也有不着装的情况。不着装的情\n形包括（ ）。","choices":[{"key":"A","text":"执行侦查（察）、警卫、外事等特殊工作任务不宜着装的"},{"key":"B","text":"工作时间非因公外出的"},{"key":"C","text":"女性民警怀孕期间"},{"key":"D","text":"民警在备勤期间"}],"answer":"ABC","explanation":"根据《公安机关人民警察内务条令》第三十三条规定：“公安民警在规定\n的工作时间应当按要求着装。遇有下列情形之一的，可以不着装：（一）执行侦\n查（察）、警卫、外事等特殊工作任务不宜着装的；（二）工作时间非因公外出\n的；（三）女性民警怀孕期间；（四）其他不宜或者不需要着装的情形。”\nA 项正确，符合上述第一项规定。\nB 项正确，符合上述第二项规定。\nC 项正确，符合上述第三项规定。\nD 项错误，民警在备勤期间应按规定着装。"},{"id":200,"type":"判断题","question":"自然人的个人信息受法律保护。所以在任何情况下，个人信息处理者都不能处理\n不满 14 周岁未成年人的个人信息。","choices":[],"answer":"错误","explanation":"根据《个人信息保护法》第三十一条规定：“个人信息处理者处理不满十\n四周岁未成年人个人信息的，应当取得未成年人的父母或者其他监护人的同意。\n个人信息处理者处理不满十四周岁未成年人个人信息的，应当制定专门的个人信\n息处理规则。”因此个人信息处理者能处理不满 14 周岁未成年人的个人信息，\n只是应当取得未成年人的父母或者其他监护人的同意。"},{"id":201,"type":"单选题","question":"公安民警应当严格遵守纪律、依法履行职责，如有违反职业纪律的，必须承担纪\n律责任。根据相关规定，下列情形应给予纪律处分的是（ ）。","choices":[{"key":"A","text":"民警老周安排女警小李、小邓搜查盗窃嫌疑人宋 X（女）的身体"},{"key":"B","text":"民警小赵对涉嫌出售假币罪的李 X 刑事拘留第七日提请批准逮捕"},{"key":"C","text":"民警小魏与警务辅助人员小郑在执法办案中心接受报案人王某的材料"},{"key":"D","text":"民警小宗安排有医护资质的在押人员郑 X 在其办公室为民警作诊疗"}],"answer":"D","explanation":"A 项正确，《公安机关办理刑事案件程序规定》第二百二十五条第三项规\n定：“搜查妇女的身体，应当由女工作人员进行。”民警老周的做法符合法律规\n定。\nB 项正确，《公安机关办理刑事案件程序规定》第一百二十九条规定：“对被拘\n留的犯罪嫌疑人，经过审查认为需要逮捕的，应当在拘留后的三日以内，提请人\n民检察院审查批准。在特殊情况下，经县级以上公安机关负责人批准，提请审查\n批准逮捕的时间可以延长一日至四日。”因此，民警小赵对涉嫌出售假币罪的李\nX 刑事拘留第七日提请批准逮捕符合规定。\nC 项正确，《公安机关办理行政案件程序规定》第五十二条第二款规定：“接报\n案、受案登记、接受证据、信息采集、调解、送达文书等工作，可以由一名人民\n警察带领警务辅助人员进行，但应当全程录音录像。”该项做法符合法律规定。\nD 项错误，《中华人民共和国看守所条例实施办法》第四十四条规定：“组织人\n犯劳动，必须量力而行，患病的人犯、死刑犯不得参加。严禁私自使用人犯为任\n何单位和个人干活。”因此不得安排在押人员在民警的办公室为民警做诊疗。"},{"id":202,"type":"多选题","question":"民警小吴在进行执法时，现场人员不配合，用言语辱骂、推搡小吴，还拨打电话\n投诉小吴暴力执法。督察部门迅速响应，第一时间到达现场。经查，小吴现场执\n法不存在违法违纪行为。有关部门应（ ）。","choices":[{"key":"A","text":"主动启动民警维权等相关工作程序"},{"key":"B","text":"代表小吴向人民法院提起侵犯名誉权民事诉讼"},{"key":"C","text":"通过公开的形式，在一定范围内澄清事实，消除影响"},{"key":"D","text":"抚慰因依法履行职责、行使职权受到侵害的民警小吴"}],"answer":"ACD","explanation":"A 项正确，《公安机关维护民警执法权威工作规定》第二十条规定：“民\n警认为因依法履行职责、行使职权受到侵害的，民警及其近亲属或者民警所在单\n位可以向所属公安机关警务督察部门提出维护执法权威申请，一般情况下应当通\n过书面形式提出，紧急情况下可以口头提出。警务督察部门在工作中发现民警执\n法权威受到侵犯的情形、线索，应当主动启动相关工作程序。”\nB 项错误，《公安机关维护民警执法权威工作规定》第九条第二款规定：“民警\n由于行为人的行为遭受人身或者财产损失的，公安机关应当支持民警通过提起刑\n事附带民事诉讼或者民事诉讼等法律途径，维护自身合法权益。”侵犯名誉权的\n民事诉讼应由被侵权人本人作为原告提出，而非由督察机构代为提出。\nC 项正确，《公安机关维护民警执法权威工作规定》第二十三条规定：“民警因\n履行职责、行使职权行为受到不实投诉、诬告诽谤、侮辱、恶意炒作，以及被错\n误审查调查、追究责任后，相关部门予以纠正的，警务督察部门应当通过公开的\n形式，在一定范围内澄清事实，消除影响。受到公安机关内部处分、处理的，公\n安机关应当及时撤销相关决定并恢复民警公职身份和原职务、职级。”\nD 项正确，《公安机关维护民警执法权威工作规定》第二十四条规定：“公安机\n关应当建立维护民警执法权威抚慰金制度，规范审批和管理使用。民警所属公安\n机关及其政工人事部门、警务督察部门负责人应当出面抚慰因依法履行职责、行\n使职权受到侵害的民警。”"},{"id":203,"type":"判断题","question":"犯罪嫌疑人甲涉嫌参与一桩盗窃案。在讯问过程中，甲的态度很差，经常拒不答\n话。派出所所长老李给讯问民警小赵下达了命令，要求小赵上点“私刑”，逼甲\n开口。小赵觉得所长的命令不妥，但认为还是要坚决执行上级的命令。","choices":[],"answer":"错误","explanation":"根据《人民警察法》第三十三条规定：“人民警察对超越法律、法规规定\n的人民警察职责范围的指令，有权拒绝执行，并同时向上级机关报告。”刑讯逼\n供属于违法行为，超越了警察的职责范围，小赵应拒绝执行。"},{"id":204,"type":"单选题","question":"《民法典》第一百五十条规定：“一方或者第三人以胁迫手段。使对方在违背真\n实意思的情况下实施的民事法律行为，受胁迫方有权请求人民法院或者仲裁机构\n予以撤销。”下列选项中，不符合《民法典》所指胁迫情形的是（ ）。","choices":[{"key":"A","text":"李某以举报王某诈骗为要挟，向王某借款 1 万元，王某照办，后经查实王某构\n成诈骗罪"},{"key":"B","text":"张某以举报宋某盗窃为要挟，要求低价购买宋某的名贵犬只，宋某照办，后经\n查实宋某不构成盗窃罪"},{"key":"C","text":"齐某以公开马某个人隐私为要挟，要求马某高价购买自己即将报废的汽车，马\n某照办"},{"key":"D","text":"赵某以举报孙某醉酒驾车为要挟，要求孙某赔偿自己被其撞伤的必要医疗费和\n补偿金，孙某照办"}],"answer":"D","explanation":"胁迫的成立需满足四个要件：①存在胁迫行为；②胁迫具有不法性；③胁\n迫与受胁迫方实施民事法律行为之间存在因果关系；④胁迫达到使受胁迫方“违\n背真实意思”的程度。\nA 项正确，李某以举报王某的真实犯罪行为为要挟，向王某借款 1 万元，其目的\n并非维护公共利益或自身合法权益，而是获取不正当的借款利益，属于滥用合法\n权利进行要挟，具有不法性。该项属于胁迫情形。\nB 项正确，张某举报的内容经查实不成立，即张某的举报属于“虚假举报”，本\n身违反《治安管理处罚法》的规定，其行为具有不法性，宋某也基于胁迫行为将\n名贵犬只低价卖给张某，张某的行为属于胁迫情形。\nC 项正确，公开他人个人隐私是《民法典》明确禁止的侵权行为，齐某以“公开\n隐私”为要挟，属于以加害他人合法权益为要挟，具有明显不法性。马某基于齐\n某的胁迫行为高价购买齐某的报废汽车，属于胁迫情形。\nD 项错误，孙某醉酒驾车撞伤赵某，赵某享有法定的损害赔偿请求权，赵某的要\n挟目的是实现自己的合法赔偿权利，而非谋取不正当利益，不具有不法性，赵某\n不属于胁迫。"},{"id":205,"type":"多选题","question":"某派出所民警小刘为同学聚会多次利用公安网查找失联同学信息。聚会期间，小\n刘耐心解答了同学于某咨询换领身份证的相关事宜，婉言拒绝了同学钱某询问其\n亲戚案件的进展情况。聚会结束后小刘开警车送同学去机场。小刘行为中属于违\n纪的有（ ）。","choices":[{"key":"A","text":"利用公安网查找失联同学信息"},{"key":"B","text":"解答于某换领身份证的问题"},{"key":"C","text":"婉拒钱某询问案件进展情况"},{"key":"D","text":"亲自开警车送同学去机场"}],"answer":"AD","explanation":"A 项正确，《公安机关人民警察纪律条令》第二十五条规定：“违反规定\n使用公安信息网的，给予警告处分；情节较重的，给予记过或者记大过处分；情\n节严重的，给予降级或者撤职处分。”小刘利用公安信息网查同学的信息是违反\n规定使用的行为。\nB 项错误，小刘耐心解决于某咨询身份证的相关事宜体现的是为人民服务，并不\n违反规定。\nC 项错误，小刘婉拒钱某的行为是依法办事的行为，没有泄露案情和以权谋私，\n并不违反规定。\nD 项正确，《公安机关人民警察纪律条令》第二十二条规定：“有下列行为之一\n的，给予警告或者记过处分；情节较重的，给予记大过或者降级处分；情节严重\n的，给予撤职或者开除处分：（一）违反警车管理使用规定或者违反规定使用警\n灯、警报器的；（二）违反规定转借、赠送、出租、抵押、转卖警用车辆、警车\n号牌、警械、警服、警用标志和证件的；（三）违反规定使用警械的。”小刘用\n警车送同学去机场的行为违反了规定。"},{"id":206,"type":"判断题","question":"犯罪嫌疑人张某因涉嫌盗窃罪，被公安机关刑事拘留。为了确定张某的住宅有无\n涉案的赃物，有权批准对张某住宅进行搜查的是：派出所所长","choices":[],"answer":"错误","explanation":"《公安机关办理刑事案件程序规定》第二百一十七条规定：“为了收集犯\n罪证据、查获犯罪人，经县级以上公安机关负责人批准，侦查人员可以对犯罪嫌\n疑人以及可能隐藏罪犯或者犯罪证据的人的身体、物品、住处和其他有关的地方\n进行搜查。”根据规定，搜查应当经县级以上公安机关负责人批准。"},{"id":207,"type":"单选题","question":"《人民警察法》规定，拒绝或阻碍人民警察依法执行职务的应当给予治安处罚。\n下列选项中应当认定为阻碍执行职务的行为是（ ）。","choices":[{"key":"A","text":"甲不满其小旅馆被取缔，与执法的民警激烈争辩"},{"key":"B","text":"乙在民警查处其父亲赌博行为时，公然辱骂推搡民警小黄"},{"key":"C","text":"民警小李未按规定程序认定丙开的超市消防不合格，丙拒不执行"},{"key":"D","text":"丁违法驾驶电动车被交警老林发现，丁见状加速逃离执勤区域"}],"answer":"B","explanation":"《人民警察法》第三十五条规定：“拒绝或者阻碍人民警察依法执行职务，\n有下列行为之一的，给予治安管理处罚：\n（一）公然侮辱正在执行职务的人民警察的；\n（二）阻碍人民警察调查取证的；\n（三）拒绝或者阻碍人民警察执行追捕、搜查、救险等任务进入有关住所、场所\n的；\n（四）对执行救人、救险、追捕、警卫等紧急任务的警车故意设置障碍的；\n（五）有拒绝或者阻碍人民警察执行职务的其他行为的。以暴力、威胁方法实施\n前款规定的行为，构成犯罪的，依法追究刑事责任。”\nA 项错误，小旅馆已经被取缔，执法行为已经完成，未体现出正在执行职务，甲\n与民警的争吵不应认定为阻碍执行职务。\nB 项正确，乙的辱骂推搡行为发生在民警查处其父赌博行为的现场，民警正在执\n行职务，乙的辱骂推搡行为阻碍了民警的调查取证，应当认定为阻碍执行职务。\nC 项错误，民警小李的执法行为已构成程序违法，丙的行为不属于阻碍执行职务。\nD 项错误，丁的逃离行为是逃避的一种反应，是拒绝执法行为，不应认定为阻碍\n执行职务。"},{"id":208,"type":"多选题","question":"某日 16 时许，某次高铁列车准备开车时，乘客罗某以等待丈夫为由，用身体强\n行阻拦车门关闭，不听乘务人员劝阻，造成该次列车延迟发车，接警后到现场的\n民警针对罗某扒车门的行为，可以采取的措施有（ ）。","choices":[{"key":"A","text":"口头传唤"},{"key":"B","text":"口头警告"},{"key":"C","text":"强行带离现场"},{"key":"D","text":"保护性约束措施"}],"answer":"ABC","explanation":"A 项正确，《公安机关办理行政案件程序规定》第六十七条第一款规定：\n“需要传唤违法嫌疑人接受调查的，经公安派出所、县级以上公安机关办案部门\n或者出入境边防检查机关负责人批准，使用传唤证传唤。对现场发现的违法嫌疑\n人，人民警察经出示人民警察证，可以口头传唤，并在询问笔录中注明违法嫌疑\n人到案经过、到案时间和离开时间。”民警可以对罗某进行口头传唤。\nB 项正确，民警针对罗某扒车门的违法行为可以通过警告的方式制止违法犯罪行\n为。\nC 项正确，《人民警察法》第八条规定：“公安机关的人民警察对严重危害社会\n治安秩序或者威胁公共安全的人员，可以强行带离现场、依法予以拘留或者采取\n法律规定的其他措施。”罗某的行为严重危及社会治安秩序和公共安全，可以强\n行带离现场。\nD 项错误，《人民警察法》第十四条规定：“公安机关的人民警察对严重危害公\n共安全或者他人人身安全的精神病人，可以采取保护性约束措施。需要送往指定\n的单位、场所加以监护的，应当报请县级以上人民政府公安机关批准，并及时通\n知其监护人。”罗某并非精神病人，不可以对其采取保护性约束措施。"},{"id":209,"type":"判断题","question":"因涉嫌盗窃罪，甲被民警带回派出所。其后，多名民警对其进行讯问，甲交代了\n伙同乙实施盗窃的犯罪事实。民警据此做了讯问笔录，拘留甲后向检察院递交了\n提请逮捕书。如果检察院对甲不批准逮捕，对于检察机关的不批准逮捕决定，公\n安机关不得要求复议。","choices":[],"answer":"错误","explanation":"《公安机关办理刑事案件程序规定》第一百四十一条规定：“对人民检察\n院不批准逮捕的决定，认为有错误需要复议的，应当在收到不批准逮捕决定书后\n五日以内制作要求复议意见书，报经县级以上公安机关负责人批准后，送交同级\n人民检察院复议。如果意见不被接受，认为需要复核的，应当在收到人民检察院\n的复议决定书后五日以内制作提请复核意见书，报经县级以上公安机关负责人批\n准后，连同人民检察院的复议决定书，一并提请上一级人民检察院复核。”所以，\n对检察机关的不批准逮捕的决定，公安机关可以申请复议。"},{"id":210,"type":"单选题","question":"某日，甲、乙发生纠纷，甲用铁管将乙打伤，乙到派出所报案，要求严惩甲。派\n出所传唤甲，甲无正当理由拒不接受调查，乙的伤情鉴定短时间内无法作出。\n下列对该案件说法正确的是（ ）。","choices":[{"key":"A","text":"可先按照行政案件程序办理"},{"key":"B","text":"对甲打人使用的铁管予以追缴"},{"key":"C","text":"经县公安局领导批准后对甲强制传唤"},{"key":"D","text":"如乙鉴定为轻伤，应撤销行政案件后再立案侦查"}],"answer":"A","explanation":"A 项正确，《公安机关办理行政案件程序规定》第六十五条规定：“对发\n现或者受理的案件暂时无法确定为刑事案件或者行政案件的，可以按照行政案件\n的程序办理。”题干中，由于乙的伤情鉴定结果短时间内无法作出，无法确定该\n案以行政案件办理或以刑事案件办理，故该案可以按照行政案件的程序办理。\nB 项错误，\n《公安机关办理行政案件程序规定》第一百七十二条规定：\n“······\n（二）\n有违法所得和非法财物、违禁品、管制器具的，应当予以追缴或者收缴；······”\n铁管属于作案工具，并非违法所得，不应予以追缴处理。\nC 项错误，《公安机关办理行政案件程序规定》第六十七条第三款规定：“对无\n正当理由不接受传唤或者逃避传唤的违反治安管理、出境入境管理的嫌疑人以及\n法律规定可以强制传唤的其他违法嫌疑人，经公安派出所、县级以上公安机关办\n案部门或者出入境边防检查机关负责人批准，可以强制传唤。······”题\n干中，派出所传唤甲到案，对甲的强制传唤应经派出所负责人批准，而非县公安\n局领导批准。\nD 项错误，\n《公安机关办理行政案件程序规定》第一百七十二条规定：\n“······\n（五）\n违法行为涉嫌构成犯罪的，转为刑事案件办理或者移送有权处理的主管机关、部\n门办理，无需撤销行政案件。公安机关已经作出行政处理决定的，应当附\n卷；······”如乙的伤情经鉴定为轻伤，该案构成犯罪案件，行政案件无\n需撤销，转为刑事案件办理。"},{"id":211,"type":"多选题","question":"黄某因寻衅滋事罪被判有期徒刑，服刑两年八个月后出狱。出狱一年后，黄某想\n到曾借给李某十万元，在自己入狱前已到还款期限，但一直未向李某讨要。黄某\n找到李某，李某拒绝还钱，黄某到派出所求助。民警小孙就该案向黄某介绍了民\n法典中对于诉讼时效的规定。下列说法正确的有（ ）。","choices":[{"key":"A","text":"该案诉讼时效为二年"},{"key":"B","text":"该案诉讼时效已届满"},{"key":"C","text":"该案因黄某服刑导致诉讼时效中断"},{"key":"D","text":"法院不得主动适用诉讼时效的规定"}],"answer":"BD","explanation":"A 项错误，《中华人民共和国民法典》第一百八十八条第一款规定：“向\n人民法院请求保护民事权利的诉讼时效期间为三年。法律另有规定的，依照其规\n定。”因此，该案诉讼时效为三年。\nB 项正确，C 项错误，《中华人民共和国民法典》第一百九十五条规定：“有下\n列情形之一的，诉讼时效中断，从中断、有关程序终结时起，诉讼时效期间重新\n计算：（一）权利人向义务人提出履行请求；（二）义务人同意履行义务；（三）\n权利人提起诉讼或者申请仲裁；（四）与提起诉讼或者申请仲裁具有同等效力的\n其他情形。”《中华人民共和国民法典》第一百九十四条规定：“在诉讼时效期\n间的最后六个月内，因下列障碍，不能行使请求权的，诉讼时效中止：（一）不\n可抗力；（二）无民事行为能力人或者限制民事行为能力人没有法定代理人，或\n者法定代理人死亡、丧失民事行为能力、丧失代理权；（三）继承开始后未确定\n继承人或者遗产管理人；（四）权利人被义务人或者其他人控制；（五）其他导\n致权利人不能行使请求权的障碍。自中止时效的原因消除之日起满六个月，诉讼\n时效期间届满。”本案中，黄某因服刑一直未向李某讨要借款，属于权利人被义\n务人或者其他人控制的情形，此时诉讼时效中止，而非中断。自中止时效的原因\n消除之日起满六个月，诉讼时效期间届满，黄某出狱一年后向李某讨要，此时诉\n讼时效届满。\nD 项正确，《中华人民共和国民法典》第一百九十三条规定：“人民法院不得主\n动适用诉讼时效的规定。”因此，法院不得主动适用诉讼时效的规定。"},{"id":212,"type":"判断题","question":"甲因涉嫌危害国家安全犯罪被 A 市公安机关刑事拘留，拘留时向甲出示拘留证，\n并责令甲在拘留证上签名、捺指印，在甲拘留后的第二十小时对甲开展讯问。公\n安机关的做法正确。","choices":[],"answer":"正确","explanation":"《公安机关办理刑事案件程序规定》第一百二十五条第一款规定：“拘留\n犯罪嫌疑人，应当填写呈请拘留报告书，经县级以上公安机关负责人批准，制作\n拘留证。执行拘留时，必须出示拘留证，并责令被拘留人在拘留证上签名、捺指\n印，拒绝签名、捺指印的，侦查人员应当注明。”《公安机关办理刑事案件程序\n规定》第一百二十八条规定：“对被拘留的人，应当在拘留后二十四小时以内进\n行讯问。发现不应当拘留的，应当经县级以上公安机关负责人批准，制作释放通\n知书，看守所凭释放通知书发给被拘留人释放证明书，将其立即释放。”公安机\n关的做法符合规定。"},{"id":213,"type":"单选题","question":"某日下午 15：00，甲县公安局城西派出所将一位迷路老人接回派出所安置，并\n通知其家人接回。老人儿子称有事在身要求派出所将老人送回家。派出所提出因\n警情较多，无法马上安排人手护送，17：00 可以护送老人回家。老人的儿子不\n能接受，当即向 110 报警台投诉，称派出所不作为。甲县公安局督察大队对此投\n诉恰当的处置措施是（ ）。","choices":[{"key":"A","text":"告知老人的儿子派出所无违规情形"},{"key":"B","text":"要求老人的儿子立刻接老人回家"},{"key":"C","text":"责令派出所克服困难马上送老人回家"},{"key":"D","text":"通知派出所自行与老人儿子协商解决问题"}],"answer":"A","explanation":"《公安机关督察条例》第九条规定：“督察机构对群众投诉的正在发生的\n公安机关及其人民警察违法违纪行为，应当及时出警，按照规定给予现场处置，\n并将处理结果及时反馈投诉人。”\nA 项正确，派出所因人手问题无法及时送老人回家，并非不作为，不涉及违法违\n纪情形，督察大队作为投诉受理机构应及时向投诉人反馈。\nB 项错误，督察大队受理投诉，应及时调和老人的儿子与派出所的意见分歧，要\n求老人的儿子来派出所接处置欠妥。\nC 项错误，派出所无不作为情形，责令派出所克服困难马上送老人回家可能不具\n备实际可操作性。\nD 项错误，通知派出所自行与老人儿子协商解决问题是督察大队不作为的体现，\n无助于解决双方的争执。"},{"id":214,"type":"多选题","question":"某日，关某将平板电脑落在广场的座椅上被人捡走。关某通过调阅监控，发现平\n板电脑被杜某带回家中，遂向杜某讨要。杜某否认捡到电脑，关某到派出所报警，\n要求民警到杜某家进行检查，帮其找回电脑。对此，民警可以开展的工作有（ ）。","choices":[{"key":"A","text":"找杜某了解情况"},{"key":"B","text":"经出示人民警察证进入杜某家中进行检查"},{"key":"C","text":"经出示检查证进入杜某家中进行检查"},{"key":"D","text":"建议关某通过诉讼途径解决"}],"answer":"AD","explanation":"A、D 项正确，《中华人民共和国刑法》第二百七十条第二、三款规定：\n“将他人的遗忘物或者埋藏物非法占为己有，数额较大，拒不交出的，依照前款\n的规定处罚。本条罪，告诉的才处理。”《公安机关办理刑事案件程序规定》第\n一百七十六条规定：“经过审查，对告诉才处理的案件，公安机关应当告知当事\n人向人民法院起诉。对被害人有证据证明的轻微刑事案件，公安机关应当告知被\n害人可以向人民法院起诉；被害人要求公安机关处理的，公安机关应当依法受\n理。······”关某将平板电脑落在广场的座椅上，通过调阅监控，发现平\n板电脑被杜某带回家中，但是杜某否认捡到电脑，不予归还，关某要求公安机关\n处理，公安机关应当依法受理，找杜某了解情况；同时侵占罪属于自诉案件，关\n某可通过诉讼途径要求杜某返还其取得的利益并依法赔偿损失。\nB、C 项错误，《公安机关办理行政案件程序规定》第八十二条第一款规定：“对\n与违法行为有关的场所、物品、人身可以进行检查。检查时，人民警察不得少于\n二人，并应当出示人民警察证和县级以上公安机关开具的检查证。对确有必要立\n即进行检查的，人民警察经出示人民警察证，可以当场检查；但检查公民住所的，\n必须有证据表明或者有群众报警公民住所内正在发生危害公共安全或者公民人\n身安全的案（事）件，或者违法存放危险物质，不立即检查可能会对公共安全或\n者公民人身、财产安全造成重大危害。”杜某不涉及治安违法，民警不能前往杜\n某家中检查。"},{"id":215,"type":"判断题","question":"甲市公安机关决定对犯罪嫌疑人张某采取取保候审的刑事强制措施，张某的堂叔\n（每月收入 2 万，被剥夺政治权利）可以作为张某的保证人。","choices":[],"answer":"错误","explanation":"《刑事诉讼法》第六十九条规定：“保证人必须符合下列条件：（一）与\n本案无牵连；（二）有能力履行保证义务；（三）享有政治权利，人身自由未受\n到限制；（四）有固定的住处和收入。”张某的堂叔虽然收入高，但不享有政治\n权利，不符合保证人的资格。"},{"id":216,"type":"单选题","question":"张三开车在高速公路上正常行驶，突然李四从路边冲出，张三躲闪不及将李四撞\n死。交管部门出警后根据现场情况对事故责任作出认定：李四（经抢救无效死亡）\n个人负全责，经过进一步调查得知，李四因为受到黑社会追杀，不得以逃到高速\n公路上导致被撞身亡，遂将案卷和证据材料移交刑侦部门立案侦查，案件转为刑\n事案件，移交的证据材料中可以直接作为刑事证据使用的有（ ）。","choices":[{"key":"A","text":"张三车内的行车记录仪记录的视频"},{"key":"B","text":"李四妻子证实李四经常被黑社会人员骚扰的证言"},{"key":"C","text":"张三本人的证言"},{"key":"D","text":"李四 8 岁儿子看到父亲被黑社会人员殴打的证言"}],"answer":"A","explanation":"《公安机关办理刑事案件程序规定》第六十三条规定：“公安机关接受或\n者依法调取的行政机关在行政执法和查办案件过程中收集的物证、书证、视听资\n料、电子数据、鉴定意见、勘验笔录、检查笔录等证据材料，经公安机关审查符\n合法定要求的，可以作为证据使用。”\nA 项正确，张三车内的行车记录仪记录的视频属于视听资料，符合上述规定，故\n可以直接作为刑事证据使用。\nB、D 两项错误，李四妻子和李四孩子的证言属于证人证言，在以上规定中并未\n提到，故不可以直接作为刑事证据使用。\nC 项错误，张三的证言属于当事人的陈述，在以上规定中并未提到，故不可以直\n接作为刑事证据使用。"},{"id":217,"type":"多选题","question":"我国《人民警察法》规定，监督管理计算机信息系统的安全保护工作是公安机关\n人民警察的职责之一。根据国家有关规定，属于履行人民警察法定职责的有（ ）。","choices":[{"key":"A","text":"开展互联网信息巡查，及时发现并处置损害社会稳定的有害信息"},{"key":"B","text":"监督、检查互联网安全管理制度和安全保护技术措施落实情况"},{"key":"C","text":"监督、检查、指导重要信息系统的信息安全等级保护工作"},{"key":"D","text":"制定和发布互联网服务管理相关规定"}],"answer":"ABC","explanation":"A、C 项正确，《计算机信息系统安全保护条例》第十七条规定：“公安\n机关对计算机信息系统安全保护工作行使下列监督职权：（一）监督、检查、指\n导计算机信息系统安全保护工作；（二）查处危害计算机信息系统安全的违法犯\n罪案件；（三）履行计算机信息系统安全保护工作的其他监督职责。”开展互联\n网信息巡查，及时发现并处置损害社会稳定的有害信息，监督、检查、指导重要\n信息系统的信息安全等级保护工作均属于公安机关人民警察的法定职责。\nB 项正确，《公安机关互联网安全监督检查规定》第十条规定：“公安机关应当\n根据互联网服务提供者和联网使用单位履行法定网络安全义务的实际情况，依照\n国家有关规定和标准，对下列内容进行监督检查：（一）是否办理联网单位备案\n手续，并报送接入单位和用户基本信息及其变更情况；（二）是否制定并落实网\n络安全管理制度和操作规程，确定网络安全负责人；（三）是否依法采取记录并\n留存用户注册信息和上网日志信息的技术措施；（四）是否采取防范计算机病毒\n和网络攻击、网络侵入等技术措施；（五）是否在公共信息服务中对法律、行政\n法规禁止发布或者传输的信息依法采取相关防范措施；（六）是否按照法律规定\n的要求为公安机关依法维护国家安全、防范调查恐怖活动、侦查犯罪提供技术支\n持和协助；（七）是否履行法律、行政法规规定的网络安全等级保护等义务。”\n因此，监督、检查互联网安全管理制度和安全保护技术措施落实情况属于公安机\n关机关人民警察的法定职责。\nD 项错误，制定和发布互联网服务管理相关规定是立法机关的职责，而非人民警\n察的法定职责。"},{"id":218,"type":"判断题","question":"监视居住作为强制措施的一种，有其固定的程序。在犯罪嫌疑人固定住所对其监\n视居住，应当在二十四小时以内通知被监视居住人的家属。","choices":[],"answer":"错误","explanation":"《公安机关办理刑事案件程序》第一百一十三条第一款规定：“指定居所\n监视居住的，除无法通知的以外，应当制作监视居住通知书，在执行监视居住后\n二十四小时以内，由决定机关通知被监视居住人的家属。”只有在指定居所监视\n居住的，才应当通知其家属，在犯罪嫌疑人自己的固定住所监视居住的，无需再\n通知其家属。"},{"id":219,"type":"单选题","question":"一辆轿车停在高速公路应急车道上，对交通安全造成很大影响，正在高速公路上\n巡逻的交警见状下车向驾驶员询问，得知汽车没油情况后，交警立即在车后方\n150 米处设好警示牌，同时打开车辆双闪指示灯，提醒过往车辆注意安全，随后\n帮助驾驶员加油，驶离高速公路。交警的做法最能说明的是（ ）。","choices":[{"key":"A","text":"人民警察遇到群众的实际困难应予以必要协助"},{"key":"B","text":"人民警察是群众利益的忠实维护者"},{"key":"C","text":"群众在遇到困难时应及时向人民警察求助"},{"key":"D","text":"群众的困难都可以由人民警察来解决"}],"answer":"A","explanation":"《人民警察法》第二十一条规定：“人民警察遇到公民人身、财产安全受\n到侵犯或者处于其他危难情形，应当立即救助；对公民提出解决纠纷的要求，应\n当给予帮助；对公民的报警案件，应当及时查处；人民警察应当积极参加抢险救\n灾和社会公益工作”。\nA 项正确，群众处于危难情况，人民警察予以必要协助，符合“人民警察遇到公\n民人身、财产安全受到侵犯或者处于其他危难情形，应当立即救助”的法律规定。\nB 项错误，“人民警察是群众利益的忠实维护者”本句话虽然是正确的，但是结\n合题干主要表明的是交警在遇到需要帮助的群众时，主动给予帮助，并非强调要\n维护群众的利益。\nC 项错误，本题中主要体现的是交警向人民群众主动提供协助，而非群众向人民\n警察求助。\nD 项错误，群众处于危难情况，人民警察应当立即救助，但并非所有困难都能由\n人民警察解决，选项表述错误。"},{"id":220,"type":"多选题","question":"某日，派出所民警老林和小周在巡逻时发现男子形迹可疑，遂上前进行盘查。盘\n查过程中，该男子表现出不耐烦情绪，嘴里一直念叨不停。经核实，该男子有盗\n窃前科，未发现有其他违法行为。民警在盘查过程中，下列符合规范的用语有（ ）。","choices":[{"key":"A","text":"“对有前科的人员我们都会重点检查，请跟我们回派出所一趟。”"},{"key":"B","text":"“我们是 xx 派出所民警，现依法对你进行检查，请配合一下。”"},{"key":"C","text":"“抱歉，耽误你的时间，感谢配合我们完成检查！”"},{"key":"D","text":"“哪来这么多废话，配合检查是你的义务！”"}],"answer":"BC","explanation":"A 项错误，《公安机关适用继续盘问规定》第八条规定：“对有违法犯罪\n嫌疑的人员当场盘问、检查后，不能排除其违法犯罪嫌疑，且具有下列情形之一\n的，人民警察可以将其带至公安机关继续盘问：（一）被害人、证人控告或者指\n认其有犯罪行为的；（二）有正在实施违反治安管理或者犯罪行为嫌疑的；（三）\n有违反治安管理或者犯罪嫌疑且身份不明的；（四）携带的物品可能是违反治安\n管理或者犯罪的赃物的。”因此，虽然该男子有前科，但是无法定情形不适用继\n续盘问。\nB、C 项正确，根据公安执法相关规定，民警执行盘查任务时，应当着制式服装；\n未着制式服装的，应当出示人民警察证；应当向被盘查人敬礼并告知：“我是×\n××（单位）民警，现依法对你进行检查，请你配合。”经盘查排除违法犯罪嫌\n疑的，民警应当向被盘查人敬礼，并说“谢谢你的合作”，礼貌让其离去。\nD 项错误，根据公安执法相关规定，民警执行盘查任务时，应当始终坚持理性、\n平和、文明、规范，因情施策，确保安全。该项用语粗鲁，不符合规范要求。"},{"id":221,"type":"判断题","question":"对现场发现的违反治安管理行为人，民警经出示工作证件，可以口头传唤，但应\n当在询问笔录中注明。","choices":[],"answer":"正确","explanation":"《公安机关办理行政案件程序规定》第六十七条第一款：“需要传唤违法\n嫌疑人接受调查的，经公安派出所、县级以上公安机关办案部门或者出入境边防\n检查机关负责人批准，使用传唤证传唤。对现场发现的违法嫌疑人，人民警察经\n出示人民警察证，可以口头传唤，并在询问笔录中注明违法嫌疑人到案经过、到\n案时间和离开时间。”"},{"id":222,"type":"单选题","question":"公安派出所民警接到举报称，王某家中存有爆炸物品，遂到王某家中检查。下列\n说法正确的是( )。","choices":[{"key":"A","text":"因情况紧急，民警来不及办理检查证件，可以出示工作证件后进入王某家进行\n检查"},{"key":"B","text":"检查王某的人身应经公安派出所负责人审批"},{"key":"C","text":"强制传唤王某必须由县级以上公安机关负责人审批"},{"key":"D","text":"检查王某的住处可由公安派出所负责人审批"}],"answer":"A","explanation":"《公安机关办理行政案件程序规定》第八十二条：“对与违法行为有关的\n场所、物品、人身可以进行检查。检查时，人民警察不得少于二人，并应当出示\n人民警察证和县级以上公安机关开具的检查证。对确有必要立即进行检查的，人\n民警察经出示人民警察证，可以当场检查；但检查公民住所的，必须有证据表明\n或者有群众报警公民住所内正在发生危害公共安全或者公民人身安全的案（事）\n件，或者违法存放危险物质，不立即检查可能会对公共安全或者公民人身、财产\n安全造成重大危害。\n对机关、团体、企业、事业单位或者公共场所进行日常执法监督检查，依照有关\n法律、法规和规章执行，不适用前款规定。”\n《公安机关办理行政案件程序规定》第六十七条第三款：“对无正当理由不接受\n传唤或者逃避传唤的违反治安管理、出境入境管理的嫌疑人以及法律规定可以强\n制传唤的其他违法嫌疑人，经公安派出所、县级以上公安机关办案部门或者出入\n境边防检查机关负责人批准，可以强制传唤。强制传唤时，可以依法使用手铐、\n警绳等约束性警械。”"},{"id":223,"type":"多选题","question":"下列犯罪嫌疑人、被告人中可以适用取保候审的有( )。","choices":[{"key":"A","text":"有证据证明甲犯故意杀人罪，有可能被判十年以上有期徒刑"},{"key":"B","text":"乙在逮捕后侦查羁押期限满仍需继续查证"},{"key":"C","text":"丙涉嫌侮辱罪被起诉"},{"key":"D","text":"丁被逮捕后发现其怀孕 3 个月"}],"answer":"BCD","explanation":"《公安机关办理刑事案件程序规定》第八十一条 公安机关对具有下列情\n形之一的犯罪嫌疑人，可以取保候审：\n（一）可能判处管制、拘役或者独立适用附加刑的；\n（二）可能判处有期徒刑以上刑罚，采取取保候审不致发生社会危险性的；\n（三）患有严重疾病、生活不能自理，怀孕或者正在哺乳自己婴儿的妇女，采取\n取保候审不致发生社会危险性的；\n（四）羁押期限届满，案件尚未办结，需要继续侦查的。\n对拘留的犯罪嫌疑人，证据不符合逮捕条件，以及提请逮捕后，人民检察院不批\n准逮捕，需要继续侦查，并且符合取保候审条件的，可以依法取保候审。"}];

function freshStore(){return {version:DATA_VERSION,migrationHandled:true,createdAt:isoNow(),answers:{},wrong:{},favorites:{},reviewMarks:{},notes:{},corrections:{},correctedAnswers:{},history:[],examHistory:[],stats:{totalAttempts:0,totalCorrect:0,byType:{},byDate:{}},settings:{}}}
function isoNow(){return new Date().toISOString()}
function safeParse(text,fallback){try{return JSON.parse(text)}catch(e){return fallback}}
function isObj(v){return v&&typeof v==='object'&&!Array.isArray(v)}
function coerceStore(raw){
 var base=freshStore(), x=isObj(raw)?raw:{};
 ['answers','wrong','favorites','reviewMarks','notes','corrections','correctedAnswers','settings'].forEach(function(k){base[k]=isObj(x[k])?x[k]:base[k]});
 base.history=Array.isArray(x.history)?x.history:[]; base.examHistory=Array.isArray(x.examHistory)?x.examHistory:[];
 base.stats=isObj(x.stats)?x.stats:base.stats; base.stats.totalAttempts=Number(base.stats.totalAttempts)||0; base.stats.totalCorrect=Number(base.stats.totalCorrect)||0;
 base.stats.byType=isObj(base.stats.byType)?base.stats.byType:{}; base.stats.byDate=isObj(base.stats.byDate)?base.stats.byDate:{};
 base.version=DATA_VERSION;base.migrationHandled=true;base.createdAt=x.createdAt||base.createdAt;base.migratedAt=x.migratedAt||null;return base;
}
function migrateV2(old){
 var s=freshStore();s.migratedAt=isoNow();
 if(!isObj(old))return s;
 var done=isObj(old.done)?old.done:{};Object.keys(done).forEach(function(id){var qid=toQid(id),ok=done[id]==='correct';s.answers[qid]={attempts:1,lastCorrect:ok,lastAnswer:null,lastAt:s.migratedAt};});
 var wrong=isObj(old.wrong)?old.wrong:{};Object.keys(wrong).forEach(function(id){var qid=toQid(id);s.wrong[qid]={wrongCount:1,firstWrongAt:s.migratedAt,lastWrongAt:s.migratedAt,lastCorrect:false,correctStreak:0,mastered:false};});
 var star=isObj(old.star)?old.star:{};Object.keys(star).forEach(function(id){if(star[id])s.favorites[toQid(id)]='normal'});
 if(isObj(old.stats)){s.stats.totalAttempts=Number(old.stats.answered)||0;s.stats.totalCorrect=Number(old.stats.correct)||0}
 return s;
}
function loadStore(){var raw=localStorage.getItem(STORAGE_KEY);if(raw)return coerceStore(safeParse(raw,{}));var old=localStorage.getItem(OLD_KEY),s=old?migrateV2(safeParse(old,{})):freshStore();localStorage.setItem(STORAGE_KEY,JSON.stringify(s));return s}
let store=loadStore();
function emptyCorrectionsPack(){return {schema:CORRECTIONS_SCHEMA,schemaVersion:2,bankId:'2026-police-basic-v3-223',version:null,generatedAt:null,sourceNote:'',batches:[],records:{}}}
function normalizeCorrectionsPack(raw){var p=emptyCorrectionsPack();if(!isObj(raw)||raw.schema!==CORRECTIONS_SCHEMA||!Array.isArray(raw.records))return p;p.version=raw.version||null;p.generatedAt=raw.generatedAt||null;p.sourceNote=String(raw.sourceNote||'');p.batches=Array.isArray(raw.batches)?raw.batches:raw.batch?[raw.batch]:[];raw.records.forEach(function(r){if(isObj(r)&&/^Q\d{3,}$/.test(r.qid))p.records[r.qid]=r});return p}
function loadCorrectionsPack(){var raw=localStorage.getItem(CORRECTIONS_KEY);return raw?normalizeCorrectionsPack(safeParse(raw,{})):emptyCorrectionsPack()}

function toQid(id){var n=parseInt(String(id).replace(/\D/g,''),10)||0;return 'Q'+String(n).padStart(3,'0')}
function qidNumber(qid){return parseInt(String(qid||'').replace(/\D/g,''),10)||0}
function normalizeAnswer(raw,type){
 if(type==='判断题'){
   if(raw===true||raw===false)return raw;
   var j=Array.isArray(raw)?raw.join(''):String(raw==null?'':raw);j=j.replace(/^\s*(正确答案|参考答案|标准答案|答案)\s*[:：]?\s*/i,'').replace(/\s+/g,'').toUpperCase();
   if(j==='错误'||j==='错'||j==='×'||j==='FALSE'||j==='F'||j==='0'||j.indexOf('错误')>=0||j.indexOf('不正确')>=0)return false;
   if(j==='正确'||j==='对'||j==='√'||j==='TRUE'||j==='T'||j==='1'||j.indexOf('正确')>=0)return true;
   return null;
 }
 var s=Array.isArray(raw)?raw.join(''):String(raw==null?'':raw);s=s.replace(/^\s*(正确答案|参考答案|标准答案|答案)\s*[:：]?\s*/i,'').toUpperCase();
 var letters=s.match(/[A-D]/g)||[],unique=[];letters.forEach(function(x){if(unique.indexOf(x)<0)unique.push(x)});unique.sort();
 return type==='单选题'?(unique[0]||''):unique;
}
function canonicalForStore(v,type){return normalizeAnswer(v,type)}
function answerEqual(a,b,type){var x=normalizeAnswer(a,type),y=normalizeAnswer(b,type);if(type==='多选题')return x.length===y.length&&x.every(function(v,i){return v===y[i]});return x===y}
function answerDisplay(v,type){var n=normalizeAnswer(v,type);if(type==='判断题')return n===true?'正确':n===false?'错误':'未设置';if(Array.isArray(n))return n.join('')||'未设置';return n||'未设置'}
function selectedToCanonical(selected,type){if(type==='判断题')return selected.length?selected[0]==='true':null;if(type==='单选题')return selected[0]||'';return selected.slice().sort()}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function attr(s){return esc(s)}
function normalizeQuestionRecord(r){
 if(!isObj(r))throw new Error('题目记录不是对象');
 var qid=String(r.qid||'').toUpperCase(),type=String(r.type||''),question=String(r.question||'').trim();
 if(!/^Q\d{3,}$/.test(qid)||toQid(qid)!==qid)throw new Error('题号必须使用 Q224 形式');
 if(TYPE_ORDER.indexOf(type)<0)throw new Error(qid+' 题型必须是判断题、单选题或多选题');
 if(!question)throw new Error(qid+' 题干为空');
 var choices=[];
 if(type==='判断题'){
   if(Array.isArray(r.choices)&&r.choices.length)throw new Error(qid+' 判断题不能包含选项');
 }else{
   if(!Array.isArray(r.choices)||r.choices.length!==4)throw new Error(qid+' 选择题必须包含 A、B、C、D 四个选项');
   r.choices.forEach(function(c,i){var key=String(c&&c.key||'').toUpperCase(),text=String(c&&c.text||'').trim();if(key!=='ABCD'.charAt(i))throw new Error(qid+' 选项必须按 A、B、C、D 排列');if(!text)throw new Error(qid+' '+key+'选项内容为空');choices.push({key:key,text:text})});
 }
 var official=normalizeAnswer(r.officialAnswer,type),keys=choices.map(function(c){return c.key});
 if(type==='判断题'&&typeof official!=='boolean')throw new Error(qid+' 判断答案必须是 true 或 false');
 if(type==='单选题'&&(typeof official!=='string'||keys.indexOf(official)<0))throw new Error(qid+' 单选答案无效');
 if(type==='多选题'&&(!Array.isArray(official)||!official.length||official.some(function(k){return keys.indexOf(k)<0})))throw new Error(qid+' 多选答案无效');
 var tags=Array.isArray(r.tags)?r.tags.map(function(x){return String(x||'').trim()}).filter(Boolean):[],uniqueTags=[];tags.forEach(function(t){if(uniqueTags.indexOf(t)<0)uniqueTags.push(t)});
 return {qid:qid,type:type,question:question,choices:choices,officialAnswer:official,explanation:String(r.explanation||''),tags:uniqueTags,issues:Array.isArray(r.issues)?r.issues.map(String):[]};
}
function emptyQuestionBank(){return {schema:QUESTION_PACK_SCHEMA,schemaVersion:1,bankId:'2026-police-basic-v6-extensions',version:null,generatedAt:null,sourceNote:'',batches:[],records:{}}}
function normalizeQuestionBank(raw){
 var p=emptyQuestionBank();if(!isObj(raw)||raw.schema!==QUESTION_PACK_SCHEMA||!Array.isArray(raw.records))return p;
 p.version=raw.version||null;p.generatedAt=raw.generatedAt||null;p.sourceNote=String(raw.sourceNote||'');p.batches=Array.isArray(raw.batches)?raw.batches:raw.batch?[raw.batch]:[];
 var map={};raw.records.forEach(function(r){try{var x=normalizeQuestionRecord(r);if(qidNumber(x.qid)>BASE_QUESTION_COUNT)map[x.qid]=x}catch(e){}});
 var expected=BASE_QUESTION_COUNT+1;Object.keys(map).sort(function(a,b){return qidNumber(a)-qidNumber(b)}).forEach(function(k){if(qidNumber(k)===expected){p.records[k]=map[k];expected++}});return p;
}
function loadQuestionBank(){var raw=localStorage.getItem(QUESTION_BANK_KEY);return raw?normalizeQuestionBank(safeParse(raw,{})):emptyQuestionBank()}
function serializableQuestionBank(p){return {schema:QUESTION_PACK_SCHEMA,schemaVersion:1,bankId:p.bankId||'2026-police-basic-v6-extensions',version:p.version,generatedAt:p.generatedAt,sourceNote:p.sourceNote,batches:p.batches||[],records:Object.keys(p.records||{}).sort(function(a,b){return qidNumber(a)-qidNumber(b)}).map(function(k){return p.records[k]})}}

 QUESTIONS.length=0;BASE_QUESTIONS.forEach(function(q){QUESTIONS.push(q)});
 Object.keys(questionBank.records).sort(function(a,b){return qidNumber(a)-qidNumber(b)}).forEach(function(k){var r=questionBank.records[k];QUESTIONS.push({id:qidNumber(k),qid:k,type:r.type,question:r.question,choices:r.choices.map(function(c){return {key:c.key,text:c.text}}),answer:r.officialAnswer,explanation:r.explanation,_importedTags:r.tags.slice(),imported:true})});
}

 var corrected=answerSource(q)!=='official',correctionLabel=answerSource(q)==='manual'?'本题答案已人工修正':'答案由 corrections 数据表修正',res='';if(submitted){res='<div class="result '+(ok?'ok':'bad')+'"><div><b>'+(ok?'✓ 回答正确':'✕ 回答错误')+'</b></div><div class="answerline"><span>你的答案：</span><b>'+esc(answerDisplay(selectedToCanonical(selected,q.type),q.type))+'</b></div><div class="answerline"><span>正确答案：</span><b>'+esc(answerDisplay(effectiveAnswer(q),q.type))+'</b></div><div class="answerline"><span>判定：</span><b>'+(ok?'正确':'错误')+'</b></div>'+(corrected?'<div class="answerline"><span>题库原答案：</span><span>'+esc(answerDisplay(q.officialAnswer,q.type))+'</span></div><div class="answerline"><span>当前采用答案：</span><b>'+esc(answerDisplay(effectiveAnswer(q),q.type))+'</b></div>':'')+'<div class="explainbox"><b>【题库原解析】</b><div class="explain">'+esc(q.explanation||'暂无解析')+'</div></div>'+renderEnhancedExplanation(q)+'<div class="notebox"><b>【我的笔记】</b><textarea class="textarea" placeholder="本题独立保存，输入后自动保存" oninput="saveNote(\''+q.qid+'\',this.value)">'+esc(store.notes[q.qid]||'')+'</textarea><div class="muted">自动保存到本机</div></div></div>'}

function pickPractice(k){var q=currentPracticeQ(),p=state.practice;if(!q||p.submitted[q.qid])return;var a=practiceSelected(q).slice();if(q.type==='多选题'){var i=a.indexOf(k);if(i>=0)a.splice(i,1);else a.push(k);a.sort()}else a=[k];p.drafts[q.qid]=a;renderPractice()}

function recordAttempt(q,answer,ok,mode){
 var now=isoNow(),a=store.answers[q.qid]||{attempts:0};a.attempts=(Number(a.attempts)||0)+1;a.lastCorrect=!!ok;a.lastAnswer=canonicalForStore(answer,q.type);a.lastAt=now;store.answers[q.qid]=a;
 store.stats.totalAttempts++;if(ok)store.stats.totalCorrect++;var bt=store.stats.byType[q.type]||{attempts:0,correct:0};bt.attempts++;if(ok)bt.correct++;store.stats.byType[q.type]=bt;
 var dk=dateKey(now),bd=store.stats.byDate[dk]||{attempts:0,correct:0};bd.attempts++;if(ok)bd.correct++;store.stats.byDate[dk]=bd;
 store.history.push({qid:q.qid,type:q.type,answer:a.lastAnswer,correct:!!ok,mode:mode,at:now});if(store.history.length>20000)store.history=store.history.slice(-20000);
 var w=store.wrong[q.qid];if(!ok){if(!w)w={wrongCount:0,firstWrongAt:now,lastWrongAt:now,lastCorrect:false,correctStreak:0,mastered:false};w.wrongCount=(Number(w.wrongCount)||0)+1;w.firstWrongAt=w.firstWrongAt||now;w.lastWrongAt=now;w.lastCorrect=false;w.correctStreak=0;w.mastered=false;store.wrong[q.qid]=w}else if(w){w.lastCorrect=true;w.correctStreak=(Number(w.correctStreak)||0)+1;if(w.correctStreak>=3)w.mastered=true}
 save()
}

function prevPractice(){if(state.practice.index>0){state.practice.index--;renderPractice()}}
