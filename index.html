function jumpToQuestion(value){
 var raw=String(value==null?'':value).trim().toUpperCase();
 var n=parseInt(raw.replace(/\D/g,''),10);
 if(!n){alert('请输入有效题号，例如 325 或 Q325。');return}
 var qid=toQid(n),p=state.practice;
 if(p){
   var idx=p.list.findIndex(function(q){return q.qid===qid||q.id===n});
   if(idx>=0){p.index=idx;renderPractice();return}
 }
 var globalIdx=QUESTIONS.findIndex(function(q){return q.qid===qid||q.id===n});
 if(globalIdx<0){alert('题库中未找到 '+qid+'。当前题库范围：Q001—'+toQid(QUESTIONS.length)+'。');return}
 if(p&&p.mode!=='order'){
   if(!confirm(qid+' 不在当前刷题分组中。是否切换到顺序刷题并跳转到该题？'))return;
 }
 startPractice('order',QUESTIONS.slice(),qid)
}
function gotoPractice(i){state.practice.index=i;renderPractice()}
function leavePractice(){if(confirm('确定退出当前练习吗？本轮已提交的记录已保存。'))showHome()}
function saveNote(qid,text){store.notes[qid]=text;save()}
function setFavorite(qid,val){if(val)store.favorites[qid]=val;else delete store.favorites[qid];save();if(state.practice)renderPractice();else showFavorites()}
function toggleQuickFavorite(){var q=currentPracticeQ();if(!q)return;if(store.favorites[q.qid])delete store.favorites[q.qid];else store.favorites[q.qid]='normal';save();renderPractice()}
function toggleReview(qid){if(store.reviewMarks[qid])delete store.reviewMarks[qid];else store.reviewMarks[qid]=true;save();if(state.practice)renderPractice()}

function wrongQuestions(filter){var now=Date.now(),arr=QUESTIONS.filter(function(q){var w=store.wrong[q.qid];if(!w)return false;if(filter==='recent')return now-new Date(w.lastWrongAt).getTime()<=7*86400000;if(filter==='2')return w.wrongCount>=2;if(filter==='3')return w.wrongCount>=3;if(filter==='mastered')return !!w.mastered;if(filter==='high')return w.wrongCount>=3;return true});arr.sort(function(a,b){var wa=store.wrong[a.qid],wb=store.wrong[b.qid];return filter==='recent'?new Date(wb.lastWrongAt)-new Date(wa.lastWrongAt):wb.wrongCount-wa.wrongCount});return filter==='high'?arr.slice(0,20):arr}
function showWrong(){var opts=[['all','全部错题'],['recent','最近错题（7天）'],['2','错2次以上'],['3','错3次以上'],['high','高频错题'],['mastered','已掌握错题']];var list=wrongQuestions(state.wrongFilter);var html='<div class="card pagehead"><h2>错题系统</h2><div class="muted">错题不会因再次答对而删除；连续答对 3 次自动标记“基本掌握”。</div></div><div class="card toolbar"><select class="select" onchange="state.wrongFilter=this.value;showWrong()">'+opts.map(function(o){return '<option value="'+o[0]+'" '+(state.wrongFilter===o[0]?'selected':'')+'>'+o[1]+'</option>'}).join('')+'</select><button class="btn primary" onclick="startPractice(\'wrong\')" '+(!list.length?'disabled':'')+'>开始重练（'+list.length+'）</button></div><div class="list">'+(list.length?list.map(function(q){var w=store.wrong[q.qid];return '<article class="card listitem"><h3>'+q.qid+' · '+q.type+' '+(w.mastered?'<span class="badge ok">基本掌握</span>':'')+'</h3><p>'+esc(q.question.slice(0,150))+(q.question.length>150?'…':'')+'</p><div class="listmeta"><span>错误次数：'+w.wrongCount+'</span><span>首次：'+formatTime(w.firstWrongAt)+'</span><span>最近：'+formatTime(w.lastWrongAt)+'</span><span>最近一次：'+(w.lastCorrect?'答对':'答错')+'</span><span>连续答对：'+(w.correctStreak||0)+'</span></div><div class="actions"><button class="btn small" onclick="startPractice(\'custom\',['+qIndexArg(q)+'],\''+q.qid+'\')">练这道题</button></div></article>'}).join(''):'<div class="card empty">当前筛选条件下暂无错题。</div>')+'</div>';setMain(html,'wrong')}
function qIndexArg(q){return 'QUESTIONS['+(q.id-1)+']'}

function favoriteQuestions(filter){return QUESTIONS.filter(function(q){var f=store.favorites[q.qid];return f&&(filter==='all'||f===filter)})}
function showFavorites(){var list=favoriteQuestions(state.favoriteFilter),names={normal:'普通收藏',important:'重点题',verify:'待核验题'};var html='<div class="card pagehead"><h2>我的收藏</h2><div class="muted">收藏分为普通收藏、重点题和待核验题，可随时切换。</div></div><div class="card toolbar"><select class="select" onchange="state.favoriteFilter=this.value;showFavorites()"><option value="all">全部收藏</option><option value="normal" '+(state.favoriteFilter==='normal'?'selected':'')+'>普通收藏</option><option value="important" '+(state.favoriteFilter==='important'?'selected':'')+'>重点题</option><option value="verify" '+(state.favoriteFilter==='verify'?'selected':'')+'>待核验题</option></select><button class="btn primary" onclick="startPractice(\'favorites\')" '+(!list.length?'disabled':'')+'>开始刷题（'+list.length+'）</button></div><div class="list">'+(list.length?list.map(function(q){return '<article class="card listitem"><h3>'+q.qid+' · '+q.type+' <span class="badge warn">'+names[store.favorites[q.qid]]+'</span></h3><p>'+esc(q.question.slice(0,160))+(q.question.length>160?'…':'')+'</p><div class="actions"><button class="btn small" onclick="startPractice(\'custom\',['+qIndexArg(q)+'])">练这道题</button><select class="select" onchange="setFavorite(\''+q.qid+'\',this.value)"><option value="normal" '+(store.favorites[q.qid]==='normal'?'selected':'')+'>普通收藏</option><option value="important" '+(store.favorites[q.qid]==='important'?'selected':'')+'>重点题</option><option value="verify" '+(store.favorites[q.qid]==='verify'?'selected':'')+'>待核验题</option><option value="">取消收藏</option></select></div></article>'}).join(''):'<div class="card empty">暂无收藏题目。</div>')+'</div>';setMain(html,'favorites')}

function showCategories(){var counts={};QUESTIONS.forEach(function(q){q.tags.forEach(function(t){counts[t]=(counts[t]||0)+1})});var html='<div class="card pagehead"><h2>分类刷题</h2><div class="muted">标签由题干、选项和解析的关键词规则生成，不修改题目内容；一道题可以有多个标签。</div></div><div class="card quick"><div class="grid2">'+Object.keys(TAG_RULES).map(function(t){return '<button class="bigbtn" onclick="startCategory(\''+t+'\')">'+esc(t)+'<small>'+String(counts[t]||0)+' 道题</small></button>'}).join('')+'</div></div>';setMain(html,'category')}
function startCategory(tag){startPractice('category',QUESTIONS.filter(function(q){return q.tags.indexOf(tag)>=0}))}

function highlight(text,word){if(!word)return esc(text);var re;try{re=new RegExp('('+word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig')}catch(e){return esc(text)}return String(text).split(re).map(function(part,i){return i%2?'<mark>'+esc(part)+'</mark>':esc(part)}).join('')}
function searchQuestions(word,type){var k=String(word||'').trim().toLowerCase();return QUESTIONS.filter(function(q){if(type&&type!=='全部'&&q.type!==type)return false;if(!k)return false;var hay=[q.question,q.explanation,q.tags.join(' '),JSON.stringify(q.packCorrection||{})].concat(q.choices.map(function(c){return c.text})).join(' ').toLowerCase();return hay.indexOf(k)>=0})}
function searchContext(q,word){var k=String(word||'').trim().toLowerCase(),parts=[];q.choices.forEach(function(c){if(c.text.toLowerCase().indexOf(k)>=0)parts.push('<div><b>'+c.key+'：</b>'+highlight(c.text,word)+'</div>')});if((q.explanation||'').toLowerCase().indexOf(k)>=0){var low=q.explanation.toLowerCase(),at=low.indexOf(k),from=Math.max(0,at-55),to=Math.min(q.explanation.length,at+k.length+85),snippet=(from?'…':'')+q.explanation.slice(from,to)+(to<q.explanation.length?'…':'');parts.push('<div><b>解析命中：</b>'+highlight(snippet,word)+'</div>')}return parts.length?'<div class="muted" style="line-height:1.65">'+parts.join('')+'</div>':''}
function showSearch(){var list=searchQuestions(state.search,state.searchType);var html='<div class="card pagehead"><h2>题库搜索</h2><div class="muted">可搜索题干、选项、解析、法条名称和自动标签。</div></div><div class="card toolbar"><input id="searchInput" class="input grow" value="'+attr(state.search)+'" placeholder="例如：行政案件、治安管理处罚法" oninput="state.search=this.value;renderSearchResults()"><select class="select" onchange="state.searchType=this.value;renderSearchResults()"><option>全部</option>'+TYPE_ORDER.map(function(t){return '<option '+(state.searchType===t?'selected':'')+'>'+t+'</option>'}).join('')+'</select><button class="btn primary" onclick="startSearchPractice()" '+(!list.length?'disabled':'')+'>刷搜索结果</button></div><div id="searchResults"></div>';setMain(html,'search');renderSearchResults()}
function renderSearchResults(){var box=document.getElementById('searchResults');if(!box)return;var list=searchQuestions(state.search,state.searchType);box.innerHTML=state.search.trim()?(list.length?'<div class="muted" style="margin:0 0 10px">找到 '+list.length+' 道题</div><div class="list">'+list.map(function(q){return '<article class="card listitem searchhit"><h3>'+q.qid+' · '+q.type+'</h3><p>'+highlight(q.question,state.search)+'</p>'+searchContext(q,state.search)+'<div class="tagline">'+q.tags.map(function(t){return '<span class="topic">'+highlight(t,state.search)+'</span>'}).join('')+'</div><button class="btn small" onclick="startPractice(\'search\',['+qIndexArg(q)+'])">练这道题</button></article>'}).join('')+'</div>':'<div class="card empty">没有找到相关题目。</div>'):'<div class="card empty">输入关键词开始搜索。</div>';var btn=document.querySelector('.toolbar .btn.primary');if(btn)btn.disabled=!list.length}
function startSearchPractice(){var list=searchQuestions(state.search,state.searchType);if(list.length)startPractice('search',list)}

function showStats(){var total=QUESTIONS.length,done=Object.keys(store.answers).length,latestCorrect=Object.keys(store.answers).filter(function(k){return store.answers[k].lastCorrect}).length,latestWrong=done-latestCorrect,today=store.stats.byDate[dateKey()]||{attempts:0,correct:0};var seven=[],max=1;for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=dateKey(d),v=store.stats.byDate[k]||{attempts:0,correct:0};seven.push({k:k.slice(5),v:v});max=Math.max(max,v.attempts)}var top=Object.keys(store.wrong).map(function(k){return {q:QMAP[k],w:store.wrong[k]}}).filter(function(x){return x.q}).sort(function(a,b){return b.w.wrongCount-a.w.wrongCount}).slice(0,20);var html='<div class="card pagehead"><h2>学习统计</h2><div class="muted">统计基于本机累计学习记录。</div></div><div class="card" style="padding:18px"><div class="statsgrid"><div class="stat"><b>'+total+'</b><span>总题数</span></div><div class="stat"><b>'+done+'</b><span>已做题数</span></div><div class="stat"><b>'+(total-done)+'</b><span>未做题数</span></div><div class="stat"><b>'+store.stats.totalAttempts+'</b><span>累计刷题次数</span></div><div class="stat"><b>'+latestCorrect+'</b><span>当前答对题数</span></div><div class="stat"><b>'+latestWrong+'</b><span>当前答错题数</span></div><div class="stat"><b>'+pct(store.stats.totalCorrect,store.stats.totalAttempts)+'%</b><span>总正确率</span></div><div class="stat"><b>'+today.attempts+'</b><span>今日刷题数</span></div></div><h3>各题型正确率</h3>'+TYPE_ORDER.map(function(t){var x=store.stats.byType[t]||{attempts:0,correct:0},p=pct(x.correct,x.attempts);return '<div class="barrow"><span>'+t+'</span><div class="chartbar"><i style="width:'+p+'%"></i></div><b>'+p+'%</b></div>'}).join('')+'<h3>最近 7 天刷题量</h3>'+seven.map(function(x){return '<div class="barrow"><span>'+x.k+'</span><div class="chartbar"><i style="width:'+pct(x.v.attempts,max)+'%"></i></div><b>'+x.v.attempts+'</b></div>'}).join('')+'<p class="muted">今日正确率：'+pct(today.correct,today.attempts)+'%</p><h3>最容易错的 20 道题</h3>'+(top.length?'<div class="tablewrap"><table class="table"><thead><tr><th>题号</th><th>题型</th><th>错误次数</th><th>最近做错</th><th>状态</th></tr></thead><tbody>'+top.map(function(x){return '<tr><td><button class="btn small" onclick="startPractice(\'stats\',['+qIndexArg(x.q)+'])">'+x.q.qid+'</button></td><td>'+x.q.type+'</td><td>'+x.w.wrongCount+'</td><td>'+formatTime(x.w.lastWrongAt)+'</td><td>'+(x.w.mastered?'基本掌握':'待巩固')+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="empty">暂无错题数据。</div>')+'</div>';setMain(html,'stats')}

function correctionAnswerInputs(q,current){var n=normalizeAnswer(current,q.type);if(q.type==='判断题')return '<label class="check"><input type="radio" name="corrAns" value="true" '+(n===true?'checked':'')+'>正确</label><label class="check"><input type="radio" name="corrAns" value="false" '+(n===false?'checked':'')+'>错误</label>';return q.choices.map(function(c){var checked=q.type==='单选题'?n===c.key:Array.isArray(n)&&n.indexOf(c.key)>=0;return '<label class="check"><input type="'+(q.type==='单选题'?'radio':'checkbox')+'" name="corrAns" value="'+c.key+'" '+(checked?'checked':'')+'>'+c.key+'</label>'}).join('')}
function openCorrection(qid){var q=QMAP[qid],r=store.corrections[qid]||{},current=Object.prototype.hasOwnProperty.call(r,'userAnswer')?r.userAnswer:effectiveAnswer(q),types=r.problemTypes||[];var problems=['题库答案错误','解析错误','题目表述有争议','程序判题错误','其他'];showModal('<h2>题库纠错</h2><div class="split"><div><b>当前题号</b><p>'+q.qid+'（第 '+q.id+' 题）</p></div><div><b>题型</b><p>'+q.type+'</p></div></div><div class="formrow"><label>当前题库答案</label><div class="notice">题库原答案：'+esc(answerDisplay(q.officialAnswer,q.type))+'<br>当前采用答案：'+esc(answerDisplay(effectiveAnswer(q),q.type))+'</div></div><div class="formrow"><label>用户认为正确答案</label><div class="checks">'+correctionAnswerInputs(q,current)+'</div></div><div class="formrow"><label>问题类型（可多选）</label><div class="checks">'+problems.map(function(p){return '<label class="check"><input type="checkbox" name="problemType" value="'+p+'" '+(types.indexOf(p)>=0?'checked':'')+'>'+p+'</label>'}).join('')+'</div></div><div class="formrow"><label>备注</label><textarea id="corrNote" class="textarea" placeholder="说明依据、法条或判题异常">'+esc(r.note||'')+'</textarea></div><label class="check"><input id="applyCorrection" type="checkbox" '+(q.correctedAnswer!==null||!r.updatedAt?'checked':'')+'>将用户答案设为当前采用答案（覆盖判题；原答案保留）</label><div class="actions"><button class="btn primary" onclick="saveCorrection(\''+qid+'\')">保存</button><button class="btn" onclick="closeModal()">取消</button></div>')}
function saveCorrection(qid){var q=QMAP[qid],els=[].slice.call(document.querySelectorAll('[name="corrAns"]:checked')),vals=els.map(function(e){return e.value}),answer;if(q.type==='判断题')answer=vals.length?vals[0]==='true':null;else if(q.type==='单选题')answer=vals[0]||'';else answer=vals.sort();if(answer===null||answer===''||(Array.isArray(answer)&&!answer.length)){alert('请选择用户认为正确的答案。');return}var types=[].slice.call(document.querySelectorAll('[name="problemType"]:checked')).map(function(e){return e.value});if(!types.length){alert('请至少选择一种问题类型。');return}var old=store.corrections[qid]||{},now=isoNow();store.corrections[qid]={qid:qid,type:q.type,officialAnswer:q.officialAnswer,userAnswer:normalizeAnswer(answer,q.type),problemTypes:types,note:document.getElementById('corrNote').value,createdAt:old.createdAt||now,updatedAt:now};if(document.getElementById('applyCorrection').checked)store.correctedAnswers[qid]=normalizeAnswer(answer,q.type);else delete store.correctedAnswers[qid];save();refreshQuestionModels();closeModal();if(state.practice)renderPractice();else showCorrections()}
function deleteCorrection(qid){if(!confirm('确定删除 '+qid+' 的纠错记录及其人工答案覆盖吗？'))return;delete store.corrections[qid];delete store.correctedAnswers[qid];save();refreshQuestionModels();showCorrections()}
function showCorrections(){var rows=Object.keys(store.corrections).map(function(k){return store.corrections[k]}).sort(function(a,b){return (b.updatedAt||'').localeCompare(a.updatedAt||'')});var html='<div class="card pagehead"><h2>题库纠错记录</h2><div class="muted">纠错记录和答案覆盖均保存在本机，可修改、删除或单独导出。</div></div><div class="card toolbar"><button class="btn" onclick="exportCorrectionsJSON()" '+(!rows.length?'disabled':'')+'>导出 JSON</button><button class="btn" onclick="exportCorrectionsCSV()" '+(!rows.length?'disabled':'')+'>导出 CSV</button></div><div class="card tablewrap">'+(rows.length?'<table class="table"><thead><tr><th>题号</th><th>题型</th><th>题库答案</th><th>用户修正</th><th>问题类型</th><th>备注</th><th>时间</th><th>操作</th></tr></thead><tbody>'+rows.map(function(r){var q=QMAP[r.qid];return '<tr><td>'+r.qid+'</td><td>'+r.type+'</td><td>'+esc(answerDisplay(r.officialAnswer,r.type))+'</td><td>'+esc(answerDisplay(r.userAnswer,r.type))+'</td><td>'+esc((r.problemTypes||[]).join('、'))+'</td><td>'+esc(r.note||'')+'</td><td>'+formatTime(r.updatedAt)+'</td><td><button class="btn small" onclick="openCorrection(\''+r.qid+'\')">修改</button> <button class="btn small danger" onclick="deleteCorrection(\''+r.qid+'\')">删除</button></td></tr>'}).join('')+'</tbody></table>':'<div class="empty">暂无纠错记录。可在任意题目的“题库纠错”按钮中新增。</div>')+'</div>';setMain(html,'corrections')}

function showExamSetup(){if(state.exam&&state.exam.timerId)clearInterval(state.exam.timerId);state.exam=null;var html='<div class="card pagehead"><h2>模拟考试</h2><div class="muted">考试中不显示对错、答案和解析，交卷后统一统计并进入错题解析。</div></div><div class="card" style="padding:20px"><div class="split"><div class="formrow"><label>题量</label><select id="examCount" class="select"><option value="10">10题</option><option value="20">20题</option><option value="50">50题</option><option value="100">100题</option><option value="all">全题库</option></select></div><div class="formrow"><label>题型比例</label><select id="examRatio" class="select" onchange="toggleCustomExam()"><option value="auto">自动比例</option><option value="single">仅单选</option><option value="multi">仅多选</option><option value="judge">仅判断</option><option value="custom">自定义</option></select></div></div><div id="customExam" class="split" style="display:none"><div class="formrow"><label>判断题数量</label><input id="customJudge" class="input" type="number" min="0" max="74" value="3"></div><div class="formrow"><label>单选题数量</label><input id="customSingle" class="input" type="number" min="0" max="75" value="4"></div><div class="formrow"><label>多选题数量</label><input id="customMulti" class="input" type="number" min="0" max="74" value="3"></div></div><div class="formrow"><label>倒计时</label><select id="examMinutes" class="select"><option value="auto">自动（约每题 1.2 分钟）</option><option value="10">10分钟</option><option value="20">20分钟</option><option value="30">30分钟</option><option value="60">60分钟</option><option value="90">90分钟</option><option value="120">120分钟</option><option value="0">不限时</option></select></div><div class="actions"><button class="btn primary" onclick="startExam()">开始考试</button><button class="btn" onclick="showHome()">返回首页</button></div></div>';setMain(html,'exam')}

function validateQuestionPack(obj,allowEmpty,replaceMode){
 if(!isObj(obj)||obj.schema!==QUESTION_PACK_SCHEMA||!Array.isArray(obj.records))throw new Error('文件不是 police-quiz-question-pack/v1 扩展题库');
 if(!allowEmpty&&!obj.records.length)throw new Error('题包中没有题目');
 var seen={},clean=[],errors=[];obj.records.forEach(function(r,i){try{var q=normalizeQuestionRecord(r);if(qidNumber(q.qid)<=BASE_QUESTION_COUNT)throw new Error(q.qid+' 属于内置母题，扩展题必须从 '+toQid(BASE_QUESTION_COUNT+1)+' 开始');if(seen[q.qid])throw new Error(q.qid+' 在本文件中重复');seen[q.qid]=true;clean.push(q)}catch(e){errors.push('第 '+(i+1)+' 条：'+e.message)}});
 if(errors.length)throw new Error(errors.slice(0,6).join('；')+(errors.length>6?'；另有 '+(errors.length-6)+' 项':''));
 var merged={};if(!replaceMode)Object.keys(questionBank.records).forEach(function(k){merged[k]=questionBank.records[k]});clean.forEach(function(r){merged[r.qid]=r});var keys=Object.keys(merged).sort(function(a,b){return qidNumber(a)-qidNumber(b)}),expected=BASE_QUESTION_COUNT+1;
 for(var i=0;i<keys.length;i++,expected++){if(qidNumber(keys[i])!==expected)throw new Error('扩展题号必须连续，缺少 '+toQid(expected)+'；当前新题应从 '+toQid(Object.keys(questionBank.records).length+BASE_QUESTION_COUNT+1)+' 开始')}
 return clean;
}
function importQuestionPack(input){var file=input.files&&input.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){try{var obj=JSON.parse(reader.result),clean=validateQuestionPack(obj,false);if(!confirm('将合并导入 '+clean.length+' 道扩展题；相同题号会更新，是否继续？'))return;var merged=serializableQuestionBank(questionBank),map={};merged.records.forEach(function(r){map[r.qid]=r});clean.forEach(function(r){map[r.qid]=r});merged.records=Object.keys(map).sort(function(a,b){return qidNumber(a)-qidNumber(b)}).map(function(k){return map[k]});merged.version=obj.version||merged.version;merged.generatedAt=obj.generatedAt||isoNow();merged.sourceNote=obj.sourceNote||merged.sourceNote;merged.batches=merged.batches||[];if(obj.batch)merged.batches.push(obj.batch);if(Array.isArray(obj.batches))merged.batches=merged.batches.concat(obj.batches);localStorage.setItem(QUESTION_BANK_KEY,JSON.stringify(merged));questionBank=normalizeQuestionBank(merged);rebuildQuestionModels();store.settings.lastSelfCheck=runSelfCheck();alert('扩展题库导入成功。当前共 '+QUESTIONS.length+' 题，下一题号为 '+toQid(QUESTIONS.length+1)+'。');showBackup()}catch(e){alert('扩展题库导入失败：'+e.message)}finally{input.value=''}};reader.onerror=function(){alert('扩展题库文件读取失败。');input.value=''};reader.readAsText(file,'utf-8')}

function validateCorrectionsPack(obj){if(!isObj(obj)||obj.schema!==CORRECTIONS_SCHEMA||!Array.isArray(obj.records))throw new Error('文件不是 police-quiz-corrections/v2 数据表');var seen={},errors=[];obj.records.forEach(function(r,i){var q=r&&QMAP[r.qid];if(!q){errors.push('第 '+(i+1)+' 条题号不存在，请先导入对应扩展题库');return}if(seen[r.qid])errors.push(r.qid+' 重复');seen[r.qid]=true;if(r.type!==q.type)errors.push(r.qid+' 题型不匹配');if(!answerEqual(r.officialAnswer,q.officialAnswer,q.type))errors.push(r.qid+' 原答案不匹配');if(q.type==='判断题'){if(!r.itemAnalysis||!r.itemAnalysis.statement||!r.itemAnalysis.statement.reason)errors.push(r.qid+' 缺少判断说明')}else{var opts=r.itemAnalysis&&r.itemAnalysis.options||{},correct=normalizeAnswer(r.correctedAnswer!==null&&r.correctedAnswer!==undefined?r.correctedAnswer:r.officialAnswer,q.type);q.choices.forEach(function(c){if(!opts[c.key]||!opts[c.key].reason)errors.push(r.qid+' 缺少'+c.key+'项说明');else if(!!opts[c.key].shouldSelect!==(Array.isArray(correct)?correct.indexOf(c.key)>=0:correct===c.key))errors.push(r.qid+' '+c.key+'项应选状态与答案不一致')})}});if(errors.length)throw new Error(errors.slice(0,6).join('；')+(errors.length>6?'；另有 '+(errors.length-6)+' 项':''));return true}
function importCorrectionsPack(input){var file=input.files&&input.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){try{var obj=JSON.parse(reader.result);validateCorrectionsPack(obj);if(!confirm('将合并导入 '+obj.records.length+' 条逐项解析；相同题号以本批数据更新，是否继续？'))return;var merged=serializableCorrectionsPack(correctionsPack);var map={};merged.records.forEach(function(r){map[r.qid]=r});obj.records.forEach(function(r){map[r.qid]=r});merged.records=Object.keys(map).sort().map(function(k){return map[k]});merged.version=obj.version||merged.version;merged.generatedAt=obj.generatedAt||isoNow();merged.sourceNote=obj.sourceNote||merged.sourceNote;merged.batches=merged.batches||[];if(obj.batch)merged.batches.push(obj.batch);if(Array.isArray(obj.batches))merged.batches=merged.batches.concat(obj.batches);localStorage.setItem(CORRECTIONS_KEY,JSON.stringify(merged));correctionsPack=normalizeCorrectionsPack(merged);refreshQuestionModels();store.settings.lastSelfCheck=runSelfCheck();alert('本批导入成功，现有逐项解析 '+Object.keys(correctionsPack.records).length+' 题。');showBackup()}catch(e){alert('corrections 导入失败：'+e.message)}finally{input.value=''}};reader.onerror=function(){alert('corrections 文件读取失败。');input.value=''};reader.readAsText(file,'utf-8')}

function importLearningData(input){var file=input.files&&input.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){try{var obj=JSON.parse(reader.result),data=obj.data||obj,prospectiveQuestionBank=null,prospectiveCorrections=null;if(!isObj(data)||(!isObj(data.answers)&&!isObj(data.wrong)&&!isObj(data.notes))){throw new Error('不是有效的学习数据')}if(obj.extensionQuestionBank){var clean=validateQuestionPack(obj.extensionQuestionBank,true,true),qb=JSON.parse(JSON.stringify(obj.extensionQuestionBank));qb.records=clean;prospectiveQuestionBank=normalizeQuestionBank(qb)}if(obj.correctionsData){var oldQuestionBank=questionBank;if(prospectiveQuestionBank){questionBank=prospectiveQuestionBank;rebuildQuestionModels()}try{validateCorrectionsPack(obj.correctionsData);prospectiveCorrections=normalizeCorrectionsPack(obj.correctionsData)}finally{if(prospectiveQuestionBank){questionBank=oldQuestionBank;rebuildQuestionModels()}}}if(!confirm('导入将完整替换当前学习记录；备份中包含的扩展题库和 corrections 也会恢复，是否继续？'))return;store=coerceStore(data);if(prospectiveQuestionBank){questionBank=prospectiveQuestionBank;localStorage.setItem(QUESTION_BANK_KEY,JSON.stringify(serializableQuestionBank(questionBank)))}rebuildQuestionModels();if(prospectiveCorrections){correctionsPack=prospectiveCorrections;localStorage.setItem(CORRECTIONS_KEY,JSON.stringify(serializableCorrectionsPack(correctionsPack)))}refreshQuestionModels();save();store.settings.lastSelfCheck=runSelfCheck();alert('完整备份导入成功，当前共 '+QUESTIONS.length+' 题。');showHome()}catch(e){alert('导入失败：'+e.message)}finally{input.value=''}};reader.onerror=function(){alert('文件读取失败。');input.value=''};reader.readAsText(file,'utf-8')}
function resetLearningData(){if(!confirm('此操作将清除所有答题记录、错题、收藏和笔记，是否继续？'))return;if(!confirm('请再次确认：纠错记录、人工修正答案和学习统计也将清除，且无法撤销。'))return;store=freshStore();save();refreshQuestionModels();alert('学习记录已重置，内置题库、扩展题库和 corrections 均未删除。');showHome()}
function runSelfCheck(){var tests=[];function t(name,ok){tests.push({name:name,ok:!!ok})}t('内置母题保持 '+BASE_QUESTION_COUNT+' 题',BASE_QUESTION_COUNT===223&&QUESTIONS.length>=BASE_QUESTION_COUNT);t('固定题号连续唯一',QUESTIONS.every(function(q,i){return q.qid===toQid(i+1)})&&new Set(QUESTIONS.map(function(q){return q.qid})).size===QUESTIONS.length);t('扩展题库数量与运行题库一致',QUESTIONS.length===BASE_QUESTION_COUNT+Object.keys(questionBank.records).length);t('扩展题号从 Q224 连续追加',Object.keys(questionBank.records).sort(function(a,b){return qidNumber(a)-qidNumber(b)}).every(function(k,i){return k===toQid(BASE_QUESTION_COUNT+i+1)}));t('单选答案标准化',normalizeAnswer('正确答案： A ','单选题')==='A');t('多选分隔符与顺序标准化',answerEqual(['C','A','B'],'答案：A、B，C','多选题'));t('判断题多种文本标准化',normalizeAnswer('答案：√','判断题')===true&&normalizeAnswer('正确答案：错','判断题')===false&&normalizeAnswer('答案：不正确','判断题')===false);t('多选漏选判错',!answerEqual(['A','B'],['A','B','C'],'多选题'));t('题目答案均可识别',QUESTIONS.every(function(q){var a=q.officialAnswer;return q.type==='判断题'?typeof a==='boolean':q.type==='单选题'?/^[A-D]$/.test(a):Array.isArray(a)&&a.length>0}));t('搜索覆盖解析与法条',searchQuestions('治安管理处罚法','全部').length>0);t('corrections v2 题号均存在',correctionsPack.schema===CORRECTIONS_SCHEMA&&Object.keys(correctionsPack.records).every(function(k){return !!QMAP[k]}));var key='__quiz_v6_selftest__';try{localStorage.setItem(key,'ok');t('localStorage 可写可读',localStorage.getItem(key)==='ok');localStorage.removeItem(key)}catch(e){t('localStorage 可写可读',false)}var pass=tests.every(function(x){return x.ok});store.settings.lastSelfCheck={at:isoNow(),pass:pass,tests:tests};save();return store.settings.lastSelfCheck}
function showBackup(){var c=store.settings.lastSelfCheck||runSelfCheck(),cs=correctionsStatus(),qs=questionBankStatus();var html='<div class="card pagehead"><h2>数据管理</h2><div class="muted">内置母题、扩展题库、逐项解析和学习记录分层保存。</div></div><div class="card" style="padding:20px"><h3>扩展题库 JSON</h3><div class="notice">内置母题：<b>'+BASE_QUESTION_COUNT+'</b> 道　扩展题：<b>'+qs.count+'</b> 道　当前总数：<b>'+QUESTIONS.length+'</b> 道<br>下一道新题必须从 <b>'+qs.next+'</b> 开始连续编号；相同扩展题号再次导入时会更新该题。</div><div class="actions"><button class="btn primary" onclick="document.getElementById(\'questionPackFile\').click()">导入扩展题库 JSON</button><button class="btn" onclick="downloadQuestionPackTemplate()">下载 GPT 题包模板</button><button class="btn" onclick="exportQuestionBank()" '+(!qs.count?'disabled':'')+'>导出当前扩展题库</button><button class="btn danger" onclick="removeQuestionBank()" '+(!qs.count?'disabled':'')+'>移除扩展题库</button></div><p class="muted">请先导入扩展题库，再导入这些新题对应的 corrections。扩展题库保存在本机 localStorage，离线可用。</p><h3>题库 corrections 数据表</h3><div class="notice">当前版本：<b>'+esc(cs.version)+'</b>　已载入：<b>'+cs.count+'</b> 题　批次：<b>'+cs.batches+'</b><br><span class="muted">答案优先级：用户人工修正 &gt; corrections 修正 &gt; 题库原答案。</span></div><div class="actions"><button class="btn primary" onclick="document.getElementById(\'correctionsFile\').click()">导入 corrections JSON</button><button class="btn danger" onclick="removeCorrectionsPack()" '+(!cs.count?'disabled':'')+'>移除已导入解析</button></div><h3>完整数据备份</h3><div class="actions"><button class="btn primary" onclick="exportLearningData()">导出完整备份（JSON）</button><button class="btn" onclick="document.getElementById(\'importFile\').click()">导入完整备份</button></div><p class="muted">完整备份同时包含学习记录、扩展题库和 corrections，可在另一浏览器完整恢复。</p><h3>系统自检</h3><div class="selfcheck">'+c.tests.map(function(x){return '<div class="'+(x.ok?'checkpass':'checkfail')+'">'+(x.ok?'✓ ':'✕ ')+esc(x.name)+'</div>'}).join('')+'</div><div class="actions"><button class="btn" onclick="store.settings.lastSelfCheck=runSelfCheck();showBackup()">重新自检</button><span class="muted">上次自检：'+formatTime(c.at)+'</span></div><h3>重置学习数据</h3><p class="muted">仅清除答题、错题、收藏、笔记与人工纠错，不删除内置题库、扩展题库或 corrections。</p><button class="btn danger" onclick="resetLearningData()">重置学习记录</button></div>';setMain(html,'backup')}

window.addEventListener('keydown',function(e){if(window.innerWidth<=820)return;var tag=(e.target&&e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select'||(e.target&&e.target.isContentEditable))return;if(e.key==='Escape'){closeModal();return}if(state.practice){var q=currentPracticeQ();if(['1','2','3','4'].indexOf(e.key)>=0){e.preventDefault();var i=Number(e.key)-1;if(q.type==='判断题'&&i<2)pickPractice(i===0?'true':'false');else if(q.type!=='判断题'&&q.choices[i])pickPractice(q.choices[i].key)}else if(e.key==='Enter'){e.preventDefault();submitPractice()}else if(e.key==='ArrowRight'){e.preventDefault();nextPractice()}else if(e.key==='ArrowLeft'){e.preventDefault();prevPractice()}else if(e.key.toLowerCase()==='f'){e.preventDefault();toggleQuickFavorite()}else if(e.key.toLowerCase()==='m'){e.preventDefault();toggleReview(q.qid)}}else if(state.exam&&!state.exam.finished){var eq=state.exam.list[state.exam.index];if(['1','2','3','4'].indexOf(e.key)>=0){e.preventDefault();var n=Number(e.key)-1;if(eq.type==='判断题'&&n<2)pickExam(n===0?'true':'false');else if(eq.type!=='判断题'&&eq.choices[n])pickExam(eq.choices[n].key)}else if(e.key==='ArrowRight'){e.preventDefault();examNext()}else if(e.key==='ArrowLeft'){e.preventDefault();examPrev()}else if(e.key.toLowerCase()==='m'){e.preventDefault();toggleExamMark()}}});

// 暴露只读测试接口，便于离线浏览器自检，不参与业务数据。
window.__QUIZ_V6__={normalizeAnswer:normalizeAnswer,answerEqual:answerEqual,runSelfCheck:runSelfCheck,validateQuestionPack:validateQuestionPack,validateCorrectionsPack:validateCorrectionsPack,getStore:function(){return store},getQuestionBank:function(){return questionBank},getCorrectionsPack:function(){return correctionsPack},questions:QUESTIONS};
runSelfCheck();showHome();
</script>

<script>
(function(){
  var deferredPrompt=null;
  var btn=null;

  function showInstallButton(){
    btn=document.getElementById('installPwaBtn');
    if(!btn) return;
    var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
    if(!standalone && deferredPrompt) btn.style.display='';
    else btn.style.display='none';
  }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt=e;
    showInstallButton();
  });

  window.addEventListener('appinstalled', function(){
    deferredPrompt=null;
    showInstallButton();
  });

  document.addEventListener('click', async function(e){
    if(e.target && e.target.id==='installPwaBtn'){
      if(!deferredPrompt){
        alert('如果没有弹出安装提示，请在浏览器菜单中选择“添加到主屏幕”或“安装应用”。');
        return;
      }
      deferredPrompt.prompt();
      try{ await deferredPrompt.userChoice; }catch(err){}
      deferredPrompt=null;
      showInstallButton();
    }
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./service-worker.js').catch(function(err){
        console.warn('Service Worker 注册失败：',err);
      });
      showInstallButton();
    });
  }
})();
</script>
