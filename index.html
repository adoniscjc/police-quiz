ht:8px;background:#edf0f4;border-radius:99px;overflow:hidden;margin:8px 0 13px}.bar{height:100%;background:var(--primary)}.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:520px;overflow:auto;padding:2px}.navq{height:35px;border-radius:7px;background:#f0f3f7;color:#5b6876;font-size:10px}.navq.done{background:#dff3e8;color:var(--ok)}.navq.wrong{background:#ffe2e2;color:var(--bad)}.navq.current{outline:2px solid var(--primary)}.navq.marked{box-shadow:inset 0 -4px #f1a41a}.navq.fav{border:1px solid #d39a27}.legend{font-size:12px;color:var(--muted);line-height:1.7;margin-top:11px}.list{display:flex;flex-direction:column;gap:10px}.listitem{padding:15px 17px}.listitem h3{font-size:15px;margin:0 0 7px}.listitem p{margin:5px 0;line-height:1.65}.listmeta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}.table th{background:#f5f8fb;white-space:nowrap}.table td{line-height:1.55}.empty{padding:38px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;display:none;z-index:80;align-items:center;justify-content:center;padding:18px;background:rgba(8,25,43,.55)}.modal.show{display:flex}.modalbox{width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:16px;background:#fff;padding:21px}.modalbox h2{margin-top:0}.formrow{margin:13px 0}.formrow>label{font-weight:700;display:block;margin-bottom:7px}.checks{display:flex;gap:9px;flex-wrap:wrap}.check{display:flex;gap:6px;align-items:center;padding:8px 10px;background:#f6f8fb;border-radius:8px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.barrow{display:grid;grid-template-columns:80px 1fr 50px;gap:10px;align-items:center;margin:9px 0}.chartbar{height:13px;background:#e9edf2;border-radius:99px;overflow:hidden}.chartbar i{display:block;height:100%;background:var(--primary);border-radius:99px}.examtop{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.timer{font-size:18px;font-weight:850;color:var(--bad);font-variant-numeric:tabular-nums}.exammark{color:var(--warn)}.resultsummary{padding:22px}.resultsummary h2{margin-top:0}.searchhit mark{background:#ffe38d;color:inherit;padding:0 1px}.badge{display:inline-block;padding:3px 7px;border-radius:6px;background:#eef2f7;font-size:11px}.badge.bad{background:#ffe5e5;color:var(--bad)}.badge.ok{background:#e2f5eb;color:var(--ok)}.badge.warn{background:#fff0d1;color:var(--warn)}.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 5px}.selfcheck{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.checkpass{padding:9px;border-radius:8px;background:#edf8f2;color:var(--ok)}.checkfail{padding:9px;border-radius:8px;background:#fff0f0;color:var(--bad)}

<script>
const QUESTIONS = [{"id":1,"type":"判断题","question":"张某假冒道士窜至乡村留守老妪黄某家中，与黄某攀谈中，煞有介事吓唬黄某近\n期家中在外的亲人有灾祸发生，黄某信以为真，求解化灾良方。张某说，拿出\n999 元现金，用红布包好后敬神念咒，一切可化解。黄某拿出 999 元，张某用红\n包包裹，让黄某再取硬币 9 枚以便做法。黄某转身取币之际，张某把红布里的现\n金掉了包。张某交代黄某默念口诀 99 遍不得停顿，黄某遵从，随后张某匆匆离\n开。黄某念罢口诀，发现红布里包着一沓白纸。张某的行为构成盗窃的违反治安\n管理行为。","choices":[],"answer":"正确","explanation":"《中华人民共和国治安管理处罚法》第五十八条 盗窃、诈骗、哄抢、抢夺或者\n敲诈勒索的，处五日以上十日以下拘留或者二千元以下罚款；情节较重的，处十\n日以上十五日以下拘留，可以并处三千元以下罚款。"},{"id":2,"type":"单选题","question":"甲系某公司经理，乙是其司机。某日，乙开车送甲去洽谈商务，途中因违章超速\n行驶当场将行人丙撞成重伤，乙欲送丙去医院救治，被甲阻止。甲催乙先送其去\n洽谈商务，称否则造成重大经济损失，于是乙离开肇事现场，丙因延误救治而不\n治身亡。关于本案，下列说法正确的是（）。","choices":[{"key":"A","text":"甲不构成犯罪，乙构成交通肇事罪"},{"key":"B","text":"甲、乙均构成交通肇事罪"},{"key":"C","text":"乙构成不作为的故意杀人罪，甲是不作为的故意杀人罪的共犯"},{"key":"D","text":"对甲、乙应当处七年以上有期徒刑"}],"answer":"B","explanation":"《最高人民法院关于审理交通肇事刑事案件具体应用法律若干问题的解释》第二\n条 交通肇事致一人以上重伤，负事故全部或者主要责任，并具有下列情形之一\n的，以交通肇事罪定罪处罚：（六）为逃避法律追究逃离事故现场的。\n第五条 “因逃逸致人死亡”，是指行为人在交通肇事后为逃避法律追究而逃跑，\n致使被害人因得不到救助而死亡的情形。\n交通肇事后，单位主管人员、机动车辆所有人、承包人或者乘车人指使肇事人逃\n逸，致使被害人因得不到救助而死亡的，以交通肇事罪的共犯论处。"},{"id":3,"type":"多选题","question":"下列行政案件违法事实确凿，人民警察不能适用简易程序作出处罚决定的是( )。","choices":[{"key":"A","text":"对殴打他人违反治安管理的陈某处 300 元罚款的案件"},{"key":"B","text":"对交通技术监控设备记录的占用公交车道行驶的谢某处 200 元罚款的案件"},{"key":"C","text":"对违反《居民身份证法》的陶某处 100 元罚款的案件"},{"key":"D","text":"对参与赌博的违反治安管理行为人李某处 200 元罚款的案件"}],"answer":"ABC","explanation":"《公安机关办理行政案件程序规定》第三十七条 违法事实确凿，且具有下列情\n形之一的，人民警察可以当场作出处罚决定，有违禁品的，可以当场收缴：\n（一）对违反治安管理行为人或者道路交通违法行为人处二百元以下罚款或者警\n告的；\n（二）出入境边防检查机关对违反出境入境管理行为人处五百元以下罚款或者警\n告的；\n（三）对有其他违法行为的个人处五十元以下罚款或者警告、对单位处一千元以\n下罚款或者警告的；\n（四）法律规定可以当场处罚的其他情形。\n涉及卖淫、嫖娼、赌博、毒品的案件，不适用当场处罚。"},{"id":4,"type":"判断题","question":"甲被乙当众辱骂后，第二天找人将乙打伤，甲的行为可以被认定为正当防卫。","choices":[],"answer":"错误","explanation":"《治安管理处罚法》第十九条 为了免受正在进行的不法侵害而采取的制止行为，\n造成损害的，不属于违反治安管理行为，不受处罚；制止行为明显超过必要限度，\n造成较大损害的，依法给予处罚，但是应当减轻处罚；情节较轻的，不予处罚。"},{"id":5,"type":"单选题","question":"根据行刑衔接标准，对传销活动的组织者和领导者追究刑事责任的规模要求是？\n（ ）","choices":[{"key":"A","text":"参与人员达到 10 人以上或层级达到 2 级以上。"},{"key":"B","text":"参与人员达到 20 人以上且层级达到 2 级以上。"},{"key":"C","text":"参与人员达到 30 人以上且层级达到 3 级以上。"},{"key":"D","text":"无论规模大小，一经发现即追究刑事责任。"}],"answer":"C","explanation":"《关于办理组织领导传销活动刑事案件适用法律若干问题的意见》\n一、关于传销组织层级及人数的认定问题\n以推销商品、提供服务等经营活动为名，要求参加者以缴纳费用或者购买商\n品、服务等方式获得加入资格，并按照一定顺序组成层级，直接或者间接以发展\n人员的数量作为计酬或者返利依据，引诱、胁迫参加者继续发展他人参加，骗取\n财物，扰乱经济社会秩序的传销组织，其组织内部参与传销活动人员在三十人以\n上且层级在三级以上的，应当对组织者、领导者追究刑事责任。\n组织、领导多个传销组织，单个或者多个组织中的层级已达三级以上的，可\n将在各个组织中发展的人数合并计算。\n组织者、领导者形式上脱离原传销组织后，继续从原传销组织获取报酬或者\n返利的，原传销组织在其脱离后发展人员的层级数和人数，应当计算为其发展的\n层级数和人数。\n办理组织、领导传销活动刑事案件中，确因客观条件的限制无法逐一收集参\n与传销活动人员的言词证据的，可以结合依法收集并查证属实的缴纳、支付费用\n及计酬、返利记录，视听资料，传销人员关系图，银行账户交易记录，互联网电\n子数据，鉴定意见等证据，综合认定参与传销的人数、层级数等犯罪事实。"},{"id":6,"type":"多选题","question":"下列关于办理行政案件的送达和期间，说法错误的是（）。","choices":[{"key":"A","text":"公告送达期限不得少于 30 日"},{"key":"B","text":"被处理人不在场的，公安机关应当在作出决定后 2 日内将决定书送达被处理人"},{"key":"C","text":"被处理人不在场的，公安机关应当在作出决定后 5 日内将决定书送达被处理\n人"},{"key":"D","text":"除被限制人身自由的期间外，期间的最后一日是节假日的，以节假日后的第一\n日为期间届满的日期"}],"answer":"ABC","explanation":"《公安机关办理行政案件程序规定》\n第三十五条 期间以时、日、月、年计算，期间开始之时或者日不计算在内。\n法律文书送达的期间不包括路途上的时间。期间的最后一日是节假日的，以节假\n日后的第一日为期满日期，但违法行为人被限制人身自由的期间，应当至期满之\n日为止，不得因节假日而延长。\n第三十六条 送达法律文书，应当遵守下列规定：\n（一）依照简易程序作出当场处罚决定的，应当将决定书当场交付被处罚人，\n并由被处罚人在备案的决定书上签名或者捺指印；被处罚人拒绝的，由办案人民\n警察在备案的决定书上注明；\n（二）除本款第一项规定外，作出行政处罚决定和其他行政处理决定，应当\n在宣告后将决定书当场交付被处理人，并由被处理人在附卷的决定书上签名或者\n捺指印，即为送达；被处理人拒绝的，由办案人民警察在附卷的决定书上注明；\n被处理人不在场的，公安机关应当在作出决定的七日内将决定书送达被处理人，\n治安管理处罚决定应当在二日内送达。\n送达法律文书应当首先采取直接送达方式，交给受送达人本人；受送达人不\n在的，可以交付其成年家属、所在单位的负责人员或者其居住地居（村）民委员\n会代收。受送达人本人或者代收人拒绝接收或者拒绝签名和捺指印的，送达人可\n以邀请其邻居或者其他见证人到场，说明情况，也可以对拒收情况进行录音录像，\n把文书留在受送达人处，在附卷的法律文书上注明拒绝的事由、送达日期，由送\n达人、见证人签名或者捺指印，即视为送达。\n无法直接送达的，委托其他公安机关代为送达，或者邮寄送达。经受送达人\n同意，可以采用传真、互联网通讯工具等能够确认其收悉的方式送达。\n经采取上述送达方式仍无法送达的，可以公告送达。公告的范围和方式应当\n便于公民知晓，公告期限不得少于六十日。"},{"id":7,"type":"判断题","question":"公安局对甲的抢劫案进行侦查时，发现其还涉嫌盗窃犯罪，甲已因涉嫌抢劫被批\n准逮捕，现需对该盗窃案进行侦查，公安局决定对甲重新计算侦查羁押期限，该\n公安局应报上级公安机关批准。","choices":[],"answer":"错误","explanation":"《公安机关办理刑事案件程序规定》\n第一百五十一条 在侦查期间，发现犯罪嫌疑人另有重要罪行的，应当自发现之\n日起五日以内报县级以上公安机关负责人批准后，重新计算侦查羁押期限，制作\n变更羁押期限通知书，送达看守所，并报批准逮捕的人民检察院备案。\n前款规定的“另有重要罪行”，是指与逮捕时的罪行不同种的重大犯罪以及同种\n犯罪并将影响罪名认定、量刑档次的重大犯罪。"},{"id":8,"type":"单选题","question":"下列关于传唤违反治安管理行为人的说法错误的是 ( )。","choices":[{"key":"A","text":"对现场发现的违反治安管理行为人，民警经出示工作证件，可以口头传唤，但\n应当在询问笔录中注明"},{"key":"B","text":"对于不接受传唤或者逃避传唤的违反治安管理行为人，可以强制传唤"},{"key":"C","text":"强制传唤时，可以依法使用手铐、警绳等约束性警械"},{"key":"D","text":"对拒不提供家属联系方式或者有其他无法通知的情形的，可以不予通知，但应\n在询问笔录中予以注明"}],"answer":"B","explanation":"《中华人民共和国治安管理处罚法》\n第九十六条 需要传唤违反治安管理行为人接受调查的，经公安机关办案部\n门负责人批准，使用传唤证传唤。对现场发现的违反治安管理行为人，人民警察\n经出示人民警察证，可以口头传唤，但应当在询问笔录中注明。\n公安机关应当将传唤的原因和依据告知被传唤人。对无正当理由不接受传唤\n或者逃避传唤的人，经公安机关办案部门负责人批准，可以强制传唤。\n强制传唤前提是无正当理由不接受传唤或者逃避传唤的违法行为人。B 选项忽略\n了无正当理由。"},{"id":9,"type":"多选题","question":"下列关于犯罪认定的说法正确的是（ ）。","choices":[{"key":"A","text":"刘某在网上认识小红（13 岁），视频聊天后感觉小红可能是幼女，欲与其发生\n性关系，小红不同意。刘某表示愿意付费 3000 元并送她一部 Iphone5S，后小红\n便与其发生了性关系，并收受了刘某的现金和手机。刘某构成强奸罪"},{"key":"B","text":"孙某下飞机时，发现邻座乘客王某钱包掉在座位底下，王某坐着并未发现，孙\n某遂捡起钱包（内有人民币 3000 元）离去。孙某构成侵占罪"},{"key":"C","text":"谢某在建筑工地强行命令工人用塔吊运送超重货物，缆绳断裂后货物掉下，砸\n死两人。谢某构成过失致人死亡罪"},{"key":"D","text":"张某有能力支付工人的劳动报酬，而不支付，达到 6 万元，劳动管理部门责令\n其支付，由于张某出国在外没有收到责令支付的通知，在指定的期限内仍未支付。\n张某不构成拒不支付劳动报酬罪"}],"answer":"AD","explanation":"（1）《刑法》236 条第 2 款规定，奸淫不满 14 周岁的幼女的，以强奸罪论，从\n重处罚。最高人民法院、最高人民检察院、公安部、司法部《关于依法惩治性侵\n害未成年人犯罪的意见》第 20 条规定，以金钱财物等方式引诱幼女与自己发生\n性关系的，以强奸罪论处。刘某以现金 3000 元和一部 Iphone5S 手机引诱幼女小\n红与其发生了性关系，以强奸罪论。因此，A 正确。\n（2）《刑法》第 264 条规定，盗窃公私财物，数额较大的，或者多次盗窃、入\n户盗窃、携带凶器盗窃、扒窃的，以盗窃罪定罪处罚。最高人民法院、最高人民\n检察院《关于办理盗窃刑事案件适用法律若干问题的解释》第 1 条第 1 款规定，\n盗窃公私财物价值 1000 元至 3000 元以上的，应当认定为《刑法》第 264 条规定\n的“数额较大”。孙某将乘客王某钱包掉在座位底下捡起钱包（内有人民币 3000\n元）离去，属于秘密窃取他人财物的行为，数额较大，构成盗窃罪而非侵占罪。\n因此，B 错误。\n（3）《刑法》第 134 条第 2 款规定，强令他人违章冒险作业，因而发生重大伤\n亡事故或者造成其他严重后果的，构成强令违章冒险作业罪。最高人民检察院、\n公安部《关于公安机关管辖的刑事案件立案追诉标准的规定（一）》第 9 条规定，\n强令他人违章冒险作业，造成死亡一人以上，或者重伤三人以上的，应予以立案\n追诉。谢某在建筑工地强行命令工人用塔吊运送超重货物，缆绳断裂后货物掉下，\n砸死两人。构成强令违章冒险作业罪。因此，C 错误。\n（4）《刑法》第 276 条之一规定，以转移财产、逃匿等方法逃避支付劳动者的\n劳动报酬或者有能力支付而不支付劳动者的劳动报酬，数额较大，经政府有关部\n门责令支付仍不支付的，构成拒不支付劳动报酬罪。《最高人民法院关于审理拒\n不支付劳动报酬刑事案件适用法律若干问题的解释》第 4 条规定，经人力资源社\n会保障部门或者政府其他有关部门依法以限期整改指令书、行政处理决定书等文\n书责令支付劳动者的劳动报酬后，在指定的期限内仍不支付的，应当认定为刑法\n第 276 条之一第 1 款规定的“经政府有关部门责令支付仍不支付”，但有证据证\n明行为人有正当理由未知悉责令支付或者未及时支付劳动报酬的除外。张某出国\n在外没有收到责令支付的通知，在指定的期限内仍未支付。张某不构成拒不支付\n劳动报酬罪。因此，D 正确。"},{"id":10,"type":"判断题","question":"拖拉机厂电工张某，自恃技术熟练，在检修电路时不按规定操作，造\n成电路着火，部分设备被烧毁，损失 10 多万元，张某的行为构成玩忽职守罪。","choices":[],"answer":"错误","explanation":"《中华人民共和国刑法》\n第三百九十七条 【滥用职权罪】【玩忽职守罪】国家机关工作人员滥用职\n权或者玩忽职守，致使公共财产、国家和人民利益遭受重大损失的，处三年以下\n有期徒刑或者拘役；情节特别严重的，处三年以上七年以下有期徒刑。本法另有\n规定的，依照规定。\n国家机关工作人员徇私舞弊，犯前款罪的，处五年以下有期徒刑或者拘役；\n情节特别严重的，处五年以上十年以下有期徒刑。本法另有规定的，依照规定。\n第一百三十四条 【重大责任事故罪】在生产、作业中违反有关安全管理的\n规定，因而发生重大伤亡事故或者造成其他严重后果的，处三年以下有期徒刑或\n者拘役；情节特别恶劣的，处三年以上七年以下有期徒刑。"},{"id":11,"type":"单选题","question":"某县派出所民警在办理一起盗窃摩托车的刑事案件中，扣押了犯罪嫌疑人盗窃的\n张某所有的摩托车一辆，现该案事实已查清，返还不影响案件办理，张某请求取\n回摩托车，以下做法正确的是（ ）。","choices":[{"key":"A","text":"直接叫张某到派出所，将摩托车交给张某，并开具发还清单"},{"key":"B","text":"经过派出所副所长审批同意后，将摩托车发还给张某，并开具发还清单"},{"key":"C","text":"经过县局副局长审批同意后，将摩托车发还给张某，并开具发还清单"},{"key":"D","text":"不予理采，等法院判决再说"}],"answer":"C","explanation":"《公安机关办理刑事案件程序规定》\n第二百三十二条 扣押犯罪嫌疑人的邮件、电子邮件、电报，应当经县级以\n上公安机关负责人批准，制作扣押邮件、电报通知书，通知邮电部门或者网络服\n务单位检交扣押。\n不需要继续扣押的时候，应当经县级以上公安机关负责人批准，制作解除扣\n押邮件、电报通知书，立即通知邮电部门或者网络服务单位。"},{"id":12,"type":"多选题","question":"近年来我国未成年人犯罪总体呈上升趋势，低龄未成年人犯罪占比上升。根\n据《刑法》《未成年人保护法》，下列说法正确的是（ ）。","choices":[{"key":"A","text":"刑法中规定的已满十六周岁、十八周岁，是从周岁生日的当天起算。"},{"key":"B","text":"公安机关办理未成年人刑事案件，应根据未成年人身心特点，有针对性地进行\n法治教育"},{"key":"C","text":"已满十六周岁不满十八周岁的人出于以大欺小、以强凌弱，多次对其他未成年\n人强拿硬要，扰乱学校秩序，情节严重的，以寻衅滋事罪定罪处罚。"},{"key":"D","text":"已满十四周岁不满十六周岁的人使用轻微暴力或者威胁，强行索要其他未成年\n人随身携带的生活、学习用品或者钱财数量不大，且未造成被害人轻微伤以上或\n者不敢正常到校学习、生活等危害后果的，以寻衅滋事罪定罪处罚。"}],"answer":"BC","explanation":"《最高人民法院关于审理未成年人刑事案件具体应用法律若干问题的解释》\n第二条 刑法第十七条规定的“周岁”，按照公历的年、月、日计算，从周\n岁生日的第二天起算。\n第七条 已满十四周岁不满十六周岁的人使用轻微暴力或者威胁，强行索要\n其他未成年人随身携带的生活、学习用品或者钱财数量不大，且未造成被害人轻\n微伤以上或者不敢正常到校学习、生活等危害后果的，不认为是犯罪。\n第八条 已满十六周岁不满十八周岁的人具有前款规定情形的，一般也不认\n为是犯罪。已满十六周岁不满十八周岁的人出于以大欺小、以强凌弱或者寻求精\n神刺激，随意殴打其他未成年人、多次对其他未成年人强拿硬要或者任意损毁公\n私财物，扰乱学校及其他公共场所秩序，情节严重的，以寻衅滋事罪定罪处罚。\n《中华人民共和国未成年人保护法》\n第一百一十五条 公安机关、人民检察院、人民法院和司法行政部门应当结\n合实际，根据涉及未成年人案件的特点，开展未成年人法治宣传教育工作。"},{"id":13,"type":"判断题","question":"张某在精神病发作但尚未完全丧失辨认或者控制自己行为能力时，打\n伤邻居，公安机关应不予处罚。","choices":[],"answer":"错误","explanation":"《中华人民共和国治安管理处罚法》\n第十三条 精神病人、智力残疾人在不能辨认或者不能控制自己行为的时候\n违反治安管理的，不予处罚，但是应当责令其监护人加强看护管理和治疗。间歇\n性的精神病人在精神正常的时候违反治安管理的，应当给予处罚。尚未完全丧失\n辨认或者控制自己行为能力的精神病人、智力残疾人违反治安管理的，应当给予\n处罚，但是可以从轻或者减轻处罚。"},{"id":14,"type":"单选题","question":"犯罪嫌疑人李某在被监视居住期间有下列行为，公安机关可以对其逮捕的是（）。","choices":[{"key":"A","text":"未经执行机关批准，多次离开执行监视居住的住处"},{"key":"B","text":"隐藏了自己的工作证"},{"key":"C","text":"在公安机关传讯时迟到一次"},{"key":"D","text":"与共同居住的家庭成员通电话"}],"answer":"A","explanation":"《中华人民共和国刑事诉讼法》\n第七十七条 被监视居住的犯罪嫌疑人、被告人应当遵守以下规定：\n（一）未经执行机关批准不得离开执行监视居住的处所；\n（二）未经执行机关批准不得会见他人或者通信；\n（三）在传讯的时候及时到案；\n（四）不得以任何形式干扰证人作证；\n（五）不得毁灭、伪造证据或者串供；\n（六）将护照等出入境证件、身份证件、驾驶证件交执行机关保存。\n被监视居住的犯罪嫌疑人、被告人违反前款规定，情节严重的，可以予以逮\n捕；需要予以逮捕的，可以对犯罪嫌疑人、被告人先行拘留。"},{"id":15,"type":"多选题","question":"民警刘某开枪将正在实施犯罪的李某击伤，刘某应当（ ）。","choices":[{"key":"A","text":"及时抢救受伤人员"},{"key":"B","text":"立即交出武器"},{"key":"C","text":"保护现场"},{"key":"D","text":"立即向当地检察机关报告"}],"answer":"AC","explanation":"《中华人民共和国人民警察使用警械和武器条例》\n第十二条 人民警察使用武器造成犯罪分子或者无辜人员伤亡的，应当及时\n抢救受伤人员，保护现场，并立即向当地公安机关或者该人民警察所属机关报告。\n当地公安机关或者该人民警察所属机关接到报告后，应当及时进行勘验、调查，\n并及时通知当地人民检察院。\n当地公安机关或者该人民警察所属机关应当将犯罪分子或者无辜人员的伤\n亡情况，及时通知其家属或者其所在单位。"},{"id":16,"type":"判断题","question":"甲(13 周岁)以特别残忍手段杀害 6 岁的乙，因情节特别恶劣，经最高人民检察\n院核准追诉的，应当追究其刑事责任。","choices":[],"answer":"正确","explanation":"《中华人民共和国刑法》\n第十七条 【刑事责任年龄】已满十六周岁的人犯罪，应当负刑事责任。\n已满十四周岁不满十六周岁的人，犯故意杀人、故意伤害致人重伤或者死亡、\n强奸、抢劫、贩卖毒品、放火、爆炸、投放危险物质罪的，应当负刑事责任。\n已满十二周岁不满十四周岁的人，犯故意杀人、故意伤害罪，致人死亡或者\n以特别残忍手段致人重伤造成严重残疾，情节恶劣，经最高人民检察院核准追诉\n的，应当负刑事责任。\n对依照前三款规定追究刑事责任的不满十八周岁的人，应当从轻或者减轻处\n罚。\n因不满十六周岁不予刑事处罚的，责令其父母或者其他监护人加以管教；在\n必要的时候，依法进行专门矫治教育。"},{"id":17,"type":"单选题","question":"各级机关、单位应当按照（ ）分离制度要求，将涉及民事、行政、刑事等诉\n讼权利救济的信访事项从普通信访体制中分离出来，由有关政法部门依法处理。","choices":[{"key":"A","text":"违法与违规"},{"key":"B","text":"党纪与政纪"},{"key":"C","text":"民事与刑事"},{"key":"D","text":"诉讼与信访"}],"answer":"D","explanation":"《信访工作条例》\n第二十八条 各级机关、单位及其工作人员办理信访事项，应当恪尽职守、\n秉公办事，查明事实、分清责任，加强教育疏导，及时妥善处理，不得推诿、敷\n衍、拖延。\n各级机关、单位应当按照诉讼与信访分离制度要求，将涉及民事、行政、刑\n事等诉讼权利救济的信访事项从普通信访体制中分离出来，由有关政法部门依法\n处理。\n各级机关、单位工作人员与信访事项或者信访人有直接利害关系的，应当回\n避。"},{"id":18,"type":"多选题","question":"以下关于交通管制和现场管制说法正确的是（ ）。","choices":[{"key":"A","text":"县级以上公安机关可以在必要时实行交通管制"},{"key":"B","text":"县级以上公安机关经同级人民政府批准，可以对危害社会治安秩序的突发事件\n实行现场管制"},{"key":"C","text":"公安机关人民警察可以依照规定采取相应的交通管制措施"},{"key":"D","text":"公安机关人民警察可以依照规定采取强行驱散、强行带离现场等现场管制措施"}],"answer":"ACD","explanation":"《中华人民共和国人民警察法》\n第十五条 县级以上人民政府公安机关，为预防和制止严重危害社会治安秩\n序的行为，可以在一定的区域和时间，限制人员、车辆的通行或者停留，必要时\n可以实行交通管制。\n公安机关的人民警察依照前款规定，可以采取相应的交通管制措施。\n第十七条 县级以上人民政府公安机关，经上级公安机关和同级人民政府批\n准，对严重危害社会治安秩序的突发事件，可以根据情况实行现场管制。\n公安机关的人民警察依照前款规定，可以采取必要手段强行驱散，并对拒不\n服从的人员强行带离现场或者立即予以拘留。\n3 月 10 日"},{"id":19,"type":"判断题","question":"依法治国首先要依宪治国，依法执政首先要依宪执政。","choices":[],"answer":"正确","explanation":"《中共中央关于全面推进依法治国若干重大问题的决定》（2014 年 10 月\n23 日中国共产党第十八届中央委员会第四次全体会议通过）二、完善以宪法为\n核心的中国特色社会主义法律体系，加强宪法实施 （一）健全宪法实施和监督\n制度。宪法是党和人民意志的集中体现，是通过科学民主程序形成的根本法。坚\n持依法治国首先要坚持依宪治国，坚持依法执政首先要坚持依宪执政。全国各族\n人民、一切国家机关和武装力量、各政党和各社会团体、各企业事业组织，都必\n须以宪法为根本的活动准则，并且负有维护宪法尊严、保证宪法实施的职责。一\n切违反宪法的行为都必须予以追究和纠正。"},{"id":20,"type":"单选题","question":"信访人张三违反集会游行示威相关规定，纠集多人滋事扰序、缠访闹访情节\n严重，由（ ）依法采取必要的现场处置措施。","choices":[{"key":"A","text":"信访部门"},{"key":"B","text":"辖区街道"},{"key":"C","text":"公安机关"},{"key":"D","text":"人民政府"}],"answer":"C","explanation":"《信访工作条例》\n第四十七条 信访人违反本条例第二十条、第二十六条规定的，有关机关、\n单位工作人员应当对其进行劝阻、批评或者教育。\n信访人滋事扰序、缠访闹访情节严重，构成违反治安管理行为的，或者违反\n集会游行示威相关法律法规的，由公安机关依法采取必要的现场处置措施、给予\n治安管理处罚；构成犯罪的，依法追究刑事责任。\n信访人捏造歪曲事实、诬告陷害他人，构成违反治安管理行为的，依法给予\n治安管理处罚；构成犯罪的，依法追究刑事责任。"},{"id":21,"type":"多选题","question":"落实依法治国基本方略，加快建设社会主义法治国家，必须全面推进（ ）。","choices":[{"key":"A","text":"科学立法"},{"key":"B","text":"严格执法"},{"key":"C","text":"公正司法"},{"key":"D","text":"全民守法"}],"answer":"ABCD","explanation":"2012 年，党的十八大报告确立法治建设新十六字方针，提出了“科学立法”，\n报告在论述“全面推进依法治国”的方略时提出，“要推进科学立法、严格执法、\n公正司法、全民守法”。"},{"id":22,"type":"判断题","question":"甲地公安机关协作乙地公安机关办理案件时，所产生的法律责任均由乙地公安机\n关承担。","choices":[],"answer":"错误","explanation":"《公安机关办理行政案件程序规定》\n第一百二十二条 协作地公安机关依照办案地公安机关的要求，依法履行办\n案协作职责所产生的法律责任，由办案地公安机关承担。\n《公安机关办理刑事案件程序规定》\n第三百五十五条 协作地公安机关依照办案地公安机关的协作请求履行办\n案协作职责所产生的法律责任，由办案地公安机关承担。但是，协作行为超出协\n作请求范围，造成执法过错的，由协作地公安机关承担相应法律责任。"},{"id":23,"type":"单选题","question":"下列情形应当以故意杀人罪定罪处罚的是（ ）。","choices":[{"key":"A","text":"甲（民警）在审讯过程中，刑讯逼供致嫌疑人死亡"},{"key":"B","text":"乙在抢劫过程中因与被害人发生扭打，失手致被害人死亡"},{"key":"C","text":"丙绑架人质后因勒索不得，将被害人杀死"},{"key":"D","text":"丁捏造并散布虚假事实诽谤同学王某，王某想不开自杀"}],"answer":"A","explanation":"《中华人民共和国刑法》\n第二百四十七条 【刑讯逼供罪】【暴力取证罪】司法工作人员对犯罪嫌疑\n人、被告人实行刑讯逼供或者使用暴力逼取证人证言的，处三年以下有期徒刑或\n者拘役。致人伤残、死亡的，依照本法第二百三十四条、第二百三十二条的规定\n定罪从重处罚。\n第二百六十三条 【抢劫罪】以暴力、胁迫或者其他方法抢劫公私财物的，\n处三年以上十年以下有期徒刑，并处罚金；有下列情形之一的，处十年以上有期\n徒刑、无期徒刑或者死刑，并处罚金或者没收财产：\n（一）入户抢劫的；\n（二）在公共交通工具上抢劫的；\n（三）抢劫银行或者其他金融机构的；\n（四）多次抢劫或者抢劫数额巨大的；\n（五）抢劫致人重伤、死亡的；\n（六）冒充军警人员抢劫的；\n（七）持枪抢劫的；\n（八）抢劫军用物资或者抢险、救灾、救济物资的。\n第二百三十九条 【绑架罪】以勒索财物为目的绑架他人的，或者绑架他人\n作为人质的，处十年以上有期徒刑或者无期徒刑，并处罚金或者没收财产；情节\n较轻的，处五年以上十年以下有期徒刑，并处罚金。\n犯前款罪，杀害被绑架人的，或者故意伤害被绑架人，致人重伤、死亡的，\n处无期徒刑或者死刑，并处没收财产。\n以勒索财物为目的偷盗婴幼儿的，依照前两款的规定处罚。\n第二百四十六条 【侮辱罪】【诽谤罪】以暴力或者其他方法公然侮辱他人\n或者捏造事实诽谤他人，情节严重的，处三年以下有期徒刑、拘役、管制或者剥\n夺政治权利。\n前款罪，告诉的才处理，但是严重危害社会秩序和国家利益的除外。\n通过信息网络实施第一款规定的行为，被害人向人民法院告诉，但提供证据\n确有困难的，人民法院可以要求公安机关提供协助。"},{"id":24,"type":"多选题","question":"甲市公安机关需要询问居住在乙市的违法嫌疑人张某，下列询问地点符合《公安\n机关办理行政案件程序规定》规定的是（ ）。","choices":[{"key":"A","text":"张某的住处"},{"key":"B","text":"张某的单位"},{"key":"C","text":"甲市公安机关"},{"key":"D","text":"乙市公安机关"}],"answer":"ABD","explanation":"《公安机关办理行政案件程序规定》第六十六条 询问违法嫌疑人，可以\n到违法嫌疑人住处或者单位进行，也可以将违法嫌疑人传唤到其所在市、县内的\n指定地点进行。\n3 月 12 日"},{"id":25,"type":"判断题","question":"某市发生一起重大责任事故案，公安机关立案侦查。犯罪嫌疑人系该市某国企副\n总经理（非国家工作人员）。在侦查过程中，办案民警发现该市某区政府领导可\n能存在职务犯罪线索。公安机关应将发现的职务犯罪线索立即移送本级监察委员\n会。","choices":[],"answer":"正确","explanation":"根据《监察法》第 3 条、第 4 条及第 37 条规定，监察委员会负责对所有\n行使公权力的公职人员进行监察，调查职务违法和职务犯罪。公安机关在侦查犯\n罪时，发现犯罪嫌疑人还涉嫌职务犯罪等其他犯罪的，应当分别管辖、及时沟通。\n对于公职人员涉嫌职务犯罪的线索，应当及时移送监察机关。本案中发现的区政\n府领导（系公职人员）涉嫌职务犯罪的线索，明显属于监察委员会的管辖范围。"},{"id":26,"type":"单选题","question":"行政机关收到政府信息公开申请后，不能当场答复的，应当自收到申请之日起\n（ ）内予以答复。","choices":[{"key":"A","text":"15 日"},{"key":"B","text":"15 个工作日"},{"key":"C","text":"20 日"},{"key":"D","text":"20 个工作日"}],"answer":"D","explanation":"《中华人民共和国政府信息公开条例》第三十三条 行政机关收到政府信\n息公开申请，能够当场答复的，应当当场予以答复。\n行政机关不能当场答复的，应当自收到申请之日起 20 个工作日内予以答复；需\n要延长答复期限的，应当经政府信息公开工作机构负责人同意并告知申请人，延\n长的期限最长不得超过 20 个工作日。\n行政机关征求第三方和其他机关意见所需时间不计算在前款规定的期限内。"},{"id":27,"type":"多选题","question":"根据《治安管理处罚法》的规定，若作出以下处罚决定，违法嫌疑人其有权要求\n举行听证的是（ ）。","choices":[{"key":"A","text":"行政拘留十日"},{"key":"B","text":"吊销许可证件"},{"key":"C","text":"罚款五千元"},{"key":"D","text":"警告"}],"answer":"BC","explanation":"《中华人民共和国治安管理处罚法》第一百一十七条 公安机关作出吊销\n许可证件、处四千元以上罚款的治安管理处罚决定或者采取责令停业整顿措施\n前，应当告知违反治安管理行为人有权要求举行听证；违反治安管理行为人要求\n听证的，公安机关应当及时依法举行听证。\n对依照本法第二十三条第二款规定可能执行行政拘留的未成年人，公安机关应当\n告知未成年人和其监护人有权要求举行听证；未成年人和其监护人要求听证的，\n公安机关应当及时依法举行听证。对未成年人案件的听证不公开举行。\n前两款规定以外的案情复杂或者具有重大社会影响的案件，违反治安管理行为人\n要求听证，公安机关认为必要的，应当及时依法举行听证。\n公安机关不得因违反治安管理行为人要求听证而加重其处罚。"},{"id":28,"type":"判断题","question":"孙某因与邻居发生口角，情绪激动之下，从其居住的 15 楼窗户先后\n抛下一个空啤酒瓶和一个装有半瓶水的矿泉水瓶。啤酒瓶落在小区人行道旁绿化\n带内未造成损伤，矿泉水瓶砸中停放在路边的汽车前挡风玻璃，造成损失 5000\n元。孙某的行为构成以危险方法危害公共安全罪。","choices":[],"answer":"错误","explanation":"《刑法》第 114 条规定：放火、决水、爆炸以及投放毒害性、放射性、传\n染病病原体等物质或者以其他危险方法危害公共安全，尚未造成严重后果的，处\n三年以上十年以下有期徒刑。据此，以危险方法危害公共安全罪要求行为具有与\n放火、爆炸等相当的具体、现实的公共危险。孙某抛掷物品虽在小区公共区域，\n但仅造成财产损失，未危及不特定多数人的人身安全，不足以危害公共安全，故\n不构成以危险方法危害公共安全罪。\n《刑法》第 291 条之二（第 1 款）规定：从建筑物或者其他高空抛掷物品，情节\n严重的，处一年以下有期徒刑、拘役或者管制，并处或者单处罚金。据此，孙某\n从 15 楼抛掷物品，造成财产损失 5000 元，且行为发生在小区公共区域，属于情\n节严重，符合高空抛物罪的构成要件。"},{"id":29,"type":"单选题","question":"田某在宾馆吸食冰毒后产生幻觉，将房间内设施毁坏，价值 1000 多元。事后田\n某主动赔偿，并取得宾馆谅解。下列说法正确的是（ ）。","choices":[{"key":"A","text":"田某的行为与酒后滋事类似，应以寻衅滋事定性处理"},{"key":"B","text":"田某吸食冰毒后产生幻觉，其主观上没有毁坏财物的故意，不能以故意损毁\n财物定性处理"},{"key":"C","text":"对田某可以调解处理，调解不成。因其主动赔偿，可以从轻处罚"},{"key":"D","text":"对田某应当以吸毒、故意损毁财物的违反治安管理行为分别决定，合并执行"}],"answer":"D","explanation":"A 选项：田某在宾馆房间内毁坏设施，其行为对象是特定的（其入住的房\n间及内部设施），并未侵犯不特定对象的财产安全和社会公共秩序。因此，其行\n为性质应为故意损毁财物，而非寻衅滋事。\nB 选项：行为人在吸食毒品前，作为完全行为能力人，应当能够预见到吸毒后可\n能产生幻觉、行为失控的后果。这种“自陷风险”的行为被称为“原因自由行为”。\nC 选项：吸毒行为不属于“民间纠纷”的范畴，不适用调解。《中华人民共和国\n治安管理处罚法》第九条第一款 对于因民间纠纷引起的打架斗殴或者损毁他人\n财物等违反治安管理行为，情节较轻的，公安机关可以调解处理。\nD 选项：《中华人民共和国治安管理处罚法》第十六条 有两种以上违反治安管\n理行为的，分别决定，合并执行处罚。行政拘留处罚合并执行的，最长不超过二\n十日。\n《中华人民共和国治安管理处罚法》第八十四条 有下列行为之一的，处十日以\n上十五日以下拘留，可以并处三千元以下罚款；情节较轻的，处五日以下拘留或\n者一千元以下罚款：\n（一）非法持有鸦片不满二百克、海洛因或者甲基苯丙胺不满十克或者其他少量\n毒品的；\n（二）向他人提供毒品的；\n（三）吸食、注射毒品的；\n（四）胁迫、欺骗医务人员开具麻醉药品、精神药品的。\n聚众、组织吸食、注射毒品的，对首要分子、组织者依照前款的规定从重处罚。\n吸食、注射毒品的，可以同时责令其六个月至一年以内不得进入娱乐场所、不得\n擅自接触涉及毒品违法犯罪人员。违反规定的，处五日以下拘留或者一千元以下\n罚款。\n第五十九条 故意损毁公私财物的，处五日以下拘留或者一千元以下罚款；情节\n较重的，处五日以上十日以下拘留，可以并处三千元以下罚款。"},{"id":30,"type":"多选题","question":"2024 年 4 月，某市公安机关接到某中学强制报告称：初二女生小丽（15 周岁）\n被其继父杨某长期性侵。经侦查发现：杨某自 2023 年 6 月起利用共同生活便利，\n多次在夜间潜入小丽卧室实施性侵，并拍摄不雅视频威胁其不得声张。小丽母亲\n刘某虽隐约知晓但因经济依赖未予制止。学校老师在发现小丽情绪异常后立即按\n《未成年人保护法》第 40 条要求报案。公安机关在取证过程中还发现杨某将部\n分不雅视频通过网络出售牟利。面对这起严重侵害未成年人权益的恶性案件，下\n列哪些处置措施是公安机关必须依法采取的强制性义务？（ ）","choices":[{"key":"A","text":"将小丽带离家庭交由民政部门临时监护，确保其脱离危险环境"},{"key":"B","text":"通知法律援助机构为小丽提供法律援助，无需审查其经济困难状况"},{"key":"C","text":"对学校履行强制报告义务的情况制作笔录，纳入办案证据体系"},{"key":"D","text":"将小丽母亲刘某以涉嫌虐待罪移送检察机关审查起诉"}],"answer":"A C D","explanation":"（1）《未成年人保护法》第 92 条第（六）项规定：未成年人遭受监护人\n严重伤害或者面临人身安全威胁，需要被紧急安置的，民政部门应当依法对未成\n年人进行临时监护。据此，公安机关在侦查中发现小丽遭受继父性侵且母亲未制\n止，属于面临人身安全威胁的情形，有义务协助民政部门采取临时监护措施，因\n此，A 项正确。（2）《法律援助法》第 24 条规定：刑事案件的被害人及其法定\n代理人或者近亲属，因经济困难没有委托诉讼代理人的，可以向法律援助机构申\n请法律援助。据此，法律援助仍需审查经济困难状况，并无\"无需审查\"的强制性\n规定，因此，B 项错误。（3）《未成年人保护法》第 11 条第 3 款规定：有关部\n门接到涉及未成年人的检举、控告或者报告，应当依法及时受理、处置，并以适\n当方式将处理结果告知相关单位和人员。据此，公安机关受理学校强制报告后，\n应当制作笔录并纳入证据体系，因此，C 项正确。（4）《刑法》第 260 条规定：\n虐待家庭成员，情节恶劣的，处二年以下有期徒刑、拘役或者管制。据此，小丽\n母亲刘某明知性侵未制止，涉嫌不作为虐待，公安机关发现犯罪事实应当依法立\n案侦查并移送起诉，因此，D 项正确。"},{"id":31,"type":"判断题","question":"阻碍人民警察依法执行职务的，应当从重处罚。","choices":[],"answer":"正确","explanation":"《治安管理处罚法》第 61 条第 2 款规定：\"阻碍人民警察依法执行职务的，\n从重处罚。\""},{"id":32,"type":"单选题","question":"A 县某公司的业务员甲、乙一起到 B 县出差，在 B 县的宾馆认识了 C 县某公司的\n业务员丙、丁，四人便在房间内赌博，被人举报。派出所出警时，被出来买烟的\n甲、乙看到，两人打电话通知丙、丁后，先行逃到了公司设在 D 县的分公司，丙、\n丁则被派出所出警民警抓到。该案件应当由（ ）办理。","choices":[{"key":"A","text":"A 县公安局"},{"key":"B","text":"B 县公安局"},{"key":"C","text":"C 县公安局"},{"key":"D","text":"D 县公安局"}],"answer":"B","explanation":"《公安机关办理行政案件程序规定》第十条 行政案件由违法行为地的公\n安机关管辖。由违法行为人居住地公安机关管辖更为适宜的，可以由违法行为人\n居住地公安机关管辖，但是涉及卖淫、嫖娼、赌博、毒品的案件除外。\n违法行为地包括违法行为发生地和违法结果发生地。违法行为发生地，包括违法\n行为的实施地以及开始地、途经地、结束地等与违法行为有关的地点；违法行为\n有连续、持续或者继续状态的，违法行为连续、持续或者继续实施的地方都属于\n违法行为发生地。违法结果发生地，包括违法对象被侵害地、违法所得的实际取\n得地、藏匿地、转移地、使用地、销售地。\n居住地包括户籍所在地、经常居住地。经常居住地是指公民离开户籍所在地最后\n连续居住一年以上的地方，但在医院住院就医的除外。\n移交违法行为人居住地公安机关管辖的行政案件，违法行为地公安机关在移交前\n应当及时收集证据，并配合违法行为人居住地公安机关开展调查取证工作。"},{"id":33,"type":"多选题","question":"张某、李某共谋抢劫出租车司机。由李某持刀威胁，张某搜取财物。在实施过程\n中，司机激烈反抗，李某持刀将司机刺成重伤。张某见状非常害怕，大喊\"不要\n杀了\"，并扔下已搜得的数百元现金，开门逃离现场。李某继续实施暴力，致司\n机死亡后逃离。关于张某的行为定性，下列选项正确的是？（ ）","choices":[{"key":"A","text":"张某与李某在抢劫罪的范围内成立共同犯罪"},{"key":"B","text":"张某在李某实施致命暴力前，主动放弃犯罪并逃离，有效防止了死亡结果的发\n生，对司机死亡结果不负责任"},{"key":"C","text":"张某虽未造成重伤结果，但仍需对抢劫致人重伤的基本行为负责"},{"key":"D","text":"张某的主动放弃行为，可作为量刑情节酌情考虑"}],"answer":"A C D","explanation":"（1）《刑法》第二十五条第一款规定：\"共同犯罪是指二人以上共同故意\n犯罪。\"据此，张某与李某共谋抢劫，并分工实施（李某持刀威胁，张某搜取财\n物），二人具有共同犯罪故意和行为，在抢劫罪范围内成立共同犯罪。因此，A\n项正确。（2）《刑法》第二十四条规定：\"在犯罪过程中，自动放弃犯罪或者自\n动有效地防止犯罪结果发生的，是犯罪中止。\"据此，张某虽主动放弃犯罪并逃\n离（大喊\"不要杀了\"并扔下现金），但未能有效防止李某继续实施暴力致司机死\n亡，因此不成立犯罪中止。根据共同犯罪理论，部分共犯人对共同故意范围内的\n结果负责，张某需对抢劫致人死亡结果承担责任。因此，B 项错误。（3）《刑\n法》第二百六十三条规定：\"以暴力、胁迫或者其他方法抢劫公私财物的......\n有下列情形之一的，处十年以上有期徒刑、无期徒刑或者死刑，并处罚金或者没\n收财产：......（五）抢劫致人重伤、死亡的......\"在共同犯罪中，各共犯人\n对共同故意范围内的犯罪结果负责。据此，张某虽未直接造成重伤，但作为共犯\n人，需对抢劫致人重伤的基本行为负责。因此，C 项正确。（4）《刑法》第六\n十二条规定：\"犯罪分子具有本法规定的从重、从轻处罚情节的，应当在法定刑\n的限度以内判处刑罚。\"据此，张某的主动放弃行为（大喊并逃离），虽不成立\n犯罪中止，但可作为量刑时的酌情从轻情节考虑。因此，D 项正确。"},{"id":34,"type":"判断题","question":"电影院的经营管理人员，违反安全规定，致使该影院有发生安全事故\n危险，经公安机关责令改正，拒不改正的，应当对其给予治安管理处罚。","choices":[],"answer":"正确","explanation":"《治安管理处罚法》第四十五条规定：旅馆、饭店、影剧院、娱乐场、体\n育场馆、展览馆或者其他供社会公众活动的场所违反安全规定，致使该场所有发\n生安全事故危险，经公安机关责令改正而拒不改正的，对其直接负责的主管人员\n和其他直接责任人员处五日以下拘留；情节较重的，处五日以上十日以下拘留。\n据此，电影院属于“影剧院”，是供社会公众活动的场所，其经营管理人员如违\n反安全规定，致使有发生安全事故危险，经公安机关责令改正而拒不改正的，应\n当对其直接负责的主管人员和其他直接责任人员给予治安管理处罚。"},{"id":35,"type":"单选题","question":"某第三方环境检测机构工作人员赵某，在受委托对'星光化工厂'进行排污监测\n时，该厂环保负责人孙某私下给予赵某 2 万元'辛苦费'，请求其关照。赵某遂在\n采样时故意避开主要排污口，在清水区取样，并出具了'排放达标'的虚假监测报\n告。后该厂持续偷排超标废水，造成严重环境污染。赵某的行为构成（ ）","choices":[{"key":"A","text":"非国家工作人员受贿罪"},{"key":"B","text":"提供虚假证明文件罪"},{"key":"C","text":"污染环境罪（共犯）"},{"key":"D","text":"同时构成 A 和 B，应数罪并罚"}],"answer":"B","explanation":"（1）《刑法》第 163 条规定：公司、企业或者其他单位的工作人员，利用\n职务上的便利，索取他人财物或者非法收受他人财物，为他人谋取利益，数额较\n大的，处三年以下有期徒刑或者拘役，并处罚金；数额巨大或者有其他严重情节\n的，处三年以上十年以下有期徒刑，并处罚金；数额特别巨大或者有其他特别严\n重情节的，处十年以上有期徒刑或者无期徒刑，并处罚金。根据《最高人民法院、\n最高人民检察院关于办理贪污贿赂刑事案件适用法律若干问题的解释》第 11 条，\n非国家工作人员受贿罪'数额较大'的标准为 6 万元以上。据此，赵某收受 2 万元\n未达到数额较大标准，因此不构成非国家工作人员受贿罪。所以，A 项错误。（2）\n《刑法》第 229 条第 1 款规定：承担资产评估、验资、验证、会计、审计、法律\n服务、保荐、安全评价、环境影响评价、环境监测等职责的中介组织的人员故意\n提供虚假证明文件，情节严重的，处五年以下有期徒刑或者拘役，并处罚金。同\n条第 3 款规定：有第 1 款行为，同时索取他人财物或者非法收受他人财物构成犯\n罪的，依照处罚较重的规定定罪处罚。据此，赵某作为环境检测机构工作人员，\n故意出具虚假监测报告，导致严重环境污染，情节严重，其行为已构成提供虚假\n证明文件罪。收受财物行为在本案中作为量刑情节处理，但未单独构成受贿罪。\n因此，B 项正确。（3）《刑法》第 338 条规定：违反国家规定，排放、倾倒或\n者处置有放射性的废物、含传染病病原体的废物、有毒物质或者其他有害物质，\n严重污染环境的，构成污染环境罪。赵某出具虚假报告的行为虽客观上帮助化工\n厂掩盖排污，但根据特别规定，其行为已构成提供虚假证明文件罪，不宜再认定\n为污染环境罪的共犯。因此，C 项错误。（4）基于上述分析，赵某不构成非国\n家工作人员受贿罪，只构成提供虚假证明文件罪。且根据《刑法》第 229 条第 3\n款，即使收受财物，也按处罚较重的规定定罪，而非数罪并罚。因此，D 项错误。"},{"id":36,"type":"多选题","question":"王某乘坐长途汽车时，被民警在其行李箱夹层中查获甲基苯丙胺（冰毒）500 克。\n王某辩称该行李箱是朋友委托其带往外地，自己并不知内有毒品。侦查机关查明：\n1. 王某有吸毒前科；2. 其朋友承诺的\"带行李报酬\"远高于市场行情；3. 王某\n在途中异常关注该行李箱，多次查看。此外，王某到案后，主动揭发了其朋友制\n造毒品的重大犯罪线索，公安机关据此侦破一制毒工厂。关于本案，下列选项正\n确的是？（ ）","choices":[{"key":"A","text":"若证据足以证明王某明知是毒品而进行空间位移，其行为应认定为运输毒品罪"},{"key":"B","text":"若证据无法证明王某具有运输目的，但能证明其明知是毒品而持有，可认定为\n非法持有毒品罪"},{"key":"C","text":"认定王某\"明知\"是毒品，可综合其前科、高额报酬、异常行为等客观情况，依\n法进行推定"},{"key":"D","text":"王某揭发制造毒品工厂的行为，若经查证属实，可能构成重大立功，依法可以\n减轻或者免除处罚"}],"answer":"A B C D","explanation":"（1）《刑法》第三百四十七条规定：走私、贩卖、运输、制造毒品，无论\n数量多少，都应当追究刑事责任，予以刑事处罚。据此，如果证据足以证明王某\n明知是毒品而进行空间位移（运输），其行为符合运输毒品罪的构成要件。因此，\nA 项正确。（2）《刑法》第三百四十八条规定：非法持有鸦片一千克以上、海\n洛因或者甲基苯丙胺五十克以上或者其他毒品数量大的，处七年以上有期徒刑或\n者无期徒刑，并处罚金。据此，如果证据无法证明王某具有运输目的（如贩卖、\n运输等），但能证明其明知是毒品而持有，且数量达到较大标准，可认定为非法\n持有毒品罪。因此，B 项正确。（3）《最高人民法院、最高人民检察院、公安\n部关于办理毒品犯罪案件适用法律若干问题的意见》（公通字〔2007〕84 号）\n第二条规定：走私、贩卖、运输、非法持有毒品主观故意中的\"明知\"，是指行为\n人知道或者应当知道所实施的是走私、贩卖、运输、非法持有毒品行为。具有下\n列情形之一，并且犯罪嫌疑人、被告人不能做出合理解释的，可以认定其\"应当\n知道\"，但有证据证明确属被蒙骗的除外：（五）为获取不同寻常的高额或不等\n值的报酬而携带、运输毒品的；（六）采用高度隐蔽的方式携带、运输毒品的；\n以及其他情形。据此，本案中王某有吸毒前科、高额报酬、异常行为（多次查看\n行李箱）等客观情况，可以依法综合推定其明知是毒品。因此，C 项正确。（4）\n《刑法》第六十八条规定：犯罪分子有揭发他人犯罪行为，查证属实的，或者提\n供重要线索，从而得以侦破其他案件等立功表现的，可以从轻或者减轻处罚；有\n重大立功表现的，可以减轻或者免除处罚。《最高人民法院关于处理自首和立功\n具体应用法律若干问题的解释》第七条规定：提供侦破其他重大案件的重要线索，\n经查证属实，应当认定为有重大立功表现。\"重大案件\"的标准一般是指犯罪嫌疑\n人、被告人可能被判处无期徒刑以上刑罚或者案件在本省、自治区、直辖市或者\n全国范围内有较大影响等情形。据此，王某揭发制造毒品工厂，公安机关据此侦\n破一制毒工厂，可能涉及重大犯罪（如制造毒品数量大或规模大），若经查证属\n实，可能构成重大立功，依法可以减轻或者免除处罚。因此，D 项正确。"},{"id":37,"type":"判断题","question":"对扰乱居（村）民委员会秩序的行为，应当按扰乱单位秩序的违反治安管理行为\n予以处罚。","choices":[],"answer":"错误","explanation":"《公安机关执行〈中华人民共和国治安管理处罚法〉有关问题的解释（二）》\n第 6 条第 1 款规定，对扰乱居（村）民委员会秩序的行为，应当根据其具体表现\n形式，如侮辱、诽谤、殴打他人、故意伤害、故意毁损财物等，依照《治安管理\n处罚法》的相关规定予以处罚。"},{"id":38,"type":"单选题","question":"下列不属于治安管理处罚种类的是（ ）。","choices":[{"key":"A","text":"行政拘留"},{"key":"B","text":"罚款"},{"key":"C","text":"训诫"},{"key":"D","text":"吊销公安机关发放的许可证件"}],"answer":"C","explanation":"《治安管理处罚法》第 10 条规定:治安管理处罚的种类分为:（一）警告;\n（二）罚款;（三）行政拘留;（四）吊销公安机关发放的许可证件。对违反治安\n管理的外国人，可以附加适用限期出境或者驱逐出境。"},{"id":39,"type":"多选题","question":"某跨境电子商务公司为提升物流效率，在保税区内违规建设危险化学品仓库，存\n储大量易燃易爆化学品。公安机关联合多部门检查发现：该仓库未取得安全许可；\n消防设施严重不足；员工未经专业培训。同时发现该公司擅自收集用户身份证信\n息用于虚假报关。下列哪些执法行为合法？","choices":[{"key":"A","text":"对未经许可经营危险化学品的行为责令停产停业整顿"},{"key":"B","text":"对冒用他人身份证的行为处以罚款"},{"key":"C","text":"对消防设施不符合规定的行为责令改正并处罚款"},{"key":"D","text":"对违法处理个人信息的行为责令改正并没收违法所得"}],"answer":"A B C D","explanation":"（1）《危险化学品安全管理条例》第 77 条规定：未经许可从事危险化学\n品经营活动的，由安全生产监督管理部门责令停止经营活动，没收违法所得，并\n处 10 万元以上 20 万元以下的罚款；构成犯罪的，依法追究刑事责任。据此，对\n未经许可经营危险化学品的行为责令停止经营活动（即责令停产停业）是法定措\n施，而\"整顿\"常作为后续要求，因此责令停产停业整顿合法。因此，A 项合法。\n（2）《居民身份证法》第 17 条规定：冒用他人居民身份证的，由公安机关处\n200 元以上 1000 元以下罚款，或者处 10 日以下拘留。据此，公司擅自收集用户\n身份证信息用于虚假报关构成冒用行为，处以罚款是合法的。因此，B 项合法。\n（3）《消防法》第 60 条规定：单位违反本法规定，消防设施、器材或者消防安\n全标志的配置、设置不符合国家标准、行业标准，或者未保持完好有效的，责令\n改正，处 5000 元以上 5 万元以下罚款。据此，对消防设施不符合规定的行为责\n令改正并处罚款是合法的。因此，C 项合法。（4）《个人信息保护法》第 66 条\n规定：违反本法规定处理个人信息，或者处理个人信息未履行本法规定的个人信\n息保护义务的，由履行个人信息保护职责的部门责令改正，给予警告，没收违法\n所得；拒不改正的，并处 100 万元以下罚款。据此，对违法处理个人信息的行为\n责令改正并没收违法所得是合法的。因此，D 项合法。"},{"id":40,"type":"判断题","question":"某诈骗团伙头目邱某潜逃至 A 国。我国与 A 国未签订引渡条约。为将邱某缉拿归\n案，我国办案机关可通过国际刑警组织发布红色通报，请求 A 国警方协助抓捕并\n移交。","choices":[],"answer":"正确","explanation":"《公安机关执法细则》第四十七章第 47-01 条规定：公安机关进行刑事司\n法协助和警务合作的范围，主要包括引渡、缉捕和递解犯罪嫌疑人、被告人或者\n罪犯。第 47-02 条规定：需要通过国际刑警组织查找或者缉捕犯罪嫌疑人、被告\n人或者罪犯的，应当提出申请层报国际刑警组织中国国家中心局；国际刑警组织\n红色通报适用于要求其他成员国查找犯罪嫌疑人下落，为开展引渡、移交等执法\n行动而对其拘留、逮捕。据此，我国与 A 国未签订引渡条约时，通过国际刑警组\n织发布红色通报是正式警务合作途径，可请求 A 国警方协助抓捕并可能基于互惠\n原则移交。"},{"id":41,"type":"单选题","question":"根据《治安管理处罚法》的有关规定，下列说法中错误的是（ ）。","choices":[{"key":"A","text":"违反治安管理行为人主动消除或者减轻违法后果的，可以从轻、减轻或者不予\n处罚"},{"key":"B","text":"违法行为人有检举、揭发他人赌博或为赌博提供条件的行为，并经查证属实的，\n可以从轻、减轻或者不予处罚"},{"key":"C","text":"一年内曾因赌博受过治安处罚，再次赌博的，可以从重处罚"},{"key":"D","text":"招引中华人民共和国公民赴境外赌博，可以加重处罚"}],"answer":"D","explanation":"（1）根据《中华人民共和国治安管理处罚法》第二十条第二项的规定：违\n反治安管理有主动消除或者减轻违法后果的，从轻、减轻或者不予处罚。选项 A\n符合法条规定，因此 A 项正确。\n（2）根据《中华人民共和国治安管理处罚法》第二十条第六项的规定，违反治\n安管理有“立功表现的”，可以从轻、减轻或者不予处罚。违法行为人检举、揭\n发他人赌博或为赌博提供条件的行为，并经查证属实，属于立功表现，因此可以\n从轻、减轻或不予处罚。选项 B 的表述符合法律规定，因此 B 项正确。\n（3）根据《中华人民共和国治安管理处罚法》第二十二条第四项的规定，“一\n年以内曾受过治安管理处罚的”，从重处罚。选项 C 描述一年内曾因赌博受处罚\n再次赌博，符合从重处罚情形，因此 C 项正确。\n（4）根据《中华人民共和国治安管理处罚法》的规定，处罚种类包括警告、罚\n款、行政拘留、吊销许可证等，在处罚适用中仅有从轻、减轻、从重等情节，没\n有“加重处罚”的法律术语和规定。加重处罚意指在法定处罚幅度以上处罚，但\n治安管理处罚法无此规定。选项 D 中“招引中华人民共和国公民赴境外赌博”行\n为，可依据赌博相关条款处罚，但法律未规定可加重处罚，因此 D 项错误。"},{"id":42,"type":"多选题","question":"下列哪些行为属于《刑法》第二百九十三条之一催收非法债务罪规定的“催收非\n法债务”行为？（ ）","choices":[{"key":"A","text":"使用暴力、胁迫方法的"},{"key":"B","text":"限制他人人身自由或者侵入他人住宅的"},{"key":"C","text":"恐吓、跟踪、骚扰他人的"},{"key":"D","text":"通过诉讼方式主张高利贷本息的"}],"answer":"A B C","explanation":"（1）《刑法》第 293 条之一第（一）项规定：使用暴力、胁迫方法的。据\n此，使用暴力或胁迫方法催收非法债务属于该罪的行为方式之一，因此，A 项正\n确。（2）《刑法》第 293 条之一第（二）项规定：限制他人人身自由或者侵入\n他人住宅的。据此，限制人身自由或侵入住宅催收非法债务属于该罪的行为方式\n之一，因此，B 项正确。（3）《刑法》第 293 条之一第（三）项规定：恐吓、\n跟踪、骚扰他人的。据此，恐吓、跟踪、骚扰他人催收非法债务属于该罪的行为\n方式之一，因此，C 项正确。（4）《刑法》第 293 条之一规定的催收非法债务\n行为仅限于暴力、胁迫、限制自由、侵入住宅、恐吓、跟踪、骚扰等非法手段，\n不包括通过诉讼等合法途径主张权利。据此，通过诉讼方式主张高利贷本息不属\n于该罪的行为方式。"},{"id":43,"type":"判断题","question":"15 周岁的王某因琐事纠集多人持械追打同学，情节严重，影响恶劣。王某系未\n成年人，应当不执行行政拘留。","choices":[],"answer":"错误","explanation":"根据《治安管理处罚法》第二十三条，已满十四周岁不满十六周岁的人，\n依照本法应当给予行政拘留处罚的，原本不执行行政拘留处罚。但该条第二款明\n确规定：“前款第一项、第二项、第三项规定的行为人违反治安管理情节严重、\n影响恶劣的，或者第一项、第三项规定的行为人在一年以内二次以上违反治安管\n理的，不受前款规定的限制。” 王某（15 岁）持械追打同学属情节严重、影响\n恶劣，符合例外情形，可以执行行政拘留。"},{"id":44,"type":"单选题","question":"根据《民法典》相关规定，下列情形中，导致要约失效的是（ ）。","choices":[{"key":"A","text":"受要约人收到要约后，内部讨论是否接受"},{"key":"B","text":"要约人发出要约后，市场行情发生变化"},{"key":"C","text":"受要约人在承诺期限内未作表示，但要约表明可通过行为作出承诺的除外"},{"key":"D","text":"受要约人向要约人发出了拒绝要约的通知，但该通知在承诺期限届满后到达"}],"answer":"D","explanation":"（1）《民法典》第四百七十八条规定：有下列情形之一的，要约失效：（一）\n要约被拒绝；（二）要约被依法撤销；（三）承诺期限届满，受要约人未作出承\n诺；（四）受要约人对要约的内容作出实质性变更。据此，受要约人内部讨论未\n对外表示拒绝或接受，不符合要约失效情形，因此，A 项错误。（2）《民法典》\n第四百七十六条规定：要约可以撤销，但是有下列情形之一的除外：（一）要约\n人以确定承诺期限或者其他形式明示要约不可撤销；（二）受要约人有理由认为\n要约是不可撤销的，并已经为履行合同做了合理准备工作。据此，市场行情变化\n不是要约失效的法定事由，要约人需依法撤销要约才能失效，因此，B 项错误。\n（3）《民法典》第四百八十条规定：承诺应当以通知的方式作出；但是，根据\n交易习惯或者要约表明可以通过行为作出承诺的除外。据此，如果要约表明可通\n过行为作出承诺，受要约人未作表示但可能通过行为承诺，要约不一定失效，因\n此，C 项错误。（4）《民法典》第四百七十八条第（一）项规定：要约被拒绝\n的，要约失效。另据《民法典》第一百三十七条：以非对话方式作出的意思表示，\n到达相对人时生效。据此，拒绝要约的通知到达要约人时生效，导致要约失效，\n无论是否在承诺期限内到达，因此，D 项正确。"},{"id":45,"type":"多选题","question":"17 周岁的在校学生刘某，因琐事与同学王某发生争执，将王某打成轻伤二级。\n案发后，刘某真诚悔罪，向王某赔礼道歉并赔偿损失，取得了王某的谅解。关于\n本案的程序处理，下列选项正确的是？（ ）","choices":[{"key":"A","text":"该案符合刑事和解的适用条件，双方当事人可以依法达成和解协议"},{"key":"B","text":"检察机关经审查，认为刘某犯罪情节轻微，依照刑法不需要判处刑罚，可以对\n刘某作出不起诉决定"},{"key":"C","text":"检察机关也可对刘某作出附条件不起诉决定，设定六个月以上一年以下的考验\n期"},{"key":"D","text":"若对刘某作出不起诉决定，相关犯罪记录应当予以封存"}],"answer":"A B C","explanation":"（1）《中华人民共和国刑事诉讼法》第二百八十八条规定：下列公诉案件，\n犯罪嫌疑人、被告人真诚悔罪，通过向被害人赔偿损失、赔礼道歉等方式获得被\n害人谅解，被害人自愿和解的，双方当事人可以和解：（一）因民间纠纷引起，\n涉嫌刑法分则第四章、第五章规定的犯罪，可能判处三年有期徒刑以下刑罚的；\n（二）除渎职犯罪以外的可能判处七年有期徒刑以下刑罚的过失犯罪案件。犯罪\n嫌疑人、被告人在五年以内曾经故意犯罪的，不适用本章规定的程序。据此，本\n案中刘某 17 周岁，因琐事争执打伤王某致轻伤二级，属于因民间纠纷引起的故\n意伤害罪（刑法第四章），可能判处三年以下有期徒刑，且刘某真诚悔罪、赔偿\n谅解，符合刑事和解条件。因此，A 项正确。\n（2）《中华人民共和国刑事诉讼法》第一百七十七条第二款规定：对于犯罪情\n节轻微，依照刑法规定不需要判处刑罚或者免除刑罚的，人民检察院可以作出不\n起诉决定。据此，本案中刘某为在校学生，犯罪情节轻微，有悔罪表现并取得谅\n解，检察机关经审查认为不需要判处刑罚的，可以作出酌定不起诉决定。因此，\nB 项正确。\n（3）《中华人民共和国刑事诉讼法》第二百八十二条规定：对于未成年人涉嫌\n刑法分则第四章、第五章、第六章规定的犯罪，可能判处一年有期徒刑以下刑罚，\n符合起诉条件，但有悔罪表现的，人民检察院可以作出附条件不起诉决定。据此，\n本案中刘某 17 周岁系未成年人，故意伤害罪属第四章犯罪，有悔罪表现，取得\n谅解，可能判处一年有期徒刑以下刑罚，检察机关可以作出附条件不起诉决定，\n考验期根据第二百八十三条规定为六个月以上一年以下。因此，C 项正确。\n（4）《中华人民共和国刑事诉讼法》第二百八十六条规定：犯罪的时候不满十\n八周岁，被判处五年有期徒刑以下刑罚的，应当对相关犯罪记录予以封存。据此，\n犯罪记录封存适用于\"被判处刑罚\"的情形，而不起诉决定（包括酌定不起诉和附\n条件不起诉）不属于判处刑罚，因此不起诉决定后的犯罪记录封存无法直接适用\n该条款；目前尚无其他法律规定对不起诉决定后的犯罪记录必须封存。因此，D\n项错误。"},{"id":46,"type":"判断题","question":"警卫国家规定的特定人员，守卫重要的场所和设施，是公安机关人民警察的法定\n职责。","choices":[],"answer":"正确","explanation":"《中华人民共和国人民警察法》第六条规定，公安机关的人民警察按照职\n责分工，依法履行下列职责：（九）警卫国家规定的特定人员，守卫重要的场所\n和设施。该表述完全符合法律规定，故正确。"},{"id":47,"type":"单选题","question":"某第三方环境检测机构工作人员赵某，在受委托对“星光化工厂”进行排污监测\n时，该厂环保负责人孙某私下给予赵某 2 万元“辛苦费”，请求其关照。赵某遂\n在采样时故意避开主要排污口，在清水区取样，并出具了“排放达标”的虚假监\n测报告。后该厂持续偷排超标废水，造成严重环境污染。赵某的行为构成（）。","choices":[{"key":"A","text":"非国家工作人员受贿罪"},{"key":"B","text":"提供虚假证明文件罪"},{"key":"C","text":"污染环境罪（共犯）"},{"key":"D","text":"同时构成 A 和 B，应数罪并罚"}],"answer":"B","explanation":"（1）《刑法》第 163 条规定：公司、企业或者其他单位的工作人员，利用\n职务上的便利，索取他人财物或者非法收受他人财物，为他人谋取利益，数额较\n大的，处三年以下有期徒刑或者拘役，并处罚金；数额巨大或者有其他严重情节\n的，处三年以上十年以下有期徒刑，并处罚金；数额特别巨大或者有其他特别严\n重情节的，处十年以上有期徒刑或者无期徒刑，并处罚金。根据《最高人民法院、\n最高人民检察院关于办理贪污贿赂刑事案件适用法律若干问题的解释》第 11 条，\n非国家工作人员受贿罪'数额较大'的标准为 6 万元以上。据此，赵某收受 2 万元\n未达到数额较大标准，因此不构成非国家工作人员受贿罪。所以，A 项错误。（2）\n《刑法》第 229 条第 1 款规定：承担资产评估、验资、验证、会计、审计、法律\n服务、保荐、安全评价、环境影响评价、环境监测等职责的中介组织的人员故意\n提供虚假证明文件，情节严重的，处五年以下有期徒刑或者拘役，并处罚金。同\n条第 3 款规定：有第 1 款行为，同时索取他人财物或者非法收受他人财物构成犯\n罪的，依照处罚较重的规定定罪处罚。据此，赵某作为环境检测机构工作人员，\n故意出具虚假监测报告，导致严重环境污染，情节严重，其行为已构成提供虚假\n证明文件罪。收受财物行为在本案中作为量刑情节处理，但未单独构成受贿罪。\n因此，B 项正确。（3）《刑法》第 338 条规定：违反国家规定，排放、倾倒或\n者处置有放射性的废物、含传染病病原体的废物、有毒物质或者其他有害物质，\n严重污染环境的，构成污染环境罪。赵某出具虚假报告的行为虽客观上帮助化工\n厂掩盖排污，但根据特别规定，其行为已构成提供虚假证明文件罪，不宜再认定\n为污染环境罪的共犯。因此，C 项错误。（4）基于上述分析，赵某不构成非国\n家工作人员受贿罪，只构成提供虚假证明文件罪。且根据《刑法》第 229 条第 3\n款，即使收受财物，也按处罚较重的规定定罪，而非数罪并罚。因此，D 项错误。"},{"id":48,"type":"多选题","question":"我国警方侦破一跨境电信网络诈骗案，抓获一批从东南亚某国押解回国的犯罪嫌\n疑人。侦查人员收集了的以下证据中，必须予以排除或补正的有（ ）。","choices":[{"key":"A","text":"从嫌疑人处扣押的作案用手机中提取的、显示诈骗话术的聊天记录（未制作\n提取笔录）"},{"key":"B","text":"一名身处国外的被害人通过邮件发送的书面陈述（未经公证、认证）"},{"key":"C","text":"主犯王某的供述，称“我们组就骗了不到 50 万”，但未获其他证据印证"},{"key":"D","text":"从犯张某的供述，详细指认了王某的组织领导行为，但张某辩称其仅 19 岁\n（实际年龄 22 岁，有户籍证明）。"}],"answer":"A B","explanation":"（1）《最高人民法院关于适用〈中华人民共和国刑事诉讼法〉的解释》第\n112 条规定：对收集、提取电子数据是否合法,应当着重审查以下内容:(一)收集、\n提取电子数据是否由二名以上调查人员、侦查人员进行，取证方法是否符合相关\n技术标准;(二)收集、提取电子数据，是否附有笔录、清单，并经调查人员、侦\n查人员、电子数据持有人、提供人、见证人签名或者盖章;没有签名或者盖章的，\n是否注明原因;对电子数据的类别、文件格式等是否注明清楚。据此，提取电子\n数据必须制作笔录，未制作笔录属于程序瑕疵，必须补正或作出合理解释，否则\n不得作为定案根据。因此，A 必须予以排除或补正。（2）《最高人民法院关于\n适用〈中华人民共和国刑事诉讼法〉的解释》第 77 条规定：对来自境外的证据\n材料,人民检察院应当随案移送有关材料来源、提供人、提取人、提取时间等情\n况的说明。经人民法院审查,相关证据材料能够证明案件事实且符合刑事诉讼法\n规定的,可以作为证据使用,但提供人或者我国与有关国家签订的双边条约对材\n料的使用范围有明确限制的除外;材料来源不明或者真实性无法确认的,不得作\n为定案的根据。据此，境外证据未经公证、认证，导致真实性无法确认，必须予\n以排除或补正（如补办手续）。因此，B 必须予以排除或补正。（3）《刑事诉\n讼法》第 55 条规定：对一切案件的判处都要重证据，重调查研究，不轻信口供。\n只有被告人供述，没有其他证据的，不能认定被告人有罪和处以刑罚。据此，王\n某的供述未获其他证据印证，仅影响证明力，不属于程序违法或非法证据，无需\n排除或补正。因此，C 无需予以排除或补正。（4）《刑事诉讼法》第 56 条规定：\n采用刑讯逼供等非法方法收集的犯罪嫌疑人、被告人供述，应当予以排除。据此，\n供述的排除以收集方法非法为前提。张某的供述虽谎报年龄，但收集程序合法，\n年龄误报不影响证据资格，仅影响可信度，无需排除或补正。因此，D 无需予以\n排除或补正。"},{"id":49,"type":"判断题","question":"嫌疑人李某在公共场所殴打他人致轻伤，并损毁公私财物。李某还阻碍警察依法\n执行职务，使用暴力袭击警察。调查中，李某认罪悔罪，赔偿损失。李某殴打他\n人致轻伤，应处十日以上十五日以下拘留，但若取得谅解，可减轻处罚。","choices":[],"answer":"错误","explanation":"《刑法》第 234 条规定：故意伤害他人身体，致人轻伤的，处三年以下有\n期徒刑、拘役或者管制。据此，殴打他人致轻伤已构成故意伤害罪，应追究刑事\n责任，而非适用治安管理处罚。因此，本案中“应处十日以上十五日以下拘留”\n的处理不合法。2005 年公安部《公安机关办理伤害案件规定》第二十八条，被\n害人伤情构成轻伤、重伤或者死亡，需要追究犯罪嫌疑人刑事责任的，依照《中\n华人民共和国刑事诉讼法》的有关规定办理。"},{"id":50,"type":"单选题","question":"在某涉黑案件财产查处工作中，公安机关发现该组织头目刘某将其通过实施套路\n贷犯罪获取的部分资金，以其父亲名义全款购买了一处豪华别墅，并登记在其父\n亲名下。案发后，其父亲声称该房产系自己合法所有，拒绝配合查封。根据《反\n有组织犯罪法》及相关司法解释，公安机关对该房产的正确处理方式是？","choices":[{"key":"A","text":"因登记在案外人名下，且案外人提出异议，应立即解除查封，通过民事诉讼解\n决权属争议。"},{"key":"B","text":"应当对涉案财产的权属进行调查取证，只要有证据证明该财产系刘某犯罪所\n得，即可依法予以查封、扣押、冻结。"},{"key":"C","text":"必须等待人民法院对刘某的刑事判决生效后，才能依据判决书对该房产进行处\n理。"},{"key":"D","text":"告知其父亲需另行提起行政诉讼，公安机关仅负责刑事侦查，不处理财产争议。"}],"answer":"B","explanation":"（1）《反有组织犯罪法》第四十五条规定：有组织犯罪组织及其成员违法\n所得的一切财物及其孳息、收益，违禁品和供犯罪所用的本人财物，应当依法予\n以追缴、没收。被告人实施黑社会性质组织犯罪的定罪量刑事实已经查清，有证\n据证明其在犯罪期间获得的财产高度可能属于黑社会性质组织犯罪的违法所得\n及其孳息、收益，被告人不能说明财产合法来源的，应当依法予以追缴、没收。\n据此，对于用犯罪所得购买的财产，即使登记在案外人名下，只要有证据证明系\n违法所得，公安机关即可依法处理。因此，A 项错误。（2）《反有组织犯罪法》\n第四十一条规定：查封、扣押、冻结、处置涉案财物，应当严格依照法定条件和\n程序进行。不得查封、扣押、冻结与案件无关的财物。经查明确实与案件无关的\n财物，应当在三日以内解除查封、扣押、冻结，予以退还。同时，第四十九条规\n定：利害关系人对查封、扣押、冻结、处置涉案财物提出异议的，公安机关、人\n民检察院、人民法院应当及时予以核实，听取其意见，依法作出处理。据此，公\n安机关应当对涉案财产的权属进行调查取证，如果证据证明该财产系刘某犯罪所\n得，即可依法查封、扣押、冻结，而不必立即解除或等待法院判决。因此，B 项\n正确。（3）《反有组织犯罪法》第四十四条和《公安机关反有组织犯罪工作规\n定》第四十五条规定：公安机关在侦查阶段可以根据需要全面调查涉案财产状况，\n并依法采取查封、扣押、冻结等措施。据此，公安机关在侦查阶段即可对涉案财\n产采取强制措施，不必等待人民法院判决生效。因此，C 项错误。（4）《反有\n组织犯罪法》第四十九条和《公安机关反有组织犯罪工作规定》第五十三条规定：\n公安机关对涉案财物有处理职责，对于利害关系人异议应当核实并依法处理，而\n非告知其提起行政诉讼。据此，公安机关负责刑事侦查中的涉案财产处理，D 项\n错误。"},{"id":51,"type":"多选题","question":"下列哪些行为属于《刑法》第二百九十三条之一催收非法债务罪规定的“催收非\n法债务”行为？（ ）","choices":[{"key":"A","text":"使用暴力、胁迫方法的"},{"key":"B","text":"限制他人人身自由或者侵入他人住宅的"},{"key":"C","text":"恐吓、跟踪、骚扰他人的"},{"key":"D","text":"通过诉讼方式主张高利贷本息的"}],"answer":"A B C","explanation":"（1）《刑法》第 293 条之一第（一）项规定：使用暴力、胁迫方法的。据\n此，使用暴力或胁迫方法催收非法债务属于该罪的行为方式之一，因此，A 项正\n确。（2）《刑法》第 293 条之一第（二）项规定：限制他人人身自由或者侵入\n他人住宅的。据此，限制人身自由或侵入住宅催收非法债务属于该罪的行为方式\n之一，因此，B 项正确。（3）《刑法》第 293 条之一第（三）项规定：恐吓、\n跟踪、骚扰他人的。据此，恐吓、跟踪、骚扰他人催收非法债务属于该罪的行为\n方式之一，因此，C 项正确。（4）《刑法》第 293 条之一规定的催收非法债务\n行为仅限于暴力、胁迫、限制自由、侵入住宅、恐吓、跟踪、骚扰等非法手段，\n不包括通过诉讼等合法途径主张权利。据此，通过诉讼方式主张高利贷本息不属\n于该罪的行为方式，因此，D 项错误。"},{"id":52,"type":"判断题","question":"陈某精神病发作期间，在甲县汽车站持刀砍伤 5 人、砍死 1 人，甲县公安局决定\n将其送往指定的场所加以监护。","choices":[],"answer":"正确","explanation":"《中华人民共和国人民警察法》第十四条规定，公安机关的人民警察对严\n重危害公共安全或者他人人身安全的精神病人，可以采取保护性约束措施。需要\n送往指定的单位、场所加以监护的，应当报请县级以上人民政府公安机关批准，\n并及时通知其监护人。陈某精神病发作时实施严重危害他人人身安全的行为，甲\n县公安局作为县级以上公安机关，有权决定将其送往指定场所监护，符合法律规\n定，故正确。"},{"id":53,"type":"单选题","question":"15 周岁的李某在当地一名胜古迹的石碑上用小刀刻了“李某到此一游”几个字，\n被当地公安机关处以 100 元罚款，并当场收缴。下列说法正确的是（）。","choices":[{"key":"A","text":"李某不满 16 周岁，应当不予处罚"},{"key":"B","text":"李某的行为应由旅游管理部门处罚"},{"key":"C","text":"当场收缴罚款 100 元不合法"},{"key":"D","text":"不能当场对李某作出处罚"}],"answer":"C","explanation":"《公安机关办理行政案件程序规定》第一百五十七条不满十四周岁的人有\n违法行为的，不予行政处罚，但是应当责令其监护人严加管教，并在不予行政处\n罚决定书中载明。已满十四周岁不满十八周岁的人有违法行为的，从轻或者减轻\n行政处罚。\n第三十七条违法事实确凿，且具有下列情形之一的，人民警察可以当场作出处罚\n决定，有违禁品的，可以当场收缴：\n（一）对违反治安管理行为人或者道路交通违法行为人处二百元以下罚款或者警\n告的；\n（二）出入境边防检查机关对违反出境入境管理行为人处五百元以下罚款或者警\n告的；\n（三）对有其他违法行为的个人处五十元以下罚款或者警告、对单位处一千元以\n下罚款或者警告的；\n（四）法律规定可以当场处罚的其他情形。\n涉及卖淫、嫖娼、赌博、毒品的案件，不适用当场处罚。\n第二百一十四条公安机关作出罚款决定，被处罚人应当自收到行政处罚决定书之\n日起十五日内，到指定的银行缴纳罚款。具有下列情形之一的，公安机关及其办\n案人民警察可以当场收缴罚款，法律另有规定的，从其规定：\n（一）对违反治安管理行为人处五十元以下罚款和对违反交通管理的行人、乘车\n人和非机动车驾驶人处罚款，被处罚人没有异议的；\n（二）对违反治安管理、交通管理以外的违法行为人当场处二十元以下罚款的；\n（三）在边远、水上、交通不便地区、旅客列车上或者口岸，被处罚人向指定银\n行缴纳罚款确有困难，经被处罚人提出的；\n（四）被处罚人在当地没有固定住所，不当场收缴事后难以执行的。\n对具有前款第一项和第三项情形之一的，办案人民警察应当要求被处罚人签名确\n认。\n《治安管理处罚法》第十二条 已满十四周岁不满十八周岁的人违反治安管理\n的，从轻或者减轻处罚；不满十四周岁的人违反治安管理的，不予处罚，但是应\n当责令其监护人严加管教。\n第七十五条 有下列行为之一的，处警告或者五百元以下罚款；情节较重的，处\n五日以上十日以下拘留，并处五百元以上一千元以下罚款：\n（一）刻划、涂污或者以其他方式故意损坏国家保护的文物、名胜古迹的；\n（二）违反国家规定，在文物保护单位附近进行爆破、钻探、挖掘等活动，危及\n文物安全的。"},{"id":54,"type":"多选题","question":"下列情形构成诈骗罪的是（）。","choices":[{"key":"A","text":"甲冒用他人身份办理入网手续并使用移动电话，造成电信资费损失数额较大"},{"key":"B","text":"乙知道他人实施诈骗，为其发布信息提供网络技术支持，情节严重"},{"key":"C","text":"丙以帮被害人的儿子上大学为名，收取被害人 15 万元活动费用后潜逃"},{"key":"D","text":"丁伪造证明材料骗取医疗保险金 2 万元"}],"answer":"A C D","explanation":"1.《刑法》第二百六十六条 【诈骗罪】诈骗公私财物，数额较大的，处\n三年以下有期徒刑、拘役或者管制，并处或者单处罚金；数额巨大或者有其他严\n重情节的，处三年以上十年以下有期徒刑，并处罚金；数额特别巨大或者有其他\n特别严重情节的，处十年以上有期徒刑或者无期徒刑，并处罚金或者没收财产。\n本法另有规定的，依照规定。\n2.《刑法》第二百八十七条之二 【帮助信息网络犯罪活动罪】明知他人利用信\n息网络实施犯罪，为其犯罪提供互联网接入、服务器托管、网络存储、通讯传输\n等技术支持，或者提供广告推广、支付结算等帮助，情节严重的，处三年以下有\n期徒刑或者拘役，并处或者单处罚金。\n单位犯前款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任\n人员，依照第一款的规定处罚。\n有前两款行为，同时构成其他犯罪的，依照处罚较重的规定定罪处罚。"},{"id":55,"type":"判断题","question":"超市保安吴某怀疑某顾客盗窃超市物品，对其进行搜身。对吴某应当按照非法搜\n查身体予以治安管理处罚。","choices":[],"answer":"正确","explanation":"《中华人民共和国治安管理处罚法》第四十七条第三项规定：非法限制他\n人人身自由、非法侵入他人住宅或者非法搜查他人身体的，处十日以上十五日以\n下拘留，并处一千元以上二千元以下罚款；情节较轻的，处五日以上十日以下拘\n留，并处一千元以下罚款。\n据此，超市保安吴某无权对顾客进行搜身，其行为构成非法搜查他人身体，侵犯\n了顾客的人身权利，因此应当予以治安管理处罚。故该判断题正确。"},{"id":56,"type":"单选题","question":"根据《治安管理处罚法》的规定，受到罚款处罚的人应当自收到处罚决定书之日\n起（ ）到指定的银行缴纳罚款。","choices":[{"key":"A","text":"3 日内"},{"key":"B","text":"5 日内"},{"key":"C","text":"10 日内"},{"key":"D","text":"15 日内"}],"answer":"D","explanation":"《治安管理处罚法》第一百二十三条 受到罚款处罚的人应当自收到处罚\n决定书之日起十五日以内，到指定的银行或者通过电子支付系统缴纳罚款。但是，\n有下列情形之一的，人民警察可以当场收缴罚款：\n（一）被处二百元以下罚款，被处罚人对罚款无异议的；\n（二）在边远、水上、交通不便地区，旅客列车上或者口岸，公安机关及其人民\n警察依照本法的规定作出罚款决定后，被处罚人到指定的银行或者通过电子支付\n系统缴纳罚款确有困难，经被处罚人提出的；\n（三）被处罚人在当地没有固定住所，不当场收缴事后难以执行的。"},{"id":57,"type":"多选题","question":"对于非法摘取他人器官的行为，以故意伤害罪或故意杀人罪定罪处罚的有（）。","choices":[{"key":"A","text":"未经本人同意摘取其器官的"},{"key":"B","text":"明知是不满 18 周岁的人而摘取其器官的"},{"key":"C","text":"以威胁等方式强迫他人捐献器官的"},{"key":"D","text":"以利益诱惑欺骗他人捐献器官的"}],"answer":"A B C D","explanation":"《刑法》第二百三十二条 【故意杀人罪】故意杀人的，处死刑、无期徒\n刑或者十年以上有期徒刑；情节较轻的，处三年以上十年以下有期徒刑。\n第二百三十四条 【故意伤害罪】故意伤害他人身体的，处三年以下有期徒刑、\n拘役或者管制。\n犯前款罪，致人重伤的，处三年以上十年以下有期徒刑；致人死亡或者以特别残\n忍手段致人重伤造成严重残疾的，处十年以上有期徒刑、无期徒刑或者死刑。本\n法另有规定的，依照规定。\n第二百三十四条之一 【组织出卖人体器官罪】组织他人出卖人体器官的，处五\n年以下有期徒刑，并处罚金；情节严重的，处五年以上有期徒刑，并处罚金或者\n没收财产。\n未经本人同意摘取其器官，或者摘取不满十八周岁的人的器官，或者强迫、欺骗\n他人捐献器官的，依照本法第二百三十四条、第二百三十二条的规定定罪处罚。\n违背本人生前意愿摘取其尸体器官，或者本人生前未表示同意，违反国家规定，\n违背其近亲属意愿摘取其尸体器官的，依照本法第三百零二条的规定定罪处罚。"},{"id":58,"type":"判断题","question":"违法嫌疑人或者被侵害人对鉴定意见有异议的，可以在 5 日内提出重新鉴定的申\n请，经公安机关审查批准后，进行重新鉴定。","choices":[],"answer":"错误","explanation":"《公安机关办理行政案件程序规定》第九十七条 办案人民警察应当对鉴\n定意见进行审查。\n对经审查作为证据使用的鉴定意见，公安机关应当在收到鉴定意见之日起五日内\n将鉴定意见复印件送达违法嫌疑人和被侵害人。\n医疗机构出具的诊断证明作为公安机关认定人身伤害程度的依据的，应当将诊断\n证明结论书面告知违法嫌疑人和被侵害人。\n违法嫌疑人或者被侵害人对鉴定意见有异议的，可以在收到鉴定意见复印件之日\n起三日内提出重新鉴定的申请，经县级以上公安机关批准后，进行重新鉴定。同\n一行政案件的同一事项重新鉴定以一次为限。\n当事人是否申请重新鉴定，不影响案件的正常办理。\n公安机关认为必要时，也可以直接决定重新鉴定。"},{"id":59,"type":"单选题","question":"不满（）周岁的人违反治安管理的，不予处罚，但是应当责令其监护人严加管教。","choices":[{"key":"A","text":"14"},{"key":"B","text":"16"},{"key":"C","text":"18"},{"key":"D","text":"15"}],"answer":"A","explanation":"《公安机关办理行政案件程序规定》第一百五十七条 不满十四周岁的人\n有违法行为的，不予行政处罚，但是应当责令其监护人严加管教，并在不予行政\n处罚决定书中载明。已满十四周岁不满十八周岁的人有违法行为的，从轻或者减\n轻行政处罚。"},{"id":60,"type":"多选题","question":"某晚，付某潜入陈某家中行窃，被发现后携所窃赃物（价值 2500 余元）逃跑，\n陈某紧追不舍。付某见路旁有一辆未熄火摩托车（价值 5000 元），车主正与人\n交谈，便推倒车主，自己骑上摩托车继续逃跑。3 日后，车主在街上发现自己的\n摩托车和付某，欲将其扭送公安局，付某一拳将车主打伤，后经法医鉴定为轻伤。\n付某的行为构成（）。","choices":[{"key":"A","text":"抢劫罪"},{"key":"B","text":"抢夺罪"},{"key":"C","text":"盗窃罪"},{"key":"D","text":"故意伤害罪"}],"answer":"BCD","explanation":"《刑法》第二百六十三条 【抢劫罪】以暴力、胁迫或者其他方法抢劫公\n私财物的，处三年以上十年以下有期徒刑，并处罚金；有下列情形之一的，处十\n年以上有期徒刑、无期徒刑或者死刑，并处罚金或者没收财产：\n（一）入户抢劫的；\n（二）在公共交通工具上抢劫的；\n（三）抢劫银行或者其他金融机构的；\n（四）多次抢劫或者抢劫数额巨大的；\n（五）抢劫致人重伤、死亡的；\n（六）冒充军警人员抢劫的；\n（七）持枪抢劫的；\n（八）抢劫军用物资或者抢险、救灾、救济物资的。"},{"id":61,"type":"判断题","question":"对违法嫌疑人照片进行辨认的，不得少于 10 人的照片。","choices":[],"answer":"正确","explanation":"《公安机关办理行政案件程序规定》第一百零四条 辨认时，应当将辨认\n对象混杂在特征相类似的其他对象中，不得给辨认人任何暗示。\n辨认违法嫌疑人时，被辨认的人数不得少于七人；对违法嫌疑人照片进行辨认的，\n不得少于十人的照片。\n辨认每一件物品时，混杂的同类物品不得少于五件。\n同一辨认人对与同一案件有关的辨认对象进行多组辨认的，不得重复使用陪衬照\n片或者陪衬人。"},{"id":62,"type":"单选题","question":"精神病人违反治安管理不予处罚的，公安机关应当责令（）严加看管和治疗。","choices":[{"key":"A","text":"居（村）民居委会"},{"key":"B","text":"精神病医院"},{"key":"C","text":"其监护人"},{"key":"D","text":"社区"}],"answer":"C","explanation":"《公安机关办理行政案件程序规定》第一百五十八条 精神病人在不能辨\n认或者不能控制自己行为时有违法行为的，不予行政处罚，但应当责令其监护人\n严加看管和治疗，并在不予行政处罚决定书中载明。间歇性精神病人在精神正常\n时有违法行为的，应当给予行政处罚。尚未完全丧失辨认或者控制自己行为能力\n的精神病人有违法行为的，应当予以行政处罚，但可以从轻或者减轻行政处罚。"},{"id":63,"type":"多选题","question":"谢某从人贩子手中收买精神病妇女王某为妻，为防止王某逃走，谢某将其锁在屋\n中 1 个月，其间多次与其发生性关系。谢某的行为构成（）。","choices":[{"key":"A","text":"强奸罪"},{"key":"B","text":"非法拘禁罪"},{"key":"C","text":"收买被拐卖的妇女罪"},{"key":"D","text":"侮辱妇女罪"}],"answer":"ABC","explanation":"《刑法》第二百四十一条 【收买被拐卖的妇女、儿童罪】收买被拐卖的\n妇女、儿童的，处三年以下有期徒刑、拘役或者管制。\n收买被拐卖的妇女，强行与其发生性关系的，依照本法第二百三十六条的规定定\n罪处罚。\n收买被拐卖的妇女、儿童，非法剥夺、限制其人身自由或者有伤害、侮辱等犯罪\n行为的，依照本法的有关规定定罪处罚。\n收买被拐卖的妇女、儿童，并有第二款、第三款规定的犯罪行为的，依照数罪并\n罚的规定处罚。\n收买被拐卖的妇女、儿童又出卖的，依照本法第二百四十条的规定定罪处罚。\n收买被拐卖的妇女、儿童，对被买儿童没有虐待行为，不阻碍对其进行解救的，\n可以从轻处罚；按照被买妇女的意愿，不阻碍其返回原居住地的，可以从轻或者\n减轻处罚。\n第二百三十六条 【强奸罪】以暴力、胁迫或者其他手段强奸妇女的，处三年以\n上十年以下有期徒刑。\n奸淫不满十四周岁的幼女的，以强奸论，从重处罚。\n强奸妇女、奸淫幼女，有下列情形之一的，处十年以上有期徒刑、无期徒刑或者\n死刑：\n（一）强奸妇女、奸淫幼女情节恶劣的；\n（二）强奸妇女、奸淫幼女多人的；\n（三）在公共场所当众强奸妇女的；\n（四）二人以上轮奸的；\n（五）致使被害人重伤、死亡或者造成其他严重后果的。"},{"id":64,"type":"判断题","question":"对违反边防出境入境管理法律、法规和规章的个人处以 2000 元以上罚款，公安\n机关在作出处罚决定之前，应当告知违法嫌疑人有要求举行听证的权利。","choices":[],"answer":"错误","explanation":"《公安机关办理行政案件程序规定》第一百二十三条 在作出下列行政\n处罚决定之前，应当告知违法嫌疑人有要求举行听证的权利：\n（一）责令停产停业；\n（二）吊销许可证或者执照；\n（三）较大数额罚款；\n（四）法律、法规和规章规定违法嫌疑人可以要求举行听证的其他情形。\n前款第三项所称“较大数额罚款”，是指对个人处以二千元以上罚款，对单位处\n以一万元以上罚款，对违反边防出境入境管理法律、法规和规章的个人处以六千\n元以上罚款。对依据地方性法规或者地方政府规章作出的罚款处罚，适用听证的\n罚款数额按照地方规定执行。"},{"id":65,"type":"单选题","question":"公安机关作出（）以及处（）的治安管理处罚决定前，应当告知违反治安管理行\n为人有权要求举行听证；违反治安管理行为人要求听证的，公安机关应当及时依\n法举行听证。","choices":[{"key":"A","text":"吊销许可证 500 元以上罚款"},{"key":"B","text":"5 日以上行政拘留 2000 元以上罚款"},{"key":"C","text":"10 日以上行政拘留 500 元以上罚款"},{"key":"D","text":"吊销许可证 2000 元以上罚款"}],"answer":"D","explanation":"《公安机关办理行政案件程序规定》第一百二十三条在作出下列行政处罚\n决定之前，应当告知违法嫌疑人有要求举行听证的权利：\n（一）责令停产停业；\n（二）吊销许可证或者执照；\n（三）较大数额罚款；\n（四）法律、法规和规章规定违法嫌疑人可以要求举行听证的其他情形。\n前款第三项所称“较大数额罚款”，是指对个人处以二千元以上罚款，对单位处\n以一万元以上罚款，对违反边防出境入境管理法律、法规和规章的个人处以六千\n元以上罚款。对依据地方性法规或者地方政府规章作出的罚款处罚，适用听证的\n罚款数额按照地方规定执行。"},{"id":66,"type":"多选题","question":"下列情形构成诽谤罪的是（）。","choices":[{"key":"A","text":"张某捏造诽谤他人的事实并在互联网上发布，该信息被浏览达 3500 次"},{"key":"B","text":"王某捏造诽谤他人的事实并在互联网上发布，该信息被转发 600 次"},{"key":"C","text":"雷某因诽谤被处行政拘留 5 日后，2 年内该人又利用信息网络诽谤他人"},{"key":"D","text":"杜某捏造诽谤他人的事实并在信息网络发布，造成了被诽谤人的父亲精神失\n常"}],"answer":"BCD","explanation":"1《刑法》第二百四十六条 【侮辱罪】【诽谤罪】以暴力或者其他方法\n公然侮辱他人或者捏造事实诽谤他人，情节严重的，处三年以下有期徒刑、拘役、\n管制或者剥夺政治权利。\n前款罪，告诉的才处理，但是严重危害社会秩序和国家利益的除外。\n通过信息网络实施第一款规定的行为，被害人向人民法院告诉，但提供证据确有\n困难的，人民法院可以要求公安机关提供协助。\n《最高人民法院、最高人民检察院关于办理利用信息网络实施诽谤等刑事案件适\n用法律若干问题的解释》\n第一条 具有下列情形之一的，应当认定为刑法第二百四十六条第一款规定的\n“捏造事实诽谤他人”：\n（一）捏造损害他人名誉的事实，在信息网络上散布，或者组织、指使人员在信\n息网络上散布的；\n（二）将信息网络上涉及他人的原始信息内容篡改为损害他人名誉的事实，在信\n息网络上散布，或者组织、指使人员在信息网络上散布的；\n明知是捏造的损害他人名誉的事实，在信息网络上散布，情节恶劣的，以“捏造\n事实诽谤他人”论。\n第二条 利用信息网络诽谤他人，具有下列情形之一的，应当认定为刑法第二百\n四十六条第一款规定的“情节严重”：\n（一）同一诽谤信息实际被点击、浏览次数达到五千次以上，或者被转发次数达\n到五百次以上的；\n（二）造成被害人或者其近亲属精神失常、自残、自杀等严重后果的；\n（三）二年内曾因诽谤受过行政处罚，又诽谤他人的；\n（四）其他情节严重的情形。\n2.A 项是被浏览达 3500 次，未达实际被点击、浏览次数达到五千次以上的标准。"},{"id":67,"type":"判断题","question":"行为人冒充治安联防队员“抓赌”、“抓嫖”、没收赌资或者罚款的行为，构成\n犯罪的，以敲诈勒索罪定罪处罚。","choices":[],"answer":"正确","explanation":"根据《最高人民法院关于审理抢劫、抢夺刑事案件适用法律若干问题的意\n见》九、关于抢劫罪与相似犯罪的界限\n冒充正在执行公务的人民警察、联防人员，以抓卖淫嫖娼、赌博等违法行为为名\n非法占有财物的行为定性\n行为人冒充正在执行公务的人民警察“抓赌”、“抓嫖”，没收赌资或者罚款的\n行为，构成犯罪的，以招摇撞骗罪从重处罚；在实施上述行为中使用暴力或者暴\n力威胁的，以抢劫罪定罪处罚。行为人冒充治安联防队员“抓赌”、“抓嫖”、\n没收赌资或者罚款的行为，构成犯罪的，以敲诈勒索罪定罪处罚；在实施上述行\n为中使用暴力或者暴力威胁的，以抢劫罪定罪处罚。"},{"id":68,"type":"单选题","question":"下列情形中，不适用治安调解的有（）。","choices":[{"key":"A","text":"发送信息干扰他人正常生活"},{"key":"B","text":"偷开他人机动车"},{"key":"C","text":"雇凶伤害他人"},{"key":"D","text":"饲养动物干扰他人正常生活"}],"answer":"C","explanation":"《公安机关办理行政案件程序规定》第一百七十九条 具有下列情形之一\n的，不适用调解处理：\n（一）雇凶伤害他人的；\n（二）结伙斗殴或者其他寻衅滋事的；\n（三）多次实施违反治安管理行为的；\n（四）当事人明确表示不愿意调解处理的；\n（五）当事人在治安调解过程中又针对对方实施违反治安管理行为的；\n（六）调解过程中，违法嫌疑人逃跑的；\n（七）其他不宜调解处理的。"},{"id":69,"type":"多选题","question":"关于“多次抢劫”，下列说法正确的是（）。","choices":[{"key":"A","text":"对于“多次”的认定，应以行为人实施的每一次抢劫行为均已构成犯罪为前\n提"},{"key":"B","text":"对于行为人基于一个犯意实施犯罪的，如在同一地点同时对在场的多人实施\n抢劫的不能认定为多次抢劫"},{"key":"C","text":"在同一地点实施连续抢劫犯罪的或在同一地点连续地对途经此地的多人进行\n抢劫的，可以认定为多次抢劫"},{"key":"D","text":"在一次犯罪中对一栋居民楼房中的几户居民连续实施入户抢劫的，可以认定\n为多次抢劫"}],"answer":"AB","explanation":"最高人民法院印发《关于审理抢劫、抢夺刑事案件适用法律若干问题的意\n见》的通知（2005 年 6 月 8 日 法发[2005]8 号）\n三、关于“多次抢劫”的认定\n刑法第二百六十三条第（四）项中的“多次抢劫”是指抢劫三次以上。\n对于“多次”的认定，应以行为人实施的每一次抢劫行为均已构成犯罪为前提，\n综合考虑犯罪故意的产生、犯罪行为实施的时间、地点等因素，客观分析、认定。\n对于行为人基于一个犯意实施犯罪的，如在同一地点同时对在场的多人实施抢劫\n的；或基于同一犯意在同一地点实施连续抢劫犯罪的，如在同一地点连续地对途\n经此地的多人进行抢劫的；或在一次犯罪中对一栋居民楼房中的几户居民连续实\n施入户抢劫的，一般应认定为一次犯罪。"},{"id":70,"type":"判断题","question":"在自然灾害和突发事件中，以暴力、威胁方法阻碍医务工作人员依法履行职责的，\n构成妨害公务罪。","choices":[],"answer":"错误","explanation":"《刑法》第二百七十七条【妨害公务罪】以暴力、威胁方法阻碍国家机关\n工作人员依法执行职务的，处三年以下有期徒刑、拘役、管制或者罚金。\n以暴力、威胁方法阻碍全国人民代表大会和地方各级人民代表大会代表依法执行\n代表职务的，依照前款的规定处罚。\n在自然灾害和突发事件中，以暴力、威胁方法阻碍红十字会工作人员依法履行职\n责的，依照第一款的规定处罚。\n故意阻碍国家安全机关、公安机关依法执行国家安全工作任务，未使用暴力、威\n胁方法，造成严重后果的，依照第一款的规定处罚。"},{"id":71,"type":"单选题","question":"甲在某超市内盗窃收银台内的现金 300 元，被公安机关抓获后，公安机关应当将\n300 元钱（）退还被侵害人。","choices":[{"key":"A","text":"扣押"},{"key":"B","text":"收缴"},{"key":"C","text":"追缴"},{"key":"D","text":"没收"}],"answer":"C","explanation":"《治安管理处罚法》第十一条 办理治安案件所查获的毒品、淫秽物品等\n违禁品，赌具、赌资，吸食、注射毒品的用具以及直接用于实施违反治安管理行\n为的本人所有的工具，应当收缴，按照规定处理。\n违反治安管理所得的财物，追缴退还被侵害人；没有被侵害人的，登记造册，公\n开拍卖或者按照国家有关规定处理，所得款项上缴国库。"},{"id":72,"type":"多选题","question":"下列行为中构成盗窃罪的有（）。","choices":[{"key":"A","text":"王某在商场盗窃他人信用卡之后，随即用该卡在商场购买了价值 6000 元的手\n表"},{"key":"B","text":"李某在商场试衣间试穿大衣是否合适的时候，趁售货员与别的顾客聊天的机\n会，将价值 6000 元的大衣穿走"},{"key":"C","text":"张某在商店购买首饰的时候，趁售货员不注意，将自己准备好的假首饰与从\n售货员那里拿来的价值 8000 元的真首饰调换，并谎称带的钱不够，将假首饰退\n给售货员"},{"key":"D","text":"郑某潜入他人家中，将 50 克海洛因拿走"}],"answer":"ABCD","explanation":"《刑法》第二百六十四条 【盗窃罪】盗窃公私财物，数额较大的，或者\n多次盗窃、入户盗窃、携带凶器盗窃、扒窃的，处三年以下有期徒刑、拘役或者\n管制，并处或者单处罚金；数额巨大或者有其他严重情节的，处三年以上十年以\n下有期徒刑，并处罚金；数额特别巨大或者有其他特别严重情节的，处十年以上\n有期徒刑或者无期徒刑，并处罚金或者没收财产。\n《最高人民法院最高人民检察院关于办理盗窃刑事案件适用法律若干问题的解\n释》第一条 盗窃公私财物价值一千元至三千元以上、三万元至十万元以上、三\n十万元至五十万元以上的，应当分别认定为刑法第二百六十四条规定的“数额较\n大”、“数额巨大”、“数额特别巨大”。\n各省、自治区、直辖市高级人民法院、人民检察院可以根据本地区经济发展状况，\n并考虑社会治安状况，在前款规定的数额幅度内，确定本地区执行的具体数额标\n准，报最高人民法院、最高人民检察院批准。\n在跨地区运行的公共交通工具上盗窃，盗窃地点无法查证的，盗窃数额是否达到\n“数额较大”、“数额巨大”、“数额特别巨大”，应当根据受理案件所在地省、\n自治区、直辖市高级人民法院、人民检察院确定的有关数额标准认定。\n盗窃毒品等违禁品，应当按照盗窃罪处理的，根据情节轻重量刑。"},{"id":73,"type":"判断题","question":"甲伪造国家机关公文用于实施诈骗活动，分别构成伪造国家机关公文罪和诈骗\n罪，应数罪并罚。","choices":[],"answer":"错误","explanation":"以伪造国家机关公文为手段，目的是为了诈骗，在刑法理论上称之为牵连\n犯，择一重罪处罚。"},{"id":74,"type":"单选题","question":"下列关于办理治安案件中对扣押物品的处理表述错误的是（）。","choices":[{"key":"A","text":"对扣押的物品，应当妥善保管，不得挪作他用"},{"key":"B","text":"对不宜长期保存的物品，按照有关规定处理"},{"key":"C","text":"经查明与案件无关的物品，应当及时退还"},{"key":"D","text":"经核实属于他人合法财产的，应当登记后 1 个月内退还"}],"answer":"D","explanation":"《公安机关办理行政案件程序规定》第一百八十七条 对于依法扣押、扣\n留、查封、抽样取证、追缴、收缴的财物以及由公安机关负责保管的先行登记保\n存的财物，公安机关应当妥善保管，不得使用、挪用、调换或者损毁。造成损失\n的，应当承担赔偿责任。\n涉案财物的保管费用由作出决定的公安机关承担。\n第一百九十六条 对收缴和追缴的财物，经原决定机关负责人批准，按照下列规\n定分别处理：\n（一）属于被侵害人或者善意第三人的合法财物，应当及时返还；\n（二）没有被侵害人的，登记造册，按照规定上缴国库或者依法变卖、拍卖后，\n将所得款项上缴国库；\n（三）违禁品、没有价值的物品，或者价值轻微，无法变卖、拍卖的物品，统一\n登记造册后销毁；\n（四）对无法变卖或者拍卖的危险物品，由县级以上公安机关主管部门组织销毁\n或者交有关厂家回收。"},{"id":75,"type":"多选题","question":"下列行为中构成盗窃罪的有（）。","choices":[{"key":"A","text":"盗窃增值税专用发票"},{"key":"B","text":"盗窃可以用于骗取抵扣税款的发票"},{"key":"C","text":"盗窃信用卡并使用"},{"key":"D","text":"携带凶器盗窃"}],"answer":"ABCD","explanation":"《刑法》第二百六十四条 【盗窃罪】盗窃公私财物，数额较大的，或者\n多次盗窃、入户盗窃、携带凶器盗窃、扒窃的，处三年以下有期徒刑、拘役或者\n管制，并处或者单处罚金；数额巨大或者有其他严重情节的，处三年以上十年以\n下有期徒刑，并处罚金；数额特别巨大或者有其他特别严重情节的，处十年以上\n有期徒刑或者无期徒刑，并处罚金或者没收财产。\n第二百一十条 【盗窃罪】盗窃增值税专用发票或者可以用于骗取出口退税、抵\n扣税款的其他发票的，依照本法第二百六十四条的规定定罪处罚。\n【诈骗罪】使用欺骗手段骗取增值税专用发票或者可以用于骗取出口退税、抵扣\n税款的其他发票的，依照本法第二百六十六条的规定定罪处罚。\n第一百九十六条 【信用卡诈骗罪】有下列情形之一，进行信用卡诈骗活动，数\n额较大的，处五年以下有期徒刑或者拘役，并处二万元以上二十万元以下罚金；\n数额巨大或者有其他严重情节的，处五年以上十年以下有期徒刑，并处五万元以\n上五十万元以下罚金；数额特别巨大或者有其他特别严重情节的，处十年以上有\n期徒刑或者无期徒刑，并处五万元以上五十万元以下罚金或者没收财产：\n（一）使用伪造的信用卡，或者使用以虚假的身份证明骗领的信用卡的；\n（二）使用作废的信用卡的；\n（三）冒用他人信用卡的；\n（四）恶意透支的。\n前款所称恶意透支，是指持卡人以非法占有为目的，超过规定限额或者规定期限\n透支，并且经发卡银行催收后仍不归还的行为。\n盗窃信用卡并使用的，依照本法第二百六十四条的规定定罪处罚。"},{"id":76,"type":"判断题","question":"未经国家烟草专卖局批准，经营香烟，营利 3 万元，构成非法经营罪。","choices":[],"answer":"正确","explanation":"《刑法》第二百二十五条【非法经营罪】违反国家规定，有下列非法经营\n行为之一，扰乱市场秩序，情节严重的，处五年以下有期徒刑或者拘役，并处或\n者单处违法所得一倍以上五倍以下罚金；情节特别严重的，处五年以上有期徒刑，\n并处违法所得一倍以上五倍以下罚金或者没收财产：\n（一）未经许可经营法律、行政法规规定的专营、专卖物品或者其他限制买卖的\n物品的；\n（二）买卖进出口许可证、进出口原产地证明以及其他法律、行政法规规定的经\n营许可证或者批准文件的；\n（三）未经国家有关主管部门批准非法经营证券、期货、保险业务的，或者非法\n从事资金支付结算业务的；\n（四）其他严重扰乱市场秩序的非法经营行为。\n《最高人民检察院、公安部关于公安机关管辖的刑事案件立案追诉标准的规定\n（二）》\n第七十一条 〔非法经营案（刑法第二百二十五条）〕违反国家规定，进行非法\n经营活动，扰乱市场秩序，涉嫌下列情形之一的，应予立案追诉：\n（一）违反国家烟草专卖管理法律法规，未经烟草专卖行政主管部门许可，无烟\n草专卖生产企业许可证、烟草专卖批发企业许可证、特种烟草专卖经营企业许可\n证、烟草专卖零售许可证等许可证明，非法经营烟草专卖品，具有下列情形之一\n的：\n1．非法经营数额在五万元以上，或者违法所得数额在二万元以上的；\n2．非法经营卷烟二十万支以上的；\n3．三年内因非法经营烟草专卖品受过二次以上行政处罚，又非法经营烟草专卖\n品且数额在三万元以上的。"},{"id":77,"type":"单选题","question":"违反治安管理行为在多长时间内没有被公安机关发现的，不再处罚？（ ）","choices":[{"key":"A","text":"3 个月"},{"key":"B","text":"6 个月"},{"key":"C","text":"1 年"},{"key":"D","text":"2 年"}],"answer":"B","explanation":"《中华人民共和国治安管理处罚法》第二十五条 违反治安管理行为在六\n个月以内没有被公安机关发现的，不再处罚。\n前款规定的期限，从违反治安管理行为发生之日起计算；违反治安管理行为有连\n续或者继续状态的，从行为终了之日起计算。"},{"id":78,"type":"多选题","question":"关于“携带凶器抢夺”的认定，以下说法正确的是（）。","choices":[{"key":"A","text":"“携带凶器抢夺”，是指行为人随身携带枪支、爆炸物、管制刀具等国家禁\n止个人携带的器械进行抢夺"},{"key":"B","text":"为了实施犯罪而携带其他器械进行抢夺的，可以认定为“携带凶器抢夺”"},{"key":"C","text":"行为人随身携带国家禁止个人携带的器械以外的其他器械抢夺，但有证据证\n明该器械确实不是为了实施犯罪准备的，不以抢劫罪定罪处罚"},{"key":"D","text":"行为人将随身携带的凶器有意加以显示、能为被害人察觉到的，以抢劫罪定\n罪处罚"}],"answer":"ABCD","explanation":"最高人民法院印发《关于审理抢劫、抢夺刑事案件适用法律若干问题的意\n见》的通知（2005 年 6 月 8 日法发[2005]8 号）\n四、关于“携带凶器抢夺”的认定\n《抢劫解释》第六条规定，“携带凶器抢夺”，是指行为人随身携带枪支、爆炸\n物、管制刀具等国家禁止个人携带的器械进行抢夺或者为了实施犯罪而携带其他\n器械进行抢夺的行为。行为人随身携带国家禁止个人携带的器械以外的其他器械\n抢夺，但有证据证明该器械确实不是为了实施犯罪准备的，不以抢劫罪定罪；行\n为人将随身携带凶器有意加以显示、能为被害人察觉到的，直接适用刑法第二百\n六十三条的规定定罪处罚；行为人携带凶器抢夺后，在逃跑过程中为窝藏赃物、\n抗拒抓捕或者毁灭罪证而当场使用暴力或者以暴力相威胁的，适用刑法第二百六\n十七条第二款的规定定罪处罚。"},{"id":79,"type":"单选题","question":"对决定给予行政拘留处罚的人，在处罚前已经因同一违法事实采取强制措施限制\n人身自由的时间，应当折抵。限制人身自由 1 日，折抵行政拘留（）。","choices":[{"key":"A","text":"半日"},{"key":"B","text":"1 日"},{"key":"C","text":"3 日"},{"key":"D","text":"2 日"}],"answer":"B","explanation":"《公安机关办理行政案件程序规定》第一百六十三条对决定给予行政拘留处罚的\n人，在处罚前因同一行为已经被采取强制措施限制人身自由的时间应当折抵。限\n制人身自由一日，折抵执行行政拘留一日。询问查证、继续盘问和采取约束措施\n的时间不予折抵。被采取强制措施限制人身自由的时间超过决定的行政拘留期限\n的，行政拘留决定不再执行。"},{"id":80,"type":"多选题","question":"下列行为中构成盗窃罪的有（）。","choices":[{"key":"A","text":"盗窃增值税专用发票"},{"key":"B","text":"盗窃可以用于骗取抵扣税款的发票"},{"key":"C","text":"盗窃信用卡并使用"},{"key":"D","text":"携带凶器盗窃"}],"answer":"ABCD","explanation":"《刑法》第二百六十四条 【盗窃罪】盗窃公私财物，数额较大的，或者多次盗\n窃、入户盗窃、携带凶器盗窃、扒窃的，处三年以下有期徒刑、拘役或者管制，\n并处或者单处罚金；数额巨大或者有其他严重情节的，处三年以上十年以下有期\n徒刑，并处罚金；数额特别巨大或者有其他特别严重情节的，处十年以上有期徒\n刑或者无期徒刑，并处罚金或者没收财产。\n第二百一十条 【盗窃罪】盗窃增值税专用发票或者可以用于骗取出口退税、抵\n扣税款的其他发票的，依照本法第二百六十四条的规定定罪处罚。\n【诈骗罪】使用欺骗手段骗取增值税专用发票或者可以用于骗取出口退税、抵扣\n税款的其他发票的，依照本法第二百六十六条的规定定罪处罚。\n第一百九十六条 【信用卡诈骗罪】有下列情形之一，进行信用卡诈骗活动，数\n额较大的，处五年以下有期徒刑或者拘役，并处二万元以上二十万元以下罚金；\n数额巨大或者有其他严重情节的，处五年以上十年以下有期徒刑，并处五万元以\n上五十万元以下罚金；数额特别巨大或者有其他特别严重情节的，处十年以上有\n期徒刑或者无期徒刑，并处五万元以上五十万元以下罚金或者没收财产：\n（一）使用伪造的信用卡，或者使用以虚假的身份证明骗领的信用卡的；\n（二）使用作废的信用卡的；\n（三）冒用他人信用卡的；\n（四）恶意透支的。\n前款所称恶意透支，是指持卡人以非法占有为目的，超过规定限额或者规定期限\n透支，并且经发卡银行催收后仍不归还的行为。\n盗窃信用卡并使用的，依照本法第二百六十四条的规定定罪处罚。"},{"id":81,"type":"判断题","question":"李某和蒋某共同实施盗窃违法行为，李某于 1 月 10 日被公安机关抓获，蒋某于\n同年 12 月 10 日被公安机关抓获。由于已过追究时效，对蒋某应不予处罚。","choices":[],"answer":"错误","explanation":"《公安机关办理行政案件程序规定》第一百五十四条 违反治安管理行为\n在六个月内没有被公安机关发现，其他违法行为在二年内没有被公安机关发现\n的，不再给予行政处罚。\n前款规定的期限，从违法行为发生之日起计算，违法行为有连续、继续或者持续\n状态的，从行为终了之日起计算。\n被侵害人在违法行为追究时效内向公安机关控告，公安机关应当受理而不受理\n的，不受本条第一款追究时效的限制。"},{"id":82,"type":"单选题","question":"治安案件调查结束后，对确有依法应当给予治安管理处罚的违法行为的，公安机\n关应当根据（），作出处罚决定。","choices":[{"key":"A","text":"案件性质"},{"key":"B","text":"情节轻重及具体情况"},{"key":"C","text":"案件后果及相关因素"},{"key":"D","text":"违反治安管理行为人的态度、表现"}],"answer":"B","explanation":"《中华人民共和国治安管理处罚法》第一百一十三条 治安案件调查结束后，公\n安机关应当根据不同情况，分别作出以下处理：\n（一）确有依法应当给予治安管理处罚的违法行为的，根据情节轻重及具体情况，\n作出处罚决定；\n（二）依法不予处罚的，或者违法事实不能成立的，作出不予处罚决定；\n（三）违法行为已涉嫌犯罪的，移送有关主管机关依法追究刑事责任；\n（四）发现违反治安管理行为人有其他违法行为的，在对违反治安管理行为作出\n处罚决定的同时，通知或者移送有关主管机关处理。\n对情节复杂或者重大违法行为给予治安管理处罚，公安机关负责人应当集体讨论\n决定。"},{"id":83,"type":"判断题","question":"《中华人民共和国反间谍法》规定，公民因协助反间谍工作，本人或者其近亲属\n的人身安全面临危险的，只能向公安机关请求予以保护。","choices":[],"answer":"错误","explanation":"《中华人民共和国反间谍法》第四十六条 国家安全机关工作人员因执行任务，\n或者个人因协助执行反间谍工作任务，本人或者其近亲属的人身安全受到威胁\n时，国家安全机关应当会同有关部门依法采取必要措施，予以保护、营救。\n个人因支持、协助反间谍工作，本人或者其近亲属的人身安全面临危险的，可以\n向国家安全机关请求予以保护。国家安全机关应当会同有关部门依法采取保护措\n施。\n个人和组织因支持、协助反间谍工作导致财产损失的，根据国家有关规定给予补\n偿。"},{"id":84,"type":"单选题","question":"下列哪种治安管理处罚可以由公安派出所决定？（ ）","choices":[{"key":"A","text":"行政拘留"},{"key":"B","text":"吊销公安机关发放的许可证"},{"key":"C","text":"1500 元罚款"},{"key":"D","text":"警告"}],"answer":"D","explanation":"《中华人民共和国治安管理处罚法》第一百零九条 治安管理处罚由县级以上地\n方人民政府公安机关决定；其中警告、一千元以下的罚款，可以由公安派出所决\n定。"},{"id":85,"type":"多选题","question":"诈骗公私财物虽已达到“数额较大”的标准，但在一审宣判前全部退赃、退赔，\n且行为人认罪、悔罪的，对其可以（）。","choices":[{"key":"A","text":"不起诉"},{"key":"B","text":"免予刑事处罚"},{"key":"C","text":"减轻处罚"},{"key":"D","text":"从轻或减轻处罚"}],"answer":"AB","explanation":"《刑法》第二百六十六条 【诈骗罪】诈骗公私财物，数额较大的，处三年以下\n有期徒刑、拘役或者管制，并处或者单处罚金；数额巨大或者有其他严重情节的，\n处三年以上十年以下有期徒刑，并处罚金；数额特别巨大或者有其他特别严重情\n节的，处十年以上有期徒刑或者无期徒刑，并处罚金或者没收财产。本法另有规\n定的，依照规定。\n《最高人民法院、最高人民检察院关于办理诈骗刑事案件具体应用法律若干问题\n的解释》\n第三条 诈骗公私财物虽已达到本解释第一条规定的“数额较大”的标准，但具\n有下列情形之一，且行为人认罪、悔罪的，可以根据刑法第三十七条、刑事诉讼\n法第一百四十二条的规定不起诉或者免予刑事处罚：\n（一）具有法定从宽处罚情节的；\n（二）一审宣判前全部退赃、退赔的；\n（三）没有参与分赃或者获赃较少且不是主犯的；\n（四）被害人谅解的；\n（五）其他情节轻微、危害不大的。"},{"id":86,"type":"判断题","question":"国家秘密的保密期限，除另有规定外，绝密级不超过 30 年，机密级不超过 20\n年，秘密级不超过 10 年。","choices":[],"answer":"正确","explanation":"《中华人民共和国保守国家秘密法》第二十条 国家秘密的保密期限，应当根据\n事项的性质和特点，按照维护国家安全和利益的需要，限定在必要的期限内；不\n能确定期限的，应当确定解密的条件。\n国家秘密的保密期限，除另有规定外，绝密级不超过三十年，机密级不超过二十\n年，秘密级不超过十年。\n机关、单位应当根据工作需要，确定具体的保密期限、解密时间或者解密条件。\n机关、单位对在决定和处理有关事项工作过程中确定需要保密的事项，根据工作\n需要决定公开的，正式公布时即视为解密。"},{"id":87,"type":"单选题","question":"治安管理处罚的程序，本法没有规定的，适用下列哪部法律的有关规定？（ ）","choices":[{"key":"A","text":"《中华人民共和国行政复议法》"},{"key":"B","text":"《中华人民共和国行政处罚法》"},{"key":"C","text":"《中华人民共和国行政诉讼法》"},{"key":"D","text":"《中华人民共和国行政许可法》"}],"answer":"B","explanation":"《中华人民共和国治安管理处罚法》第四条 治安管理处罚的程序，适用本法的\n规定；本法没有规定的，适用《中华人民共和国行政处罚法》、《中华人民共和\n国行政强制法》的有关规定。"},{"id":88,"type":"多选题","question":"下列有关职务侵占罪的表述，正确的是（）。","choices":[{"key":"A","text":"本罪的主体为特殊主体，即公司、企业或其他单位的人员，且这些人员不属\n于国家工作人员"},{"key":"B","text":"本罪在客观方面可以采用侵吞、盗窃、骗取等各种手段"},{"key":"C","text":"国有单位委派到非国有单位的从事公务的人员实施侵占行为的，不以本罪论"},{"key":"D","text":"主观上具有将本单位财物非法占为己有的目的"}],"answer":"ABCD","explanation":"《刑法》第二百七十一条 【职务侵占罪】公司、企业或者其他单位的工作人员，\n利用职务上的便利，将本单位财物非法占为己有，数额较大的，处三年以下有期\n徒刑或者拘役，并处罚金；数额巨大的，处三年以上十年以下有期徒刑，并处罚\n金；数额特别巨大的，处十年以上有期徒刑或者无期徒刑，并处罚金。\n国有公司、企业或者其他国有单位中从事公务的人员和国有公司、企业或者其他\n国有单位委派到非国有公司、企业以及其他单位从事公务的人员有前款行为的，\n依照本法第三百八十二条、第三百八十三条的规定定罪处罚。\n综上，职务侵占罪的核心构成要件可综合理解为：主体是公司、企业等单位的非\n国家工作人员；客观上可通过侵吞、盗窃、骗取等多种手段，利用职务便利侵占\n本单位财物；国有单位委派到非国有单位从事公务的人员，因其属于国家工作人\n员，实施此类行为不构成本罪；主观上需有将单位财物非法占为己有的故意。题\n目中 A、B、C、D 四个选项分别对应了上述主体、客观手段、特殊主体认定及主\n观目的的核心要点，均符合职务侵占罪的构成特征，故全选。"},{"id":89,"type":"判断题","question":"关系国家安全、国民经济命脉、重要民生、重大公共利益等数据属于重要数据，\n实行与一般数据同等的管理制度。","choices":[],"answer":"错误","explanation":"《中华人民共和国数据安全法》第二十一条明确规定，国家建立数据分类分级保\n护制度，根据数据在经济社会发展中的重要程度，以及一旦遭到篡改、破坏、泄\n露或者非法获取、非法利用，对国家安全、公共利益或者个人、组织合法权益造\n成的危害程度，对数据实行分类分级保护。关系国家安全、国民经济命脉、重要\n民生、重大公共利益等数据属于国家核心数据，实行更加严格的管理制度。"},{"id":90,"type":"单选题","question":"根据《中华人民共和国国家安全法》，每年的（）为全民国家安全教育日。","choices":[{"key":"A","text":"4 月 15 日"},{"key":"B","text":"5 月 12 日"},{"key":"C","text":"9 月 3 日"},{"key":"D","text":"12 月 4 日"}],"answer":"A","explanation":"《中华人民共和国国家安全法》第十四条规定，每年 4 月 15 日为全民国家安全\n教育日。其余选项中，5 月 12 日为全国防灾减灾日，9 月 3 日为中国人民抗日战\n争胜利纪念日，12 月 4 日为国家宪法日。"},{"id":91,"type":"多选题","question":"下列行为应以职务侵占罪论处的是（）。","choices":[{"key":"A","text":"甲系某村民小组的组长，利用职务上的便利，将村民小组集体财产非法据为\n己有，数额较大"},{"key":"B","text":"乙为村委会主任，利用协助乡政府管理和发放救灾款物之机，将数额较大救\n灾款非法据为己有"},{"key":"C","text":"丙是某国有控股公司部门经理，利用职务上的便利，将本单位数额较大的公\n款非法据为己有"},{"key":"D","text":"丁与某私营企业的部门经理李某内外勾结，利用李某职务上的便利，共同将\n该单位数额较大的资金非法据为己有"}],"answer":"ACD","explanation":"1.《刑法》第二百七十一条 【职务侵占罪】公司、企业或者其他单位的人员，\n利用职务上的便利，将本单位财物非法占为己有，数额较大的，处五年以下有期\n徒刑或者拘役；数额巨大的，处五年以上有期徒刑，可以并处没收财产。\n国有公司、企业或者其他国有单位中从事公务的人员和国有公司、企业或者其他\n国有单位委派到非国有公司、企业以及其他单位从事公务的人员有前款行为的，\n依照本法第三百八十二条、第三百八十三条的规定定罪处罚。\n第三百八十二条 【贪污罪】国家工作人员利用职务上的便利，侵吞、窃取、骗\n取或者以其他手段非法占有公共财物的，是贪污罪。\n受国家机关、国有公司、企业、事业单位、人民团体委托管理、经营国有财产的\n人员，利用职务上的便利，侵吞、窃取、骗取或者以其他手段非法占有国有财物\n的，以贪污论。\n与前两款所列人员勾结，伙同贪污的，以共犯论处。\n3. B 项中构成贪污罪。"},{"id":92,"type":"判断题","question":"机关、单位对属于何种密级不明确或者有争议的，由国家保密行政管理部门或者\n省、自治区、直辖市保密行政管理部门按照国家保密规定确定。","choices":[],"answer":"正确","explanation":"《中华人民共和国保守国家秘密法》第二十五条 机关、单位对是否属于国家秘\n密或者属于何种密级不明确或者有争议的，由国家保密行政管理部门或者省、自\n治区、直辖市保密行政管理部门按照国家保密规定确定。"},{"id":93,"type":"单选题","question":"国家安全机关的工作人员依法执行反间谍工作任务时，经出示相应证件，有权查\n验中国公民或者境外人员的（）。","choices":[{"key":"A","text":"财产证明"},{"key":"B","text":"身份证明"},{"key":"C","text":"学历证明"},{"key":"D","text":"纳税证明"}],"answer":"B","explanation":"《中华人民共和国反间谍法》第二十四条 国家安全机关工作人员依法执行反间\n谍工作任务时，依照规定出示工作证件，可以查验中国公民或者境外人员的身份\n证明，向有关个人和组织问询有关情况，对身份不明、有间谍行为嫌疑的人员，\n可以查看其随带物品。"},{"id":94,"type":"多选题","question":"在挪用资金罪中，对“挪用本单位资金归个人使用或者借贷给他人”的理解，正\n确的是（）。","choices":[{"key":"A","text":"挪用本单位资金归本人使用"},{"key":"B","text":"挪用本单位资金给其他自然人使用"},{"key":"C","text":"个人决定以单位名义将挪用资金供其他单位使用，谋取个人利益的"},{"key":"D","text":"挪用人以个人名义将所挪用的资金借给其他单位的"}],"answer":"ABCD","explanation":"《刑法》第二百七十二条 【挪用资金罪】公司、企业或者其他单位的工作人员，\n利用职务上的便利，挪用本单位资金归个人使用或者借贷给他人，数额较大、超\n过三个月未还的，或者虽未超过三个月，但数额较大、进行营利活动的，或者进\n行非法活动的，处三年以下有期徒刑或者拘役；挪用本单位资金数额巨大的，或\n者数额较大不退还的，处三年以上十年以下有期徒刑。\n国有公司、企业或者其他国有单位中从事公务的人员和国有公司、企业或者其他\n国有单位委派到非国有公司、企业以及其他单位从事公务的人员有前款行为的，\n依照本法第三百八十四条的规定定罪处罚。"},{"id":95,"type":"判断题","question":"机关、单位主要负责人及其指定的人员为定密责任人。","choices":[],"answer":"正确","explanation":"《中华人民共和国保守国家秘密法》第十六条 机关、单位主要负责人及其指定\n的人员为定密责任人，负责本机关、本单位的国家秘密确定、变更和解除工作。\n机关、单位确定、变更和解除本机关、本单位的国家秘密，应当由承办人提出具\n体意见，经定密责任人审核批准。"},{"id":96,"type":"单选题","question":"下列不属于法定国家秘密密级的是？","choices":[{"key":"A","text":"绝密级"},{"key":"B","text":"机密级"},{"key":"C","text":"秘密级"},{"key":"D","text":"保密级"}],"answer":"D","explanation":"《中华人民共和国保守国家秘密法》第十四条 国家秘密的密级分为绝密、机密、\n秘密三级。\n绝密级国家秘密是最重要的国家秘密，泄露会使国家安全和利益遭受特别严重的\n损害；机密级国家秘密是重要的国家秘密，泄露会使国家安全和利益遭受严重的\n损害；秘密级国家秘密是一般的国家秘密，泄露会使国家安全和利益遭受损害。"},{"id":97,"type":"多选题","question":"下列情形构成诈骗罪的是（）。","choices":[{"key":"A","text":"甲冒用他人身份办理入网手续并使用移动电话，造成电信资费损失数额较大"},{"key":"B","text":"乙知道他人实施诈骗，为其发布信息提供网络技术支持，情节严重"},{"key":"C","text":"丙以帮被害人的儿子上大学为名，收取被害人 15 万元活动费用后潜逃"},{"key":"D","text":"丁伪造证明材料骗取医疗保险金 2 万元"}],"answer":"ACD","explanation":"1.《刑法》第二百八十七条之二 【帮助信息网络犯罪活动罪】明知他人\n利用信息网络实施犯罪，为其犯罪提供互联网接入、服务器托管、网络存储、通\n讯传输等技术支持，或者提供广告推广、支付结算等帮助，情节严重的，处三年\n以下有期徒刑或者拘役，并处或者单处罚金。\n单位犯前款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任\n人员，依照第一款的规定处罚。\n有前两款行为，同时构成其他犯罪的，依照处罚较重的规定定罪处罚。\n2. B 项中，构成帮助信息网络犯罪活动罪。"},{"id":98,"type":"判断题","question":"张某编造某市政府即将限制本地机动车号牌的虚假信息，在互联网上散布，造成\n市民在多处哄抢机动车，并发生打斗，严重扰乱公共秩序。张某构成寻衅滋事罪。","choices":[],"answer":"正确","explanation":"《刑法》第二百九十三条【寻衅滋事罪】有下列寻衅滋事行为之一，破坏社会秩\n序的，处五年以下有期徒刑、拘役或者管制：\n（一）随意殴打他人，情节恶劣的；\n（二）追逐、拦截、辱骂、恐吓他人，情节恶劣的；\n（三）强拿硬要或者任意损毁、占用公私财物，情节严重的；\n（四）在公共场所起哄闹事，造成公共场所秩序严重混乱的。\n纠集他人多次实施前款行为，严重破坏社会秩序的，处五年以上十年以下有期徒\n刑，可以并处罚金。《最高人民法院最高人民检察院关于办理利用信息网络实施\n诽谤等刑事案件适用法律若干问题的解释》\n第五条利用信息网络辱骂、恐吓他人，情节恶劣，破坏社会秩序的，依照刑法第\n二百九十三条第一款第（二）项的规定，以寻衅滋事罪定罪处罚。\n编造虚假信息，或者明知是编造的虚假信息，在信息网络上散布，或者组织、指\n使人员在信息网络上散布，起哄闹事，造成公共秩序严重混乱的，依照刑法第二\n百九十三条第一款第（四）项的规定，以寻衅滋事罪定罪处罚。"},{"id":99,"type":"单选题","question":"下列情形中，不适用治安调解的有（）。","choices":[{"key":"A","text":"发送信息干扰他人正常生活"},{"key":"B","text":"偷开他人机动车"},{"key":"C","text":"雇凶伤害他人"},{"key":"D","text":"饲养动物干扰他人正常生活"}],"answer":"C","explanation":"《公安机关办理行政案件程序规定》\n《公安机关办理行政案件程序规定》第一百七十九条具有下列情形之一的，不适\n用调解处理：\n（一）雇凶伤害他人的；\n（二）结伙斗殴或者其他寻衅滋事的；\n（三）多次实施违反治安管理行为的；\n（四）当事人明确表示不愿意调解处理的；\n（五）当事人在治安调解过程中又针对对方实施违反治安管理行为的；\n（六）调解过程中，违法嫌疑人逃跑的；\n（七）其他不宜调解处理的。"},{"id":100,"type":"多选题","question":"某小区收费供暖，但温度只有 11 度左右，甲的孩子（9 个月）经常被冻病。甲\n多次找物业都不能给解决，有一天晚上甲和朋友（一个小区的）喝酒回来就去锅\n炉房找锅炉工，理论一番无果，一气之下把锅炉室的配电柜表砸碎，将变压器毁\n坏，导致整个小区供暖中断，并将烧锅炉的乙打成轻伤。关于甲的行为，下列说\n法正确的是（）。","choices":[{"key":"A","text":"构成故意毁坏财物罪"},{"key":"B","text":"构成破坏生产经营罪"},{"key":"C","text":"构成故意伤害罪"},{"key":"D","text":"应当数罪并罚"}],"answer":"B C D","explanation":"《刑法》第二百七十五条 【故意毁坏财物罪】故意毁坏公私财物，数额较大或\n者有其他严重情节的，处三年以下有期徒刑、拘役或者罚金；数额巨大或者有其\n他特别严重情节的，处三年以上七年以下有期徒刑。\n第二百七十六条 【破坏生产经营罪】由于泄愤报复或者其他个人目的，毁坏机\n器设备、残害耕畜或者以其他方法破坏生产经营的，处三年以下有期徒刑、拘役\n或者管制；情节严重的，处三年以上七年以下有期徒刑。"},{"id":101,"type":"判断题","question":"行为人冒充治安联防队员“抓赌”、“抓嫖”、没收赌资或者罚款的行为，构成\n犯罪的，以敲诈勒索罪定罪处罚。","choices":[],"answer":"正确","explanation":"《最高人民法院关于审理抢劫、抢夺刑事案件适用法律若干问题的意见》九、关\n于抢劫罪与相似犯罪的界限\n冒充正在执行公务的人民警察、联防人员，以抓卖淫嫖娼、赌博等违法行为为名\n非法占有财物的行为定性\n行为人冒充正在执行公务的人民警察“抓赌”、“抓嫖”，没收赌资或者罚款的\n行为，构成犯罪的，以招摇撞骗罪从重处罚；在实施上述行为中使用暴力或者暴\n力威胁的，以抢劫罪定罪处罚。行为人冒充治安联防队员“抓赌”、“抓嫖”、\n没收赌资或者罚款的行为，构成犯罪的，以敲诈勒索罪定罪处罚；在实施上述行\n为中使用暴力或者暴力威胁的，以抢劫罪定罪处罚。"},{"id":102,"type":"单选题","question":"根据《治安管理处罚法》的规定，受到罚款处罚的人应当自收到处罚决定书之日\n起（）到指定的银行缴纳罚款。","choices":[{"key":"A","text":"3 日内"},{"key":"B","text":"5 日内"},{"key":"C","text":"10 日内"},{"key":"D","text":"15 日内"}],"answer":"D","explanation":"《治安管理处罚法》第一百二十三条 受到罚款处罚的人应当自收到处罚决定书\n之日起十五日以内，到指定的银行或者通过电子支付系统缴纳罚款。但是，有下\n列情形之一的，人民警察可以当场收缴罚款：\n（一）被处二百元以下罚款，被处罚人对罚款无异议的；\n（二）在边远、水上、交通不便地区，旅客列车上或者口岸，公安机关及其人民\n警察依照本法的规定作出罚款决定后，被处罚人到指定的银行或者通过电子支付\n系统缴纳罚款确有困难，经被处罚人提出的；\n（三）被处罚人在当地没有固定住所，不当场收缴事后难以执行的。"},{"id":103,"type":"多选题","question":"下列关于罪名认定说法正确的是（）。","choices":[{"key":"A","text":"张某出于泄愤报复，纠集 3 名同伙毁坏农田灌溉设备，构成破坏生产经营罪"},{"key":"B","text":"刘某因对村干部不满，毁坏村里用于集体生产的机器设备，造成经济损失\n20000 元，刘某的行为构成故意毁坏财物罪"},{"key":"C","text":"王某因与邻居产生过节，故意砸坏邻居家的汽车，造成其邻居直接经济损失\n5 万元，王某的行为构成故意毁坏财物罪"},{"key":"D","text":"孙某故意毁坏尚未投入使用的公共电信设施，造成公私财物损失 10000 元，\n孙某的行为构成故意毁坏财物罪"}],"answer":"ACD","explanation":"1.《刑法》\n第二百七十五条 【故意毁坏财物罪】故意毁坏公私财物，数额较大或者有其他\n严重情节的，处三年以下有期徒刑、拘役或者罚金；数额巨大或者有其他特别严\n重情节的，处三年以上七年以下有期徒刑。\n第二百七十六条 【破坏生产经营罪】由于泄愤报复或者其他个人目的，毁坏机\n器设备、残害耕畜或者以其他方法破坏生产经营的，处三年以下有期徒刑、拘役\n或者管制；情节严重的，处三年以上七年以下有期徒刑。\n2.B 项中的行为构成破坏生产经营罪。破坏生产经营罪，是指由于泄愤报复或者\n其他个人目的，毁坏机器设备、残害耕畜或者以其他方法破坏生产经营的行为。\n生产经营活动，是指全社会的生产经营活动，包括国有的、集体的、个体的生产\n经营活动。"},{"id":104,"type":"判断题","question":"明知他人实施敲诈勒索犯罪，为其提供网络技术支持，情节严重的，以敲诈勒索\n共同犯罪论处。","choices":[],"answer":"错误","explanation":"1. 《刑法》第二百七十四条【敲诈勒索罪】敲诈勒索公私财物，数额较大或者\n多次敲诈勒索的，处三年以下有期徒刑、拘役或者管制，并处或者单处罚金；数\n额巨大或者有其他严重情节的，处三年以上十年以下有期徒刑，并处罚金；数额\n特别巨大或者有其他特别严重情节的，处十年以上有期徒刑，并处罚金。\n《最高人民法院、最高人民检察院关于办理敲诈勒索刑事案件适用法律若干问题\n的解释》第七条明知他人实施敲诈勒索犯罪，为其提供信用卡、手机卡、通讯工\n具、通讯传输通道、网络技术支持等帮助的，以共同犯罪论处。\n2. 根据《最高人民法院、最高人民检察院关于办理敲诈勒索刑事案件适用法律\n若干问题的解释》 第七条的规定，明知他人实施敲诈勒索犯罪，为其提供信用\n卡、手机卡、通讯工具、通讯传输通道、网络技术支持等帮助的，以共同犯罪论\n处。不需要 “情节严重的”的情节。"},{"id":105,"type":"单选题","question":"《治安管理处罚法》规定：“对被决定给予行政拘留处罚的人，由作出决定的公\n安机关送达拘留所执行。”这里的“送达拘留所执行”，是指（）。","choices":[{"key":"A","text":"作出行政拘留决定的公安机关将被决定行政拘留的人送到拘留所后即为送达"},{"key":"B","text":"作出行政拘留决定的公安机关将被决定行政拘留的人送到拘留所并交付执行\n后即为送达"},{"key":"C","text":"作出行政拘留决定的公安机关将被决定行政拘留的人送到拘留所并交付执行，\n拘留所依法进行体检后即为送达"},{"key":"D","text":"作出行政拘留决定的公安机关将被决定行政拘留的人送到拘留所并交付执行，\n拘留所依法办理入所手续后即为送达"}],"answer":"D","explanation":"公安部关于印发《公安机关执行＜中华人民共和国治安管理处罚法＞有关问题的\n解释》的通知\n关于将被拘留人送达拘留所执行问题。《治安管理处罚法》第 103 条规定：“对\n被决定给予行政拘留处罚的人，由作出决定的公安机关送达拘留所执行。”这里\n的“送达拘留所执行”，是指作出行政拘留决定的公安机关将被决定行政拘留的\n人送到拘留所并交付执行，拘留所依法办理入所手续后即为送达。"},{"id":106,"type":"多选题","question":"招摇撞骗罪，是指冒充国家机关工作人员进行招摇撞骗，以谋取非法利益的行为。\n这种行为包括（）。","choices":[{"key":"A","text":"非国家机关工作人员冒充国家机关工作人员"},{"key":"B","text":"此种国家机关工作人员冒充他种国家机关工作人员的身份或职称"},{"key":"C","text":"冒充高干子弟"},{"key":"D","text":"冒充党员、团员、烈士子弟"}],"answer":"AB","explanation":"1.《刑法》第二百七十九条 【招摇撞骗罪】冒充国家机关工作人员招摇撞骗的，\n处三年以下有期徒刑、拘役、管制或者剥夺政治权利；情节严重的，处三年以上\n十年以下有期徒刑。\n冒充人民警察招摇撞骗的，依照前款的规定从重处罚。\n3. 行为人必须具有冒充国家机关工作人员的身份或者职称的行为。所谓冒充国\n家机关工作人员的身份或者职称，不单是指非国家机关工作人员冒充国家机关工\n作人员，而且也包括此种国家机关工作人员冒充他种国家机关工作人员的身份或\n者职称。"},{"id":107,"type":"判断题","question":"张某编造某市政府即将限制本地机动车号牌的虚假信息，在互联网上散布，造成\n市民在多处哄抢机动车，并发生打斗，严重扰乱公共秩序。张某构成寻衅滋事罪。","choices":[],"answer":"正确","explanation":"《刑法》第二百九十三条 【寻衅滋事罪】有下列寻衅滋事行为之一，破坏社\n会秩序的，处五年以下有期徒刑、拘役或者管制：\n（一）随意殴打他人，情节恶劣的；\n（二）追逐、拦截、辱骂、恐吓他人，情节恶劣的；\n（三）强拿硬要或者任意损毁、占用公私财物，情节严重的；\n（四）在公共场所起哄闹事，造成公共场所秩序严重混乱的。\n纠集他人多次实施前款行为，严重破坏社会秩序的，处五年以上十年以下有期徒\n刑，可以并处罚金。《最高人民法院最高人民检察院关于办理利用信息网络实施\n诽谤等刑事案件适用法律若干问题的解释》\n第五条 利用信息网络辱骂、恐吓他人，情节恶劣，破坏社会秩序的，依照刑法\n第二百九十三条第一款第（二）项的规定，以寻衅滋事罪定罪处罚。\n编造虚假信息，或者明知是编造的虚假信息，在信息网络上散布，或者组织、指\n使人员在信息网络上散布，起哄闹事，造成公共秩序严重混乱的，依照刑法第二\n百九十三条第一款第（四）项的规定，以寻衅滋事罪定罪处罚。"},{"id":108,"type":"单选题","question":"根据《治安管理处罚法》的规定，对扣押的物品，应当会同在场见证人和被扣押\n物品持有人查点清楚，当场开列清单一式二份，一份交给持有人，另一份（）。","choices":[{"key":"A","text":"交给见证人"},{"key":"B","text":"由办案民警保存"},{"key":"C","text":"附卷备查"},{"key":"D","text":"交公安机关财务部门保管"}],"answer":"C","explanation":"《治安管理处罚法》第一百零五条 公安机关办理治安案件，对与案件有关的需\n要作为证据的物品，可以扣押；对被侵害人或者善意第三人合法占有的财产，不\n得扣押，应当予以登记，但是对其中与案件有关的必须鉴定的物品，可以扣押，\n鉴定后应当立即解除。对与案件无关的物品，不得扣押。\n对扣押的物品，应当会同在场见证人和被扣押物品持有人查点清楚，当场开列清\n单一式二份，由调查人员、见证人和持有人签名或者盖章，一份交给持有人，另\n一份附卷备查。\n实施扣押前应当报经公安机关负责人批准；因情况紧急或者物品价值不大，当场\n实施扣押的，人民警察应当及时向其所属公安机关负责人报告，并补办批准手续。\n公安机关负责人认为不应当扣押的，应当立即解除。当场实施扣押的，应当全程\n同步录音录像。\n对扣押的物品，应当妥善保管，不得挪作他用；对不宜长期保存的物品，按照有\n关规定处理。经查明与案件无关或者经核实属于被侵害人或者他人合法财产的，\n应当登记后立即退还；满六个月无人对该财产主张权利或者无法查清权利人的，\n应当公开拍卖或者按照国家有关规定处理，所得款项上缴国库。"},{"id":109,"type":"多选题","question":"甲模仿了有权签发机动车行驶证负责人丁的签字后，签发了 5 本机动车行驶证，\n交给乙，乙将该 5 本机动车行驶证分别卖给了不同的买家，案发后，甲、乙二人\n到案。对甲、乙二人行为定性准确的是（）。","choices":[{"key":"A","text":"对甲的行为以伪造国家机关证件罪定罪处罚"},{"key":"B","text":"对乙的行为以买卖国家机关证件罪定罪处罚"},{"key":"C","text":"对甲的行为以买卖国家机关证件罪的共犯定罪处罚"},{"key":"D","text":"对乙的行为以掩饰、隐瞒犯罪所得罪定罪处罚"}],"answer":"AB","explanation":"1.《刑法》第二百八十条 【伪造、变造、买卖国家机关公文、证件、印章罪】\n【盗窃、抢夺、毁灭国家机关公文、证件、印章罪】伪造、变造、买卖或者盗窃、\n抢夺、毁灭国家机关的公文、证件、印章的，处三年以下有期徒刑、拘役、管制\n或者剥夺政治权利，并处罚金；情节严重的，处三年以上十年以下有期徒刑，并\n处罚金。\n【伪造公司、企业、事业单位、人民团体印章罪】伪造公司、企业、事业单位、\n人民团体的印章的，处三年以下有期徒刑、拘役、管制或者剥夺政治权利，并处\n罚金。\n【伪造、变造、买卖身份证件罪】伪造、变造、买卖居民身份证、护照、社会保\n障卡、驾驶证等依法可以用于证明身份的证件的，处三年以下有期徒刑、拘役、\n管制或者剥夺政治权利，并处罚金；情节严重的，处三年以上七年以下有期徒刑，\n并处罚金。\n2.伪造、变造、买卖国家机关公文、证件、印章罪，是指非法制造、变造、买卖\n国家机关公文、证件、印章的行为。本罪侵犯的客体是国家机关的正常管理活动\n和信誉。"},{"id":110,"type":"判断题","question":"张某盗窃超市被人民法院判处有期徒刑 1 年，缓刑 2 年。因张某曾多次至超市实\n施盗窃，人民法院可在 2 年缓刑期内禁止张某进入超市。","choices":[],"answer":"正确","explanation":"最高人民法院、最高人民检察院、公安部、司法部印发《关于对判处管制、宣告\n缓刑的犯罪分子适用禁止令有关问题的规定（试行）》\n第四条 人民法院可以根据犯罪情况，禁止判处管制、宣告缓刑的犯罪分子在管\n制执行期间、缓刑考验期限内进入以下一类或者几类区域、场所：\n（一）禁止进入夜总会、酒吧、迪厅、网吧等娱乐场所；\n（二）未经执行机关批准，禁止进入举办大型群众性活动的场所；\n（三）禁止进入中小学校区、幼儿园园区及周边地区，确因本人就学、居住等原\n因，经执行机关批准的除外；\n（四）其他确有必要禁止进入的区域、场所。\n第六条禁止令的期限，既可以与管制执行、缓刑考验的期限相同，也可以短于管\n制执行、缓刑考验的期限，但判处管制的，禁止令的期限不得少于三个月，宣告\n缓刑的，禁止令的期限不得少于二个月。\n判处管制的犯罪分子在判决执行以前先行羁押以致管制执行的期限少于三个月\n的，禁止令的期限不受前款规定的最短期限的限制。\n禁止令的执行期限，从管制、缓刑执行之日起计算。"},{"id":111,"type":"单选题","question":"甲盗窃小卖部 400 元后告知乙，并用其中 200 元给乙买了一件衣服，乙欣然接受。\n以下说法正确的是（）。","choices":[{"key":"A","text":"乙的衣服属于违法所得，应予追缴"},{"key":"B","text":"甲剩下的 200 元应予收缴"},{"key":"C","text":"乙收受衣服的行为属于窝藏行为"},{"key":"D","text":"甲、乙构成盗窃的违反治安管理的行为"}],"answer":"A","explanation":"《治安管理处罚法》第十一条 办理治安案件所查获的毒品、淫秽物品等违禁品，\n赌具、赌资，吸食、注射毒品的用具以及直接用于实施违反治安管理行为的本人\n所有的工具，应当收缴，按照规定处理。\n违反治安管理所得的财物，追缴退还被侵害人；没有被侵害人的，登记造册，公\n开拍卖或者按照国家有关规定处理，所得款项上缴国库。"},{"id":112,"type":"多选题","question":"下列行构成犯罪的是（）。","choices":[{"key":"A","text":"甲伪造居民身份证"},{"key":"B","text":"乙伪造护照"},{"key":"C","text":"丙变造社会保障卡"},{"key":"D","text":"丁买卖驾驶证"}],"answer":"ABCD","explanation":"《刑法》第二百八十条 【伪造、变造、买卖国家机关公文、证件、印章罪】【盗\n窃、抢夺、毁灭国家机关公文、证件、印章罪】伪造、变造、买卖或者盗窃、抢\n夺、毁灭国家机关的公文、证件、印章的，处三年以下有期徒刑、拘役、管制或\n者剥夺政治权利，并处罚金；情节严重的，处三年以上十年以下有期徒刑，并处\n罚金。\n【伪造公司、企业、事业单位、人民团体印章罪】伪造公司、企业、事业单位、\n人民团体的印章的，处三年以下有期徒刑、拘役、管制或者剥夺政治权利，并处\n罚金。\n【伪造、变造、买卖身份证件罪】伪造、变造、买卖居民身份证、护照、社会保\n障卡、驾驶证等依法可以用于证明身份的证件的，处三年以下有期徒刑、拘役、\n管制或者剥夺政治权利，并处罚金；情节严重的，处三年以上七年以下有期徒刑，\n并处罚金。"},{"id":113,"type":"判断题","question":"钱某宰杀注水活牛销售，涉案金额近 100 万元。钱某构成生产、销售不符合安全\n标准的食品罪。","choices":[],"answer":"错误","explanation":"《刑法》第 140 条规定，生产者、销售者在产品中掺杂、掺假，以假充真，\n以次充好或者以不合格产品冒充合格产品，销售金额五万元以上不满二十万元\n的，处二年以下有期徒刑或者拘役，并处或者单处销售金额百分之五十以上二倍\n以下罚金；销售金额二十万元以上不满五十万元的，处二年以上七年以下有期徒\n刑，并处销售金额百分之五十以上二倍以下罚金；销售金额五十万元以上不满二\n百万元的，处七年以上有期徒刑，并处销售金额百分之五十以上二倍以下罚金；\n销售金额二百万元以上的，处十五年有期徒刑或者无期徒刑，并处销售金额百分\n之五十以上二倍以下罚金或者没收财产。注水牛肉属于在产品中掺杂、掺假，以\n假充真，销售金额达 100 万元，应构成生产、销售伪劣产品罪。"},{"id":114,"type":"单选题","question":"询问不满多少周岁的违反治安管理行为人，应当通知其父母或者其他监护人到\n场？（ ）","choices":[{"key":"A","text":"14 周岁"},{"key":"B","text":"16 周岁"},{"key":"C","text":"18 周岁"},{"key":"D","text":"20 周岁"}],"answer":"C","explanation":"《治安管理处罚法》第九十八条 询问笔录应当交被询问人核对；对没有阅读能\n力的，应当向其宣读。记载有遗漏或者差错的，被询问人可以提出补充或者更正。\n被询问人确认笔录无误后，应当签名、盖章或者按指印，询问的人民警察也应当\n在笔录上签名。\n被询问人要求就被询问事项自行提供书面材料的，应当准许；必要时，人民警察\n也可以要求被询问人自行书写。\n询问不满十八周岁的违反治安管理行为人，应当通知其父母或者其他监护人到\n场；其父母或者其他监护人不能到场的，也可以通知其他成年亲属，所在学校、\n单位、居住地基层组织或者未成年人保护组织的代表等合适成年人到场，并将有\n关情况记录在案。确实无法通知或者通知后未到场的，应当在笔录中注明。"},{"id":115,"type":"多选题","question":"扰乱体育、文化等大型群众性活动秩序的行为包括以下哪些？","choices":[{"key":"A","text":"强行进入场内的"},{"key":"B","text":"违反规定，在场内燃放烟花爆竹或者其他物品的"},{"key":"C","text":"展示侮辱性标语、条幅等物品的"},{"key":"D","text":"围攻裁判员、运动员或者其他工作人员的"}],"answer":"ABCD","explanation":"《治安管理处罚法》第二十八条 有下列行为之一，扰乱体育、文化等大型群众\n性活动秩序的，处警告或者五百元以下罚款；情节严重的，处五日以上十日以下\n拘留，可以并处一千元以下罚款：\n（一）强行进入场内的；\n（二）违反规定，在场内燃放烟花爆竹或者其他物品的；\n（三）展示侮辱性标语、条幅等物品的；\n（四）围攻裁判员、运动员或者其他工作人员的；\n（五）向场内投掷杂物，不听制止的；\n（六）扰乱大型群众性活动秩序的其他行为。\n因扰乱体育比赛、文艺演出活动秩序被处以拘留处罚的，可以同时责令其六个月\n至一年以内不得进入体育场馆、演出场馆观看同类比赛、演出；违反规定进入体\n育场馆、演出场馆的，强行带离现场，可以处五日以下拘留或者一千元以下罚款。"},{"id":116,"type":"判断题","question":"梁某为非法牟利，明知不得向产蛋期蛋鸡投喂超范围兽药，仍然投喂并出售被喂\n药蛋鸡所产鸡蛋，食用该鸡蛋足以造成严重中毒事故。梁某构成生产、销售有毒、\n有害食品罪。","choices":[],"answer":"正确","explanation":"《刑法》第 144 条规定，在生产、销售的食品中掺入有毒、有害的非食品原料的，\n或者销售明知掺有有毒、有害的非食品原料的食品的，处五年以下有期徒刑，并\n处罚金；对人体健康造成严重危害或者有其他严重情节的，处五年以上十年以下\n有期徒刑，并处罚金；致人死亡或者有其他特别严重情节的，依照本法第一百四\n十一条的规定处罚。梁某明知不得投喂超范围兽药，且食用该鸡蛋足以造成严重\n中毒事故，其行为构成生产、销售有毒、有害食品罪。"},{"id":117,"type":"单选题","question":"醉酒的人违反治安管理的，应当如何处理？（ ）","choices":[{"key":"A","text":"不予处罚"},{"key":"B","text":"从轻处罚"},{"key":"C","text":"减轻处罚"},{"key":"D","text":"给予处罚"}],"answer":"D","explanation":"《治安管理处罚法》第十五条 醉酒的人违反治安管理的，应当给予处罚。\n醉酒的人在醉酒状态中，对本人有危险或者对他人的人身、财产或者公共安全有\n威胁的，应当对其采取保护性措施约束至酒醒。"},{"id":118,"type":"多选题","question":"利用封建迷信、邪教活动实施下列哪些行为，会受到治安管理处罚？","choices":[{"key":"A","text":"组织、教唆、胁迫、诱骗、煽动他人从事邪教活动、会道门活动、非法的宗\n教活动，扰乱社会秩序、损害他人身体健康的"},{"key":"B","text":"冒用宗教、气功名义进行扰乱社会秩序、损害他人身体健康活动的"},{"key":"C","text":"制作、传播宣扬邪教、会道门内容的物品、信息、资料的"},{"key":"D","text":"正常的宗教信仰活动"}],"answer":"ABC","explanation":"《治安管理处罚法》第三十一条 有下列行为之一的，处十日以上十五日以下拘\n留，可以并处二千元以下罚款；情节较轻的，处五日以上十日以下拘留，可以并\n处一千元以下罚款：\n（一）组织、教唆、胁迫、诱骗、煽动他人从事邪教活动、会道门活动、非法的\n宗教活动或者利用邪教组织、会道门、迷信活动，扰乱社会秩序、损害他人身体\n健康的；\n（二）冒用宗教、气功名义进行扰乱社会秩序、损害他人身体健康活动的；\n（三）制作、传播宣扬邪教、会道门内容的物品、信息、资料的。"},{"id":119,"type":"判断题","question":"李某从化工厂购买原料生产盐酸克仑特罗(俗称“瘦肉精”)，掺入饲料并对外销\n售，范围涉及 10 省 50 余家养殖户，涉案金额 100 余万元。李某构成非法经营罪。","choices":[],"answer":"错误","explanation":"最高法、最高检《关于办理非法生产、销售、使用禁止在饲料和动物饮用水中使\n用的药品等刑事案件具体应用法律若干问题的解释》第 3 条规定，使用盐酸克仑\n特罗等禁止在饲料和动物饮用水中使用的药品或者含有该类药品的饲料养殖供\n人食用的动物，或者销售明知是使用该类药品或者含有该类药品的饲料养殖的供\n人食用的动物的，依照刑法第一百四十四条的规定，以生产、销售有毒、有害食\n品罪追究刑事责任。"},{"id":120,"type":"单选题","question":"共同违反治安管理的，应当如何处罚？（ ）","choices":[{"key":"A","text":"对所有行为人同等处罚"},{"key":"B","text":"根据行为人在违反治安管理行为中所起的作用，分别处罚"},{"key":"C","text":"只处罚组织者"},{"key":"D","text":"只处罚主要行为人"}],"answer":"B","explanation":"《治安管理处罚法》第十七条 共同违反治安管理的，根据行为人在违反治安管\n理行为中所起的作用，分别处罚。\n教唆、胁迫、诱骗他人违反治安管理的，按照其教唆、胁迫、诱骗的行为处罚。"},{"id":121,"type":"多选题","question":"违反国家无线电管理规定，有下列哪些行为的，处五日以上十日以下拘留；情节\n严重的，处十日以上十五日以下拘留？","choices":[{"key":"A","text":"故意干扰无线电业务正常进行的"},{"key":"B","text":"对正常运行的无线电台（站）产生有害干扰，经有关主管部门指出后，拒不\n采取有效措施消除的"},{"key":"C","text":"未经批准设置无线电广播电台、通信基站等无线电台（站）的，或者非法使\n用、占用无线电频率，从事违法活动的"},{"key":"D","text":"合法使用民用对讲机的行为"}],"answer":"ABC","explanation":"《治安管理处罚法》第三十二条 违反国家规定，有下列行为之一的，处五日以\n上十日以下拘留；情节严重的，处十日以上十五日以下拘留：\n（一）故意干扰无线电业务正常进行的；\n（二）对正常运行的无线电台（站）产生有害干扰，经有关主管部门指出后，拒\n不采取有效措施消除的；\n（三）未经批准设置无线电广播电台、通信基站等无线电台（站）的，或者非法\n使用、占用无线电频率，从事违法活动的。"},{"id":122,"type":"判断题","question":"超市经营者侯某在面包超过保质期后，以改换包装的方式继续销售，情节特别严\n重。侯某构成销售不符合安全标准的食品罪。","choices":[],"answer":"错误","explanation":"最高法、最高检《关于办理危害食品安全刑事案件适用法律若干问题的解释》第\n15 条规定，生产、销售不符合食品安全标准的食品添加剂，用于食品的包装材\n料、容器、洗涤剂、消毒剂，或者用于食品生产经营的工具、设备等，符合刑法\n第一百四十条规定的，以生产、销售伪劣产品罪定罪处罚。生产、销售用超过保\n质期的食品原料、超过保质期的食品、回收食品作为原料的食品，或者以更改生\n产日期、保质期、改换包装等方式销售超过保质期的食品、回收食品，适用前款\n的规定定罪处罚。实施前两款行为，同时构成生产、销售不符合安全标准的食品\n罪，生产、销售不符合安全标准的产品罪等其他犯罪的，依照处罚较重的规定定\n罪处罚。侯某销售过期面包，构成生产、销售伪劣产品罪。"},{"id":123,"type":"单选题","question":"行政拘留处罚合并执行的，最长不超过多少日？（ ）","choices":[{"key":"A","text":"15 日"},{"key":"B","text":"20 日"},{"key":"C","text":"30 日"},{"key":"D","text":"60 日"}],"answer":"B","explanation":"《治安管理处罚法》第十六条 有两种以上违反治安管理行为的，分别决定，合\n并执行处罚。行政拘留处罚合并执行的，最长不超过二十日。"},{"id":124,"type":"多选题","question":"违反国家规定，对计算机信息系统实施下列哪些行为，造成危害的，应受到治安\n管理处罚？","choices":[{"key":"A","text":"侵入计算机信息系统或者采用其他技术手段，获取计算机信息系统中存储、\n处理或者传输的数据，或者对计算机信息系统实施非法控制的"},{"key":"B","text":"对计算机信息系统功能进行删除、修改、增加、干扰的"},{"key":"C","text":"对计算机信息系统中存储、处理、传输的数据和应用程序进行删除、修改、\n增加的"},{"key":"D","text":"故意制作、传播计算机病毒等破坏性程序的"}],"answer":"ABCD","explanation":"《治安管理处罚法》第三十三条 有下列行为之一，造成危害的，处五日以下拘\n留；情节较重的，处五日以上十五日以下拘留：\n（一）违反国家规定，侵入计算机信息系统或者采用其他技术手段，获取计算机\n信息系统中存储、处理或者传输的数据，或者对计算机信息系统实施非法控制的；\n（二）违反国家规定，对计算机信息系统功能进行删除、修改、增加、干扰的；\n（三）违反国家规定，对计算机信息系统中存储、处理、传输的数据和应用程序\n进行删除、修改、增加的；\n（四）故意制作、传播计算机病毒等破坏性程序的；\n（五）提供专门用于侵入、非法控制计算机信息系统的程序、工具，或者明知他\n人实施侵入、非法控制计算机信息系统的违法犯罪行为而为其提供程序、工具的。"},{"id":125,"type":"判断题","question":"李某曾因盗窃罪被判处有期徒刑 3 年，刑满释放的当年，因琐事将他人打成轻伤。\n到案后，李某态度良好，对被害人进行赔偿，取得被害人谅解并达成和解协议。\n经县级以上公安机关负责人批准，该案可以作为当事人和解的公诉案件办理。","choices":[],"answer":"错误","explanation":"《中华人民共和国刑事诉讼法》第 288 条规定：下列公诉案件，犯罪嫌疑\n人、被告人真诚悔罪，通过向被害人赔偿损失、赔礼道歉等方式获得被害人谅解，\n被害人自愿和解的，双方当事人可以和解：“……犯罪嫌疑人、被告人在五年以\n内曾经故意犯罪的，不适用本章规定的程序。”据此，李某在刑满释放的当年又\n犯罪，属于五年内曾经故意犯罪，不符合当事人和解的条件。"},{"id":126,"type":"单选题","question":"李某违反展览馆禁止携带食品入内的相关规定，不听管理人员劝阻，与其发生口\n角，在展馆入口处大声喧哗吵闹，严重扰乱展览馆公共秩序。民警小吴、小刘接\n警后到场处置，下列做法妥当的是（ ）","choices":[{"key":"A","text":"对李某和管理人员的争执当场调解"},{"key":"B","text":"告知围观群众禁止拍摄民警执法活动"},{"key":"C","text":"查看监控确认其违法事实后进行现场处置"},{"key":"D","text":"当场核实李某的身份，对其进行口头传唤"}],"answer":"D","explanation":"A 项错误，根据《治安管理处罚法》第九条第一款规定：“对于因民间纠\n纷引起的打架斗殴或者损毁他人财物等违反治安管理行为，情节较轻的，公安机\n关可以调解处理。”本题中李某已经严重扰乱展览馆公共秩序，故不可调解。\nB 项错误，对于涉及国家秘密、警务工作秘密、他人隐私、未成年人保护、人员\n死亡、场面血腥、恐怖事件现场等处警现场，应当通过口头、广播、举牌等适当\n方式明示禁止采访、拍摄，必要时可以设围挡。本题中不涉及上述情形。\nC 项错误，查看监控是调查取证的一种方式，但民警到达现场后应首先制止违法\n行为，恢复秩序，调查取证可在现场或事后进行。强调必须“查看监控确认事实\n后再处置”可能延误处置时机，不符合快速反应要求。\nD 项正确，根据《治安管理处罚法》第九十六条第一款规定：“需要传唤违反治\n安管理行为人接受调查的，经公安机关办案部门负责人批准，使用传唤证传唤。\n对现场发现的违反治安管理行为人，人民警察经出示人民警察证，可以口头传唤，\n但应当在询问笔录中注明。”民警核实李某身份后，对其口头传唤至公安机关接\n受调查，符合法律规范，同时能有效控制事态，是妥当的做法。"},{"id":127,"type":"多选题","question":"某网络公司法定代表人解某为获取暴利，与股东辛某决定将公司主业转为利用获\n取的公民信息牟利。从此以公司之名推送贷款广告链接，吸引有贷款需求的人填\n写“公民身份信息、社保和公积金情况、有无负债、工资收入”等相关征信信息。\n同时与银行信贷员联系，吸引他们在 APP 上注册充值。信贷员充值后，解某、辛\n某等人私自将信息出售给信贷员。经调查，解某、辛某等人获利共 450 余万元，\n但目前无法查明本案犯罪嫌疑人获取的公民个人信息数量。下列说法正确的是\n( )","choices":[{"key":"A","text":"本案以公司之名实施犯罪行为，属于单位犯罪。"},{"key":"B","text":"本案中，向他人出售征信信息，构成侵犯公民个人信息罪。"},{"key":"C","text":"虽无法查明获取的公民个人信息数量，但可根据获利数额认定“情节特别严\n重”。"},{"key":"D","text":"向不同信贷员分别出售同一公民个人信息的，信息的条数不应累计计算。"}],"answer":"BC","explanation":"《最高人民法院关于审理单位犯罪案件具体应用法律有关问题的解释》第\n2 条明确规定了例外情形：个人为进行违法犯罪活动而设立的公司、企业、事业\n单位实施犯罪的，或者公司、企业、事业单位设立后，以实施犯罪为主要活动的，\n不以单位犯罪论处。解某、辛某将公司主业转为利用获取的公民信息牟利，不属\n于单位犯罪。因此，A 项错误。\n《刑法》第 253 条之一规定：违反国家有关规定，向他人出售或者提供公民个人\n信息，情节严重的，构成侵犯公民个人信息罪。征信信息属于公民个人信息。因\n此，B 项正确。\n《最高人民法院、最高人民检察院关于办理侵犯公民个人信息刑事案件适用法律\n若干问题的解释》第 5 条规定：非法获取、出售或者提供公民个人信息，具有下\n列情形之一的，应当认定为刑法第二百五十三条之一规定的“情节严重”：……\n（七）违法所得五千元以上的；（八）……。第 6 条规定：具有下列情形之一的，\n应当认定为刑法第二百五十三条之一规定的“情节特别严重”：……（四）违法\n所得五万元以上的。据此，根据获利数额可以认定情节特别严重。因此，C 项正\n确。\n《最高人民法院、最高人民检察院关于办理侵犯公民个人信息刑事案件适用法律\n若干问题的解释》第 11 条规定：向不同单位或者个人分别出售、提供同一公民\n个人信息的，公民个人信息的条数累计计算。因此，D 项错误。"},{"id":128,"type":"判断题","question":"某区公安分局为进一步规范涉企行政执法行为，优化营商环境，遂对企业安全保\n卫进行直接领导，定期开展监督检查。","choices":[],"answer":"错误","explanation":"根据《人民警察法》第六条规定：“公安机关的人民警察按照职责分工，\n依法履行下列职责：（十三）指导和监督国家机关、社会团体、企业事业组织和\n重点建设工程的治安保卫工作，指导治安保卫委员会等群众性组织的治安防范工\n作。”可知公安分局的法定职责是：指导、监督企业落实安全防范措施，而非“直\n接领导”。“直接领导”意味着干预企业内部管理（如安保人员调度、工作安排），\n反而会破坏营商环境。"},{"id":129,"type":"单选题","question":"政府信息公开是公安工作的重要组成部分。市民小张向公安机关申请信息公开，\n下列说法不正确的是（）。","choices":[{"key":"A","text":"小张应当提供自己的身份信息、申请公开信息的名称及文号、获取信息的途径、\n申请用途等内容"},{"key":"B","text":"若小张申请内容不明确，公安机关应当一次性告知小张作出补正"},{"key":"C","text":"若小张的申请数量、频次明显超过合理范围，公安机关可以收取信息处理费"},{"key":"D","text":"若小张申请公开的信息已然公开，公安机关可以告知小张获取途径"}],"answer":"A","explanation":"A 项错误，根据《政府信息公开条例》第二十九条规定：“政府信息公开\n申请应当包括下列内容：（一）申请人的姓名或者名称、身份证明、联系方式；\n（二）申请公开的政府信息的名称、文号或者便于行政机关查询的其他特征性描\n述；（三）申请公开的政府信息的形式要求，包括获取信息的方式、途径。”因\n此，小张不需要提供申请用途。\nB 项正确，根据《政府信息公开条例》第三十条规定：“政府信息公开申请内容\n不明确的，行政机关应当给予指导和释明，并自收到申请之日起 7 个工作日内一\n次性告知申请人作出补正，说明需要补正的事项和合理的补正期限。”因此，若\n小张申请内容不明确，公安机关应当一次性告知小张作出补正。\nC 项正确，根据《政府信息公开条例》第四十二条规定：“行政机关依申请提供\n政府信息，不收取费用。但是，申请人申请公开政府信息的数量、频次明显超过\n合理范围的，行政机关可以收取信息处理费。”因此，若小张的申请数量、频次\n明显超过合理范围，公安机关可以收取信息处理费。\nD 项正确，根据《政府信息公开条例》第三十六条规定：“对政府信息公开申请，\n行政机关所申请公开信息已经主动公开的，应告知申请人获取该政府信息的方\n式、途径。”"},{"id":130,"type":"多选题","question":"甲将父亲生前珍藏的文玩借给乙把玩，乙在某古玩市场将该文玩以合理价格卖给\n不知情的丙，甲得知后痛苦万分。下列表述正确的有（）。","choices":[{"key":"A","text":"所有权尚未转移，丙应当将文玩返还给甲"},{"key":"B","text":"乙、丙之间的买卖合同有效，文玩所有权已转移"},{"key":"C","text":"甲可以起诉乙，并可申请精神损害赔偿"},{"key":"D","text":"甲只能起诉丙，请求返还文玩"}],"answer":"BC","explanation":"A 项错误，根据《民法典》第三百一十一条规定：“无处分权人将不动产\n或者动产转让给受让人的，所有权人有权追回；除法律另有规定外，符合下列情\n形的，受让人取得该不动产或者动产的所有权：（一）受让人受让该不动产或者\n动产时是善意；（二）以合理的价格转让；（三）转让的不动产或者动产依照法\n律规定应当登记的已经登记，不需要登记的已经交付给受让人。受让人依据前款\n规定取得不动产或者动产的所有权的，原所有权人有权向无处分权人请求损害赔\n偿。当事人善意取得其他物权的，参照适用前两款规定。”丙在不知情的状况下\n以合理的价格购买了该文玩，丙属于善意取得，该文玩的所有权已经转移，甲无\n权要求丙返还。\nB 项正确，乙、丙之间的买卖合同是基于双方真实自愿的状况下成立的，且丙不\n知情，并以合理价格购买，乙、丙之间并未恶意串通损害甲的利益，故二人之间\n的合同有效，文玩是动产，自交付之日起所有权便已经转移。\nC 项正确，根据《民法典》第一千一百八十三条规定：“侵害自然人人身权益造\n成严重精神损害的，被侵权人有权请求精神损害赔偿。因故意或者重大过失侵害\n自然人具有人身意义的特定物造成严重精神损害的，被侵权人有权请求精神损害\n赔偿。”该文玩是甲父亲生前珍藏，是具有人身意义的特定物，乙将该文玩卖给\n丙，甲有权请求乙赔偿损失并要求精神损害赔偿。\nD 项错误，丙获得财物是基于善意取得，甲无权要求丙返还财物，只能要求乙进\n行损害赔偿。"},{"id":131,"type":"判断题","question":"有群众举报张 X 曾经运送他人偷越国境，后经公安机关核实，张 X 在三年前有一\n次运送他人偷越国境的违法行为，之后一直表现良好。公安机关应依法不再处罚。","choices":[],"answer":"正确","explanation":"根据《出境入境管理法》第七十二条第一款规定：“协助他人非法出境入\n境的，处二千元以上一万元以下罚款；情节严重的，处十日以上十五日以下拘留，\n并处五千元以上二万元以下罚款，有违法所得的，没收违法所得。”根据《行政\n处罚法》第三十六条规定：“违法行为在二年内未被发现的，不再给予行政处罚；\n涉及公民生命健康安全、金融安全且有危害后果的，上述期限延长至五年。法律\n另有规定的除外。前款规定的期限，从违法行为发生之日起计算；违法行为有连\n续或者继续状态的，从行为终了之日起计算。”
